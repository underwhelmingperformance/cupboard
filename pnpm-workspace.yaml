packages:
  - 'packages/*'
  - 'actions'

allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: false
  sharp: false
  ssh2: false
  workerd: true

minimumReleaseAge: 1440

onlyBuiltDependencies:
  - esbuild
  - workerd
minimumReleaseAgeExclude:
