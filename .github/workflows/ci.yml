name: ci

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    if: always()
    needs:
      [
        static,
        unit,
        server,
        actions,
        scripts,
        e2e,
        e2e-remote-store,
        conformance
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run:
          jq -e 'length > 0 and all(.[]; .result == "success")' <<<
          "$JOB_RESULTS"

  static:
    name: static and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_version: 2.34.7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run:
          pnpm --config.verify-deps-before-run=false check --group static
          --concurrency 1

  unit:
    name: workspace unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_version: 2.34.7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run:
          pnpm --config.verify-deps-before-run=false check --group unit
          --concurrency 1

  server:
    name: server tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_version: 2.34.7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run:
          pnpm --config.verify-deps-before-run=false check --group server
          --concurrency 1

  actions:
    name: action tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_version: 2.34.7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run:
          pnpm --config.verify-deps-before-run=false check --group actions
          --concurrency 1

  scripts:
    name: script tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_version: 2.34.7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run:
          pnpm --config.verify-deps-before-run=false check --group scripts
          --concurrency 1

  conformance:
    name: conformance (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: x86_64-darwin
            runner: macos-26-intel
          - system: aarch64-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_version: 2.34.7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the generated oracle data
        env:
          NIX_SYSTEM: ${{ matrix.system }}
        run: |
          pnpm update:conformance-oracle --system "$NIX_SYSTEM"
          git diff --exit-code -- \
            tests/conformance/oracle.json \
            "packages/nix/src/setting-types.${NIX_SYSTEM}.generated.ts"

      - run: pnpm --config.verify-deps-before-run=false check:conformance

  binary:
    name: binary smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build and smoke-test the single-executable on PRs: it bundles a separate
      # entry point from the type-checked sources, so only running the packaged
      # binary catches a regression in how it boots or reports exit codes.
      - run: pnpm build:binary -- --version v0.0.0-ci --out-dir dist/ci

  flake:
    name: flake build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build the CLI through the flake so a stale pnpm dependency hash or a
      # broken derivation fails here rather than in a consumer's checkout.
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_version: 2.34.7

      - run: nix flake check

      - run: nix run . -- --version

      # Exercise source installation through the same composite action used by
      # the reusable workflows. This coordinate refers to the current checkout,
      # so setup must build the flake package without querying release assets.
      - name: Describe this source revision
        id: source
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          cupboard=$(jq -cn \
            --arg repository "$REPOSITORY" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            '{kind:"source", $repository, $sourceCommit}')
          echo "cupboard=${cupboard}" >> "$GITHUB_OUTPUT"

      - uses: $/actions/setup
        id: source-setup
        with:
          cupboard: ${{ steps.source.outputs.cupboard }}
          checkout-dir: ${{ github.workspace }}

      - name: Verify the source installation
        env:
          CUPBOARD_PATH: ${{ steps.source-setup.outputs.cupboard-path }}
        run: |
          expected=$(git rev-parse --short=7 HEAD)
          test "$("$CUPBOARD_PATH" --version)" = "$expected"
          test -x "$(dirname "$(dirname "$CUPBOARD_PATH")")/libexec/cupboard/cupboard-hook-relay"

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_version: 2.34.7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run:
          node --experimental-transform-types
          --disable-warning=ExperimentalWarning scripts/run-e2e-ci.ts

  e2e-remote-store:
    name: remote Nix store tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_version: 2.34.7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run:
          pnpm --config.verify-deps-before-run=false check --group remote-store
          --concurrency 1

  pipeline-e2e:
    name: publish pipeline e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This tier runs a consumer repository's publication with genuine
      # derivations, the composite action, and an OIDC push to a Worker in
      # workerd. Install the same Nix used by publication jobs. The remote-store
      # leg starts its ssh-ng store in a container supplied by the runner image.
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_version: 2.34.7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --config.verify-deps-before-run=false e2e:pipeline

  action-e2e:
    name: action e2e
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read # read the release's attestation to verify it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exercise the published action against the latest release: this is the
      # only check that runs the composite's runtime dependency install on a
      # clean runner and verifies a release attestation through the GitHub and
      # Sigstore APIs end to end. Tracking the latest release means a new one
      # that breaks attestation verification fails here.
      - uses: $/actions/setup
        id: setup
        with:
          cupboard-version: latest
          release-repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Run the installed binary
        env:
          CUPBOARD_PATH: ${{ steps.setup.outputs.cupboard-path }}
        run: |
          "$CUPBOARD_PATH" --version
          test -x "$(dirname "$CUPBOARD_PATH")/cupboard-hook-relay"

  action-e2e-no-project:
    name: action e2e (no caller project)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read # read the release's attestation to verify it
    steps:
      # A caller can run the action before checking out a project of its own,
      # so the workspace root holds no package.json that pins a pnpm version.
      # This job leaves the workspace empty: the action installs the pnpm
      # version it pins itself.
      - uses: $/actions/setup
        id: setup
        with:
          cupboard-version: latest
          release-repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Run the installed binary
        env:
          CUPBOARD_PATH: ${{ steps.setup.outputs.cupboard-path }}
        run: |
          "$CUPBOARD_PATH" --version
          test -x "$(dirname "$CUPBOARD_PATH")/cupboard-hook-relay"
