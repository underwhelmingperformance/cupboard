name: ci

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --config.verify-deps-before-run=false check

  binary:
    name: binary smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build and smoke-test the single-executable on PRs: it bundles a separate
      # entry point from the type-checked sources, so only running the packaged
      # binary catches a regression in how it boots or reports exit codes.
      - run: pnpm build:binary -- --version v0.0.0-ci --out-dir dist/ci

  flake:
    name: flake build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Build the CLI through the flake so a stale pnpm dependency hash or a
      # broken derivation fails here rather than in a consumer's checkout.
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - run: nix flake check

      - run: nix run . -- --version

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The end-to-end suite drives real Nix store operations against an
      # in-process Worker, so the runner needs a working Nix.
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --config.verify-deps-before-run=false test:e2e

  action-e2e:
    name: action e2e
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read # read the release's attestation to verify it
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Exercise the published action against the latest release: this is the
      # only check that runs the composite's runtime dependency install on a
      # clean runner and verifies a release attestation through the GitHub and
      # Sigstore APIs end to end. Tracking the latest release means a new one
      # that breaks attestation verification fails here.
      - uses: ./actions/setup
        id: setup
        with:
          cupboard-version: latest
          release-repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Run the installed binary
        run: cupboard --version

  action-e2e-no-project:
    name: action e2e (no caller project)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read # read the release's attestation to verify it
    steps:
      # A caller can run the action before checking out a project of its own,
      # so the workspace root holds no package.json that pins a pnpm version.
      # Check this repository out under a subdirectory to leave the root empty
      # and run the action from there: it must install the pnpm version it pins
      # itself rather than failing to find one in the caller's workspace. A
      # local action has to live on disk to be referenced, so the checkout
      # cannot be dropped entirely; placing it off the root is what reproduces
      # the missing-caller-manifest case.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          path: action

      - uses: ./action/actions/setup
        id: setup
        with:
          cupboard-version: latest
          release-repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Run the installed binary
        run: cupboard --version
