name: ci

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm check includes the end-to-end suite, so the check runner needs
      # the same working Nix installation as CI's dedicated end-to-end job.
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --config.verify-deps-before-run=false check

  binary:
    name: binary smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build and smoke-test the single-executable on PRs: it bundles a separate
      # entry point from the type-checked sources, so only running the packaged
      # binary catches a regression in how it boots or reports exit codes.
      - run: pnpm build:binary -- --version v0.0.0-ci --out-dir dist/ci

  flake:
    name: flake build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build the CLI through the flake so a stale pnpm dependency hash or a
      # broken derivation fails here rather than in a consumer's checkout.
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - run: nix flake check

      - run: nix run . -- --version

      # Exercise source installation through the same composite action used by
      # the reusable workflows. This coordinate refers to the current checkout,
      # so setup must build the flake package without querying release assets.
      - name: Describe this source revision
        id: source
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          cupboard=$(jq -cn \
            --arg repository "$REPOSITORY" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            '{kind:"source", $repository, $sourceCommit}')
          echo "cupboard=${cupboard}" >> "$GITHUB_OUTPUT"

      - uses: ./actions/setup
        id: source-setup
        with:
          cupboard: ${{ steps.source.outputs.cupboard }}

      - name: Verify the source installation
        env:
          CUPBOARD_PATH: ${{ steps.source-setup.outputs.cupboard-path }}
        run: |
          expected=$(git rev-parse --short=7 HEAD)
          test "$("$CUPBOARD_PATH" --version)" = "$expected"
          test -x "$(dirname "$(dirname "$CUPBOARD_PATH")")/libexec/cupboard/cupboard-hook-relay"

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The end-to-end suite drives real Nix store operations against an
      # in-process Worker. Exercise the same Nix client and installer as the
      # reusable publication action.
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_version: 2.34.7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --config.verify-deps-before-run=false check:e2e

      - run: pnpm --config.verify-deps-before-run=false check:e2e-remote-store

      # The conformance suite compares our client with the Nix binary pinned by
      # the flake. It runs only on Ubuntu in CI; developers run the
      # Darwin-specific configuration cases locally.
      - run: pnpm --config.verify-deps-before-run=false check:conformance

  pipeline-e2e:
    name: publish pipeline e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This tier runs a consumer repository's publication for real: a flake
      # with genuine derivations, the composite action's own steps, a build,
      # and a push over OIDC to a Worker in workerd. It needs the same Nix a
      # publishing job gets. The remote-store leg starts its ssh-ng store in a
      # container; the runner image provides the engine.
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_version: 2.34.7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The tier's last leg publishes from a release archive rather than from
      # this checkout's sources, so build one with the script the release
      # workflow runs and name it for the tier. Without it that leg skips.
      - id: archive
        run: pnpm build:binary -- --version v0.0.0-ci --out-dir dist/pipeline

      - run: pnpm --config.verify-deps-before-run=false e2e:pipeline
        env:
          CUPBOARD_RELEASE_ARCHIVE: ${{ steps.archive.outputs.asset-path }}

  action-e2e:
    name: action e2e
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read # read the release's attestation to verify it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exercise the published action against the latest release: this is the
      # only check that runs the composite's runtime dependency install on a
      # clean runner and verifies a release attestation through the GitHub and
      # Sigstore APIs end to end. Tracking the latest release means a new one
      # that breaks attestation verification fails here.
      - uses: ./actions/setup
        id: setup
        with:
          cupboard-version: latest
          release-repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Run the installed binary
        env:
          CUPBOARD_PATH: ${{ steps.setup.outputs.cupboard-path }}
        run: |
          "$CUPBOARD_PATH" --version
          test -x "$(dirname "$CUPBOARD_PATH")/cupboard-hook-relay"

  action-e2e-no-project:
    name: action e2e (no caller project)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read # read the release's attestation to verify it
    steps:
      # A caller can run the action before checking out a project of its own,
      # so the workspace root holds no package.json that pins a pnpm version.
      # Check this repository out under a subdirectory to leave the root empty
      # and run the action from there: it must install the pnpm version it pins
      # itself rather than failing to find one in the caller's workspace. A
      # local action has to live on disk to be referenced, so the checkout
      # cannot be dropped entirely; placing it off the root is what reproduces
      # the missing-caller-manifest case.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: action

      - uses: ./action/actions/setup
        id: setup
        with:
          cupboard-version: latest
          release-repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Run the installed binary
        env:
          CUPBOARD_PATH: ${{ steps.setup.outputs.cupboard-path }}
        run: |
          "$CUPBOARD_PATH" --version
          test -x "$(dirname "$CUPBOARD_PATH")/cupboard-hook-relay"
