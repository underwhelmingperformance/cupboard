# Publishes CI builds to the cupboard tenant on cupboard.supply: every pull
# request to a short-lived cache of its own, and every push to main to the
# default cache that flake consumers substitute from. The jobs live apart from
# ci.yml because their reusable-workflow reference resolves against main when
# the run starts: publishing availability must not gate the check suite.
name: cache publish

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The reusable workflow stays on @main for the tenant trust rule, while its
  # CLI is pinned to a specific release. This avoids resolving a release from
  # the mutable ref during the run.
  publish-pr:
    name: publish (pr cache)
    if: github.event_name == 'pull_request'
    permissions:
      attestations: write # record the build provenance on the repository
      contents: read # check out the flake source
      id-token: write # OIDC token for the cache push and Sigstore signing
    # The @main reference is load-bearing: the tenant's trust rule pins the
    # job_workflow_ref claim to this file at refs/heads/main.
    uses: underwhelmingperformance/cupboard/.github/workflows/cupboard-publish.yml@main # zizmor: ignore[unpinned-uses]
    with:
      url: https://cupboard.supply/t/cupboard
      trusted-public-key: cupboard-1:tiaTSFvY6LqLUwbjsNcig64LnxZ+T5EQgW5Cr4XjXqU=
      cache: pr-${{ github.event.pull_request.number }}
      root:
        github:${{ github.repository }}/pr-${{ github.event.pull_request.number
        }}
      ttl: 14d
      cupboard-version: v0.0.19

  publish-main:
    name: publish (default cache)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      attestations: write # record the build provenance on the repository
      contents: read # check out the flake source
      id-token: write # OIDC token for the cache push and Sigstore signing
    # The @main reference is load-bearing: the tenant's trust rule pins the
    # job_workflow_ref claim to this file at refs/heads/main.
    uses: underwhelmingperformance/cupboard/.github/workflows/cupboard-publish.yml@main # zizmor: ignore[unpinned-uses]
    with:
      url: https://cupboard.supply/t/cupboard
      trusted-public-key: cupboard-1:tiaTSFvY6LqLUwbjsNcig64LnxZ+T5EQgW5Cr4XjXqU=
      root: github:${{ github.repository }}/main
      cupboard-version: v0.0.19
