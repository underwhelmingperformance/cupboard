# Build a typed set of flake outputs and publish each target under its own
# root.
name: cupboard flake publish

on:
  workflow_call:
    inputs:
      url:
        description: Tenant URL to publish to.
        required: true
        type: string
      targets:
        description: Flake attribute that evaluates to the target manifest.
        required: false
        default: '.#cupboardOutputs'
        type: string
      preset:
        description:
          Choose the cache, root prefix and TTL from the event that triggered
          the run. The only preset is pull-request-and-branch. A pull_request
          run publishes to the cache gh-<repository-id>-pr-<number>, which the
          workflow creates if needed, with roots under
          github:<repository>/pr-<number>/ that expire after 14 days. When an
          unmerged pull request is closed, the run removes that pull request's
          cache. A run on the branch in the branch input publishes to the
          default cache, with permanent roots under
          github:<repository>/<branch>/. The preset fails any other run. Cannot
          be combined with cache, root-prefix, ttl or permanent. Leave empty to
          set those inputs yourself.
        required: false
        default: ''
        type: string
      branch:
        description:
          Branch whose runs publish to the default cache under the
          pull-request-and-branch preset. Must match the --branch option of
          cupboard github setup.
        required: false
        default: main
        type: string
      cache:
        description:
          Named cache to publish to. Leave empty to publish to the default
          cache. If the cache is private, pass a credential that reads it as the
          destination_read_user and destination_read_password secrets.
        required: false
        default: ''
        type: string
      root-prefix:
        description:
          Start of every target's root name. The target's rootSuffix follows it.
          Required unless preset is set.
        required: false
        default: ''
        type: string
      ttl:
        description:
          How long each target's root lasts after it was last set, such as 14d.
          If ttl is empty and permanent is false, the roots follow the cache's
          retention settings.
        required: false
        default: ''
        type: string
      permanent:
        description: Keep every target's root until it is replaced or removed.
        required: false
        default: false
        type: boolean
      run-root-ttl:
        description:
          How long the run root lasts, such as 7d or 12h. Every cohort job adds
          the paths that it publishes to the run root, so a later cohort can
          download a shared dependency from the cache instead of building it
          again.
        required: false
        default: '24h'
        type: string
      run-root-permanent:
        description:
          Keep the run root permanently. Set run-root-ttl to an empty string
          when you turn this on.
        required: false
        default: false
        type: boolean
      reuse-view:
        description:
          Reuse view to read through, for paths that the destination cache does
          not have. The workflow refuses a view unless its priority number is
          greater than the destination's. With the preset, only runs on the
          branch use a view, and they default to pull-requests-<repository-id>.
          Leave empty for no view.
        required: false
        default: ''
        type: string
      trusted-public-key:
        description:
          Nix public key to trust for reads from the tenant's caches. If empty,
          each job downloads the tenant's current key from /pubkey and trusts
          it.
        required: false
        default: ''
        type: string
      cupboard-version:
        description:
          An exact cupboard release tag to install, or latest. If empty, the
          workflow installs the release that was published from its own commit.
          If there is no such release, it builds cupboard from that commit.
        required: false
        type: string
      maximise-space:
        description:
          Free disk space before building by deleting preinstalled software,
          such as language toolchains, the Android and .NET SDKs and Docker
          images on Linux, and Xcode on macOS. The software is not restored, so
          only use this on ephemeral GitHub-hosted runners.
        required: false
        default: false
        type: boolean
      push:
        description:
          Publish the cohorts' outputs. When false, the run builds every cohort
          without checking the cache, and publishes and signs nothing.
        required: false
        default: true
        type: boolean
      gc-between-cohorts:
        description:
          Run garbage collection on the runner's Nix store after each cohort in
          a job has been published. This frees the disk space that the published
          paths used, and a later build downloads them from the cache if it
          needs them. It only happens on GitHub-hosted runners that use their
          own store. On a self-hosted runner, or when store is set, the job
          prints a notice and leaves the store as it is.
        required: false
        default: false
        type: boolean
      nix-config:
        description:
          Flake attribute that evaluates to extra nix.conf text for the plan and
          cohort jobs. These settings override the workflow's own, such as
          always-allow-substitutes.
        required: false
        default: ''
        type: string
      input-known-hosts:
        description:
          known_hosts lines for every SSH host that serves a private flake
          input. Required when input_ssh_key is set.
        required: false
        default: ''
        type: string
      builders:
        description:
          Nix builders specification on one line, as in nix.conf, for targets
          with remote set to true. Separate several builders with semicolons.
          Cannot be combined with store. Put '-' in the SSH key column, and do
          not set an ssh-key parameter in any builder URI. Supply the private
          key as the builder_ssh_key secret.
        required: false
        default: ''
        type: string
      builder-known-hosts:
        description:
          known_hosts lines for every remote builder. Required when builders is
          set.
        required: false
        default: ''
        type: string
      store-known-hosts:
        description:
          known_hosts lines for the remote store. Required unless the store uses
          port 22 and its URI includes base64-ssh-public-host-key.
        required: false
        default: ''
        type: string
      store-ambient-identity:
        description:
          Connect to the remote store with the runner's SSH agent or default key
          files instead of store_ssh_key. Only use this on a self-hosted runner
          that is dedicated to this job. When it is false and store_ssh_key is
          not set, the job fails instead of using the runner's own keys.
        required: false
        default: false
        type: boolean
      store:
        description:
          ssh-ng:// URI of a remote store. Every cohort job plans, builds and
          publishes using that store, so the build outputs never reach the
          runner's disk. Packing also measures sizes in this store. If empty,
          each job uses its runner's store. Supply the private key as
          store_ssh_key, not as an ssh-key parameter in the URI.
        required: false
        default: ''
        type: string
      plan-runner:
        description:
          Runner label for the configure, plan and cache-removal jobs. The plan
          job evaluates the flake with the input SSH key and can request an OIDC
          token. If your repository has self-hosted runners, keep this on a
          GitHub-hosted label or restrict the job with runner groups. See
          docs/security.md#runners.
        required: false
        default: ubuntu-latest
        type: string
      enable-packing:
        description:
          Pack small single-target cohorts into as few jobs as fit within
          pack-capacity, using measured closure sizes. Without packing, each
          cohort gets its own job. Off by default. A cohort without a
          measurement is not packed.
        required: false
        default: false
        type: boolean
      pack-capacity:
        description:
          Disk space in bytes that each packed job can use. Required when
          enable-packing is true.
        required: false
        default: ''
        type: string
    secrets:
      builder_ssh_key:
        description: SSH private key for the remote builders.
        required: false
      builder_ssh_config:
        description:
          ssh_config text for the remote builders. Every setting must be inside
          a Host block. Only HostName, User, Port, connection tuning, algorithm,
          keep-alive and SetEnv settings are accepted. Settings that run
          commands, use proxies, forward connections, load other identities,
          share connections, change the log level, or use Include or Match are
          refused.
        required: false
      store_ssh_key:
        description: SSH private key for the remote store.
        required: false
      store_ssh_config:
        description:
          ssh_config text for the remote store. Every setting must be inside a
          Host block. Only HostName, User, Port, connection tuning, algorithm,
          keep-alive and SetEnv settings are accepted. Settings that run
          commands, use proxies, forward connections, load other identities,
          share connections, change the log level, or use Include or Match are
          refused.
        required: false
      input_ssh_key:
        description:
          SSH private key for fetching private flake inputs. Requires
          input-known-hosts.
        required: false
      destination_read_user:
        description:
          User name of a read credential for the private cache that the run
          publishes to. If the run uses a reuse view, the workflow checks this
          credential before it publishes anything.
        required: false
      destination_read_password:
        description:
          Password of a read credential for the private cache that the run
          publishes to.
        required: false
      fallback_read_user:
        description:
          User name of the tenant read credential, for reading a private reuse
          view. With the preset, setting it also makes new pull-request caches
          private.
        required: false
      fallback_read_password:
        description:
          Password of the tenant read credential, for reading a private reuse
          view.
        required: false
      private_substituters:
        description:
          URLs of other private caches to read from, one per line, with the
          credential in each URL.
        required: false

permissions: {}

jobs:
  # Resolve cupboard, the cache, root prefix, TTL, and reuse view once. Every
  # later job uses these validated values. This job executes code only from the
  # reusable workflow's immutable checkout.
  configure:
    name: Resolve the publication inputs
    runs-on: ${{ inputs.plan-runner }}
    timeout-minutes: 10
    permissions:
      contents: read # resolve cupboard releases
    outputs:
      cupboard: ${{ steps.resolve-cupboard.outputs.cupboard }}
      cache: ${{ steps.resolve.outputs.cache }}
      root-prefix: ${{ steps.resolve.outputs.root-prefix }}
      ttl: ${{ steps.resolve.outputs.ttl }}
      permanent: ${{ steps.resolve.outputs.permanent }}
      reuse-view: ${{ steps.resolve.outputs.reuse-view }}
      provision-cache: ${{ steps.resolve.outputs.provision-cache }}
      provision-cache-ttl: ${{ steps.resolve.outputs.provision-cache-ttl }}
      remove-cache: ${{ steps.resolve.outputs.remove-cache }}
    steps:
      - name: Require GitHub Cloud workflow identity
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          if [ "${GITHUB_SERVER_URL}" != https://github.com ]; then
            echo '::error::The reusable cupboard workflows require GitHub Cloud because GitHub Enterprise Server does not provide job.workflow_repository, job.workflow_ref or job.workflow_sha'
            exit 1
          fi

      - uses: $/actions/resolve-cupboard
        id: resolve-cupboard
        with:
          cupboard-version: ${{ inputs.cupboard-version }}
          workflow-repository: ${{ job.workflow_repository }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          github-token: ${{ github.token }}
          github-api-url: ${{ github.api_url }}
          github-graphql-url: ${{ github.graphql_url }}

      - name: Resolve inputs
        id: resolve
        env:
          PRESET: ${{ inputs.preset }}
          PUSH: ${{ inputs.push }}
          CACHE: ${{ inputs.cache }}
          ROOT_PREFIX: ${{ inputs.root-prefix }}
          TTL: ${{ inputs.ttl }}
          PERMANENT: ${{ inputs.permanent }}
          REUSE_VIEW: ${{ inputs.reuse-view }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          REF: ${{ github.ref }}
          BRANCH: ${{ inputs.branch }}
          STORE: ${{ inputs.store }}
          STORE_AMBIENT_IDENTITY: ${{ inputs.store-ambient-identity }}
          BUILDERS: ${{ inputs.builders }}
          BUILDER_KNOWN_HOSTS: ${{ inputs.builder-known-hosts }}
          STORE_KNOWN_HOSTS: ${{ inputs.store-known-hosts }}
        run: |
          set -euo pipefail
          for name in PRESET CACHE ROOT_PREFIX TTL REUSE_VIEW BRANCH; do
            if [[ "${!name}" == *$'\n'* || "${!name}" == *$'\r'* ]]; then
              echo "::error::${name} must not contain line breaks"
              exit 1
            fi
          done
          if [[ "${BUILDERS}" == *$'\n'* || "${BUILDERS}" == *$'\r'* ]]; then
            echo '::error::builders must not contain line breaks; separate inline builders with semicolons'
            exit 1
          fi
          if [ -n "${STORE}" ] && [ -n "${BUILDERS}" ]; then
            echo '::error::store and builders select different build modes and are mutually exclusive'
            exit 1
          fi
          if [ "${STORE_AMBIENT_IDENTITY}" = true ] && [ -z "${STORE}" ]; then
            echo '::error::store-ambient-identity requires the store input'
            exit 1
          fi
          if [ -n "${BUILDERS}" ] && [[ ! "${BUILDER_KNOWN_HOSTS}" =~ [^[:space:]] ]]; then
            echo '::error::builder-known-hosts is required when builders are enabled'
            exit 1
          fi

          store_uri_has_host_key=false
          if [[ "${STORE}" == *'?'* ]]; then
            store_query="${STORE#*\?}"
            store_query="${store_query%%#*}"
            IFS='&' read -r -a store_parameters <<< "${store_query}"
            for parameter in "${store_parameters[@]}"; do
              case "${parameter}" in
                base64-ssh-public-host-key=?*)
                  store_uri_has_host_key=true
                  break
                  ;;
                base64-ssh-public-host-key=)
                  break
                  ;;
              esac
            done
          fi

          store_uri_uses_default_ssh_port=false
          if [[ "${STORE}" == ssh-ng://* ]]; then
            store_authority="${STORE#ssh-ng://}"
            store_authority="${store_authority%%[/?#]*}"
            store_destination="${store_authority##*@}"
            store_port=''
            if [[ "${store_destination}" == \[*\] ]]; then
              store_port=''
            elif [[ "${store_destination}" == \[*\]:* ]]; then
              store_port="${store_destination##*]:}"
            elif [[ "${store_destination}" == *:* ]]; then
              store_port="${store_destination##*:}"
            fi
            if [ -z "${store_port}" ] || [ "${store_port}" = 22 ]; then
              store_uri_uses_default_ssh_port=true
            fi
          fi

          if [ -n "${STORE}" ] && [[ ! "${STORE_KNOWN_HOSTS}" =~ [^[:space:]] ]]; then
            if [ "${store_uri_has_host_key}" != true ]; then
              echo '::error::store-known-hosts is required unless the store URI supplies base64-ssh-public-host-key'
              exit 1
            fi
            if [ "${store_uri_uses_default_ssh_port}" != true ]; then
              echo '::error::store-known-hosts is required for a nonstandard SSH port; URI-only host-key pinning supports only the default SSH port'
              exit 1
            fi
          fi
          case "${PRESET}" in
            '')
              if [ -z "${ROOT_PREFIX}" ]; then
                echo '::error::root-prefix is required when no preset derives it'
                exit 1
              fi
              ;;
            pull-request-and-branch)
              if [ -n "${CACHE}${ROOT_PREFIX}${TTL}" ] || [ "${PERMANENT}" = true ]; then
                echo '::error::preset is mutually exclusive with cache, root-prefix, ttl and permanent'
                exit 1
              fi
              if [ "${EVENT_NAME}" = pull_request ]; then
                if [ -z "${HEAD_REPOSITORY_ID}" ] || [ "${HEAD_REPOSITORY_ID}" != "${REPOSITORY_ID}" ]; then
                  echo "::error::pull-request publication accepts only pull requests from this repository; guard the job with github.event.pull_request.head.repo.id == github.repository_id"
                  exit 1
                fi
                # Match pullRequestCacheTemplate and the prefix used by
                # cupboard github setup's repository view.
                CACHE="gh-${REPOSITORY_ID}-pr-${PR_NUMBER}"
                if [ "${EVENT_ACTION}" = closed ] && [ "${MERGED}" != true ]; then
                  REMOVE_CACHE="${CACHE}"
                fi
                TTL=14d
                PERMANENT=false
                if [ "${PUSH}" = true ]; then
                  PROVISION_CACHE="${CACHE}"
                fi
                if [ -n "${REUSE_VIEW}" ]; then
                  echo "::notice::reuse-view '${REUSE_VIEW}' applies to non-pull-request runs; disabled for this run"
                fi
                REUSE_VIEW=''
                # Match pullRequestRootTemplate in packages/cli.
                ROOT_PREFIX="github:${REPOSITORY}/pr-${PR_NUMBER}"
              elif [ "${REF}" = "refs/heads/${BRANCH}" ]; then
                ROOT_PREFIX="github:${REPOSITORY}/${BRANCH}"
                PERMANENT=true
                # Match pullRequestViewName in packages/cli.
                if [ -z "${REUSE_VIEW}" ]; then
                  REUSE_VIEW="pull-requests-${REPOSITORY_ID}"
                fi
              else
                echo "::error::preset 'pull-request-and-branch' accepts pull_request runs or refs/heads/${BRANCH}; got event '${EVENT_NAME}' on '${REF}'"
                exit 1
              fi
              ;;
            *)
              echo "::error::unknown preset '${PRESET}'"
              exit 1
              ;;
          esac
          {
            echo "cache=${CACHE}"
            echo "root-prefix=${ROOT_PREFIX}"
            echo "ttl=${TTL}"
            echo "permanent=${PERMANENT}"
            echo "reuse-view=${REUSE_VIEW}"
            echo "provision-cache=${PROVISION_CACHE:-}"
            echo "provision-cache-ttl=${TTL}"
            echo "remove-cache=${REMOVE_CACHE:-}"
          } >> "${GITHUB_OUTPUT}"

  plan:
    name: Plan the publication
    needs: configure
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ${{ inputs.plan-runner }}
    timeout-minutes: 30
    permissions:
      attestations: read # verify a selected cupboard release
      contents: read # check out the flake source
      id-token: write # OIDC token for the retention-root ensure calls
    outputs:
      cohort-matrix: ${{ steps.plan.outputs.cohort-matrix }}
      cohort-count: ${{ steps.plan.outputs.cohort-count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/actions/prepare
        with:
          ssh-key: ${{ secrets.input_ssh_key }}
          input-known-hosts: ${{ inputs.input-known-hosts }}
          nix-config: ${{ inputs.nix-config }}
          # Evaluating closure roots can realise derivations for their target
          # systems, so planning needs the caller's builders as well.
          remote: ${{ inputs.builders != '' && inputs.store == '' }}
          store: ${{ inputs.store }}
          builders: ${{ inputs.store == '' && inputs.builders || '' }}
          builder-ssh-key:
            ${{ inputs.builders != '' && inputs.store == '' &&
            secrets.builder_ssh_key || '' }}
          builder-ssh-config:
            ${{ inputs.builders != '' && inputs.store == '' &&
            secrets.builder_ssh_config || '' }}
          builder-known-hosts:
            ${{ inputs.builders != '' && inputs.store == '' &&
            inputs.builder-known-hosts || '' }}
          store-ssh-key:
            ${{ inputs.store != '' && secrets.store_ssh_key || '' }}
          store-ssh-config:
            ${{ inputs.store != '' && secrets.store_ssh_config || '' }}
          store-known-hosts:
            ${{ inputs.store != '' && inputs.store-known-hosts || '' }}
          store-ambient-identity:
            ${{ inputs.store != '' && inputs.store-ambient-identity || false }}

      # A source acquisition builds cupboard from a git checkout, so fetch the
      # workflow's own source for that case. Reserve the path first so
      # actions/checkout cannot replace caller-controlled content.
      - name: Reserve the cupboard workflow checkout
        if: ${{ fromJSON(needs.configure.outputs.cupboard).kind == 'source' }}
        env:
          CUPBOARD_WORKFLOW_CHECKOUT: ${{ github.workspace }}/.cupboard-workflow
        run: |
          set -euo pipefail
          if [ -e "${CUPBOARD_WORKFLOW_CHECKOUT}" ] || [ -L "${CUPBOARD_WORKFLOW_CHECKOUT}" ]; then
            echo '::error::The caller checkout already contains .cupboard-workflow; refusing to replace caller content'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ fromJSON(needs.configure.outputs.cupboard).kind == 'source' }}
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cupboard-workflow
          persist-credentials: false

      - uses: $/actions/setup
        id: setup
        with:
          cache-url: ${{ inputs.url }}
          cache: ${{ needs.configure.outputs.cache }}
          cupboard: ${{ needs.configure.outputs.cupboard }}
          provision-cache: ${{ needs.configure.outputs.provision-cache }}
          provision-cache-access:
            ${{ secrets.fallback_read_user != '' && 'private' || 'public' }}
          provision-cache-ttl:
            ${{ needs.configure.outputs.provision-cache-ttl }}
          trusted-public-key: ${{ inputs.trusted-public-key }}
          destination-read-user: ${{ secrets.destination_read_user }}
          destination-read-password: ${{ secrets.destination_read_password }}
          read-user: ${{ secrets.fallback_read_user }}
          read-password: ${{ secrets.fallback_read_password }}
          private-substituters: ${{ secrets.private_substituters }}
          reuse-view: ${{ needs.configure.outputs.reuse-view }}
          checkout-dir: ${{ github.workspace }}/.cupboard-workflow

      - name: Evaluate target manifest
        id: targets
        env:
          TARGETS: ${{ inputs.targets }}
          PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          if [[ "${PUSH}" == true ]]; then
            manifest=$(nix eval --json "${TARGETS}")
          else
            manifest=$(
              nix eval --json "${TARGETS}" \
                --apply 'targets: map (target: builtins.removeAttrs target ["rootDrvPath"]) targets'
            )
          fi
          echo "manifest=${manifest}" >> "${GITHUB_OUTPUT}"

      - uses: $/actions/plan
        id: plan
        with:
          targets: ${{ steps.targets.outputs.manifest }}
          url: ${{ inputs.url }}
          cupboard-path: ${{ steps.setup.outputs.cupboard-path }}
          cache: ${{ needs.configure.outputs.cache }}
          root-prefix: ${{ needs.configure.outputs.root-prefix }}
          ttl: ${{ needs.configure.outputs.ttl }}
          permanent: ${{ needs.configure.outputs.permanent }}
          optimise: ${{ inputs.push }}
          read-user: ${{ secrets.destination_read_user }}
          read-password: ${{ secrets.destination_read_password }}
          enable-packing: ${{ inputs.enable-packing }}
          pack-capacity: ${{ inputs.pack-capacity }}
          store: ${{ inputs.store }}
          # A retention root does not prove that provenance was attached.
          # Re-run cached targets so a previous attachment failure is retried.
          require-provenance: ${{ inputs.push }}

      - name: Summarise plan
        env:
          RETAINED: ${{ steps.plan.outputs.retained-count }}
          PLAN_FILE: ${{ steps.plan.outputs.plan-file }}
        run: |
          {
            echo '## Cupboard publication plan'
            echo
            echo "- Retained without building: ${RETAINED}"
            echo "- Independent targets: $(jq '.targets | length' "${PLAN_FILE}")"
          } >> "${GITHUB_STEP_SUMMARY}"

  cohort:
    needs: [configure, plan]
    if: ${{ needs.plan.outputs.cohort-count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.cohort-matrix) }}
    name: ${{ matrix.key }}
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 180
    permissions:
      attestations: write # record build provenance on the repository
      contents: read # check out the flake source
      id-token: write # OIDC token for the partition, roots.ensure and the push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/actions/prepare
        with:
          ssh-key: ${{ secrets.input_ssh_key }}
          input-known-hosts: ${{ inputs.input-known-hosts }}
          nix-config: ${{ inputs.nix-config }}
          maximise-space: ${{ inputs.maximise-space }}
          remote: ${{ matrix.remote && inputs.store == '' }}
          store: ${{ inputs.store }}
          builders:
            ${{ matrix.remote && inputs.store == '' && inputs.builders || '' }}
          builder-ssh-key:
            ${{ matrix.remote && inputs.store == '' && secrets.builder_ssh_key
            || '' }}
          builder-ssh-config:
            ${{ matrix.remote && inputs.store == '' &&
            secrets.builder_ssh_config || '' }}
          builder-known-hosts:
            ${{ matrix.remote && inputs.store == '' &&
            inputs.builder-known-hosts || '' }}
          store-ssh-key:
            ${{ inputs.store != '' && secrets.store_ssh_key || '' }}
          store-ssh-config:
            ${{ inputs.store != '' && secrets.store_ssh_config || '' }}
          store-known-hosts:
            ${{ inputs.store != '' && inputs.store-known-hosts || '' }}
          store-ambient-identity:
            ${{ inputs.store != '' && inputs.store-ambient-identity || false }}

      # A source acquisition builds cupboard from a git checkout, so fetch the
      # workflow's own source for that case. Reserve the path first so
      # actions/checkout cannot replace caller-controlled content.
      - name: Reserve the cupboard workflow checkout
        if: ${{ fromJSON(needs.configure.outputs.cupboard).kind == 'source' }}
        env:
          CUPBOARD_WORKFLOW_CHECKOUT: ${{ github.workspace }}/.cupboard-workflow
        run: |
          set -euo pipefail
          if [ -e "${CUPBOARD_WORKFLOW_CHECKOUT}" ] || [ -L "${CUPBOARD_WORKFLOW_CHECKOUT}" ]; then
            echo '::error::The caller checkout already contains .cupboard-workflow; refusing to replace caller content'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ fromJSON(needs.configure.outputs.cupboard).kind == 'source' }}
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cupboard-workflow
          persist-credentials: false

      - uses: $/actions/setup
        id: setup
        with:
          cache-url: ${{ inputs.url }}
          cache: ${{ needs.configure.outputs.cache }}
          cupboard: ${{ needs.configure.outputs.cupboard }}
          trusted-public-key: ${{ inputs.trusted-public-key }}
          destination-read-user: ${{ secrets.destination_read_user }}
          destination-read-password: ${{ secrets.destination_read_password }}
          read-user: ${{ secrets.fallback_read_user }}
          read-password: ${{ secrets.fallback_read_password }}
          private-substituters: ${{ secrets.private_substituters }}
          reuse-view: ${{ needs.configure.outputs.reuse-view }}
          checkout-dir: ${{ github.workspace }}/.cupboard-workflow

      - uses: $/actions/build-cohort
        id: build-cohort
        with:
          cohort-json: ${{ toJSON(matrix) }}
          # The planner requires every member of a cohort to use the same value.
          # The action treats a failure as best-effort only when it can
          # attribute the failure to a target; infrastructure and unbounded
          # publication failures remain fatal.
          best-effort: ${{ matrix.bestEffort }}
          url: ${{ inputs.url }}
          cupboard-path: ${{ steps.setup.outputs.cupboard-path }}
          cache: ${{ needs.configure.outputs.cache }}
          reuse-view: ${{ needs.configure.outputs.reuse-view }}
          ttl: ${{ needs.configure.outputs.ttl }}
          permanent: ${{ needs.configure.outputs.permanent }}
          read-user: ${{ secrets.destination_read_user }}
          read-password: ${{ secrets.destination_read_password }}
          fallback-read-user: ${{ secrets.fallback_read_user }}
          fallback-read-password: ${{ secrets.fallback_read_password }}
          store: ${{ inputs.store }}
          push: ${{ inputs.push }}
          require-provenance: ${{ inputs.push }}
          gc-between-cohorts:
            ${{ inputs.gc-between-cohorts && runner.environment ==
            'github-hosted' && inputs.store == '' }}
          # Every cohort job in this run shares one root, so a later cohort can
          # substitute work an earlier cohort streamed instead of rebuilding
          # it.
          run-root:
            ${{ format('{0}/_cupboard-run/{1}',
            needs.configure.outputs.root-prefix, github.run_id) }}
          run-root-ttl: ${{ inputs.run-root-ttl }}
          run-root-permanent: ${{ inputs.run-root-permanent }}

      # A streamed cohort derives its receipt from the supervised build. A
      # remote-store cohort records only the queryable outputs that Nix reports
      # as results of this invocation. Substituted, already-valid and floating
      # paths are not build evidence. A cohort that published nothing writes no
      # receipt.
      - uses: $/actions/attest
        id: attest
        if: ${{ inputs.push && steps.build-cohort.outputs.receipt-file != '' }}
        with:
          receipt-file: ${{ steps.build-cohort.outputs.receipt-file }}
          url: ${{ inputs.url }}
          cache: ${{ needs.configure.outputs.cache }}
          read-user: ${{ secrets.destination_read_user }}
          read-password: ${{ secrets.destination_read_password }}

      # Attach the signed bundles to the published paths. This runs after the
      # push, because the attest step checks each path against what the cache
      # has published. Build provenance only covers paths that this cohort
      # built, while build origin covers every path that it published. A cohort
      # that built nothing only has build-origin bundles, so check both outputs.
      - uses: $/actions/attest-attach
        if:
          ${{ inputs.push && steps.build-cohort.outputs.receipt-file != '' &&
          (steps.attest.outputs.bundle-path != '' ||
          steps.attest.outputs.origin-bundle-path != '') }}
        with:
          url: ${{ inputs.url }}
          cupboard-path: ${{ steps.setup.outputs.cupboard-path }}
          cache: ${{ needs.configure.outputs.cache }}
          read-user: ${{ secrets.destination_read_user }}
          read-password: ${{ secrets.destination_read_password }}
          receipt-file: ${{ steps.build-cohort.outputs.receipt-file }}
          checksums-file: ${{ steps.attest.outputs.checksums-file }}
          # Each output contains one bundle path per line. The attach input
          # ignores empty lines.
          bundle: |
            ${{ steps.attest.outputs.bundle-path }}
            ${{ steps.attest.outputs.origin-bundle-path }}

      # At this point, every retention root has been set on the destination and
      # attestation has read the committed narinfos. Remove this build's
      # out-links before collection so a later cohort can substitute these
      # outputs from the cache. `nix store gc` leaves other GC roots intact.
      # Collection also runs after a failed cohort and does not fail the job.
      - name: Explain skipped local store collection
        if:
          ${{ !cancelled() && inputs.gc-between-cohorts && (runner.environment
          != 'github-hosted' || inputs.store != '') }}
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          STORE: ${{ inputs.store }}
        run: |
          if [ "${RUNNER_ENVIRONMENT}" != github-hosted ]; then
            echo '::notice::gc-between-cohorts was requested, but local store collection is unsupported on self-hosted runners; leaving the store untouched'
          elif [ -n "${STORE}" ]; then
            echo '::notice::gc-between-cohorts was requested, but the build uses a direct remote store; leaving the runner local store untouched'
          fi

      - name: Collect the local store
        if:
          ${{ !cancelled() && inputs.gc-between-cohorts && runner.environment ==
          'github-hosted' && inputs.store == '' }}
        env:
          OUT_LINK_DIRECTORY:
            ${{ steps.build-cohort.outputs.out-link-directory }}
        run: |
          set -uo pipefail
          if [ -n "${OUT_LINK_DIRECTORY}" ]; then
            rm -rf -- "${OUT_LINK_DIRECTORY}"
          fi
          if ! nix store gc; then
            echo '::warning::nix store gc failed; a later cohort job builds with the store as it stands'
          fi

  remove-cache:
    name: Remove the pull request's cache
    needs: configure
    if: needs.configure.outputs.remove-cache != ''
    runs-on: ${{ inputs.plan-runner }}
    timeout-minutes: 10
    permissions:
      attestations: read # verify a selected cupboard release
      contents: read # check out the workflow code that installs cupboard
      id-token: write # OIDC token for the cache removal
    steps:
      - uses: $/actions/prepare
        if: ${{ fromJSON(needs.configure.outputs.cupboard).kind == 'source' }}

      - name: Reserve the cupboard workflow checkout
        if: ${{ fromJSON(needs.configure.outputs.cupboard).kind == 'source' }}
        env:
          CUPBOARD_WORKFLOW_CHECKOUT: ${{ github.workspace }}/.cupboard-workflow
        run: |
          set -euo pipefail
          if [ -e "${CUPBOARD_WORKFLOW_CHECKOUT}" ] || [ -L "${CUPBOARD_WORKFLOW_CHECKOUT}" ]; then
            echo '::error::The caller checkout already contains .cupboard-workflow; refusing to replace caller content'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ fromJSON(needs.configure.outputs.cupboard).kind == 'source' }}
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cupboard-workflow
          persist-credentials: false

      - uses: $/actions/setup
        id: setup
        with:
          cupboard: ${{ needs.configure.outputs.cupboard }}
          checkout-dir: ${{ github.workspace }}/.cupboard-workflow

      - name: Remove the cache
        env:
          CUPBOARD_PATH: ${{ steps.setup.outputs.cupboard-path }}
          URL: ${{ inputs.url }}
          CACHE: ${{ needs.configure.outputs.remove-cache }}
        run: |
          set -euo pipefail
          "${CUPBOARD_PATH}" cache remove "${URL}" "${CACHE}" \
            --github-oidc --force --yes
