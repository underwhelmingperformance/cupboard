# Build a typed set of flake outputs and publish each target under its own
# root.
name: cupboard flake publish

on:
  workflow_call:
    inputs:
      url:
        description: cupboard tenant URL.
        required: true
        type: string
      targets:
        description:
          Flake attribute containing the target manifest and derivation paths.
        required: false
        default: '.#cupboardOutputs'
        type: string
      preset:
        description: >-
          Derive cache, root-prefix and ttl from the triggering event instead of
          passing them explicitly. 'pull-request-and-branch' gives a
          pull_request run its own pr-<number> cache with a 14-day TTL and a run
          on the configured branch the default cache, each under
          github:<repository>/<cache or branch>. Other refs are refused before
          planning. Applies reuse-view to branch runs only, announcing with a
          notice when a pull-request run drops a configured view. Mutually
          exclusive with cache, root-prefix and ttl; empty keeps the explicit
          inputs.
        required: false
        default: ''
        type: string
      branch:
        description:
          Branch trusted for non-pull-request runs under the
          pull-request-and-branch preset. Must match github setup --branch.
        required: false
        default: main
        type: string
      cache:
        description: Named cache to publish to; empty selects the default cache.
        required: false
        default: ''
        type: string
      root-prefix:
        description:
          Prefix prepended to each target's rootSuffix. Required unless a preset
          derives it.
        required: false
        default: ''
        type: string
      ttl:
        description: Retention TTL such as 14d; empty retains permanently.
        required: false
        default: ''
        type: string
      run-root-ttl:
        description:
          TTL for the per-run root every cohort job's push attaches to, such as
          7d or 12h. Streamed work stays reachable under it for the rest of the
          run, so a later cohort can substitute an earlier one's shared output
          instead of rebuilding it.
        required: false
        default: '24h'
        type: string
      reuse-view:
        description:
          Named tenant reuse view to opt into for shared intermediates missing
          from the destination. setup refuses to configure a view whose
          nix-cache-info priority ties or beats the destination's; empty
          disables reading through a view.
        required: false
        default: ''
        type: string
      cupboard-version:
        description: >-
          Exact published cupboard release tag to install, or 'latest'. Empty
          uses a release for the called workflow revision when one exists,
          otherwise source.
        required: false
        type: string
      maximise-space:
        description:
          Reclaim runner disk space before building by deleting preinstalled
          software (language toolchains, Android/.NET SDKs, docker images) from
          the runner image. Destructive and not undone by the run, so it is an
          explicit opt-in; enable it only on ephemeral GitHub-hosted runners,
          whose images it is safe to strip.
        required: false
        default: false
        type: boolean
      push:
        description:
          Publish results; false only builds each cohort's targets directly.
        required: false
        default: true
        type: boolean
      gc-between-cohorts:
        description:
          On a GitHub-hosted runner using its local store, release the build's
          out-links and collect dead paths once a cohort job has published and
          attested its work. Requested collection is skipped with a notice on a
          self-hosted runner or when a direct remote store is selected. Off by
          default.
        required: false
        default: false
        type: boolean
      nix-config:
        description:
          Flake installable that evaluates to extra nix.conf text for builders.
        required: false
        default: ''
        type: string
      input-known-hosts:
        description:
          Required known_hosts lines pinning private flake input SSH hosts when
          input_ssh_key is supplied.
        required: false
        default: ''
        type: string
      builders:
        description:
          One-line nix.conf builders specification used by remote target groups;
          use semicolons for multiple entries. Classic builder delegation is
          mutually exclusive with store. The machine SSH-key column must be -
          and builder store URIs must not set a non-empty ssh-key; pass a
          private key through the builder_ssh_key secret.
        required: false
        default: ''
        type: string
      builder-known-hosts:
        description:
          Required known_hosts lines pinning every enabled remote builder.
        required: false
        default: ''
        type: string
      store-known-hosts:
        description:
          known_hosts lines pinning the direct ssh-ng store. Required unless
          store uses the default SSH port and supplies
          base64-ssh-public-host-key; independent of classic builder delegation.
        required: false
        default: ''
        type: string
      store-ambient-identity:
        description:
          Authenticate the direct store with the runner's SSH agent or default
          identity files instead of store_ssh_key. Intended only for explicitly
          provisioned self-hosted runners; false fails closed when no managed
          key is supplied.
        required: false
        default: false
        type: boolean
      store:
        description: >-
          Remote ssh-ng store URI every cohort job runs against: the cohort's
          plan partitions availability with the remote store's own answers, the
          build realises its results there, and the push reads path metadata and
          streams NAR bytes from the same store, so the built closure never
          enters the runner's local store. Measured cohort packing prices its
          candidate groupings against the same store's answers. Empty plans and
          builds in each runner's own store. Must not set a non-empty ssh-key;
          pass a private key through the store_ssh_key secret.
        required: false
        default: ''
        type: string
      plan-runner:
        description: >-
          Runner label for the configure and plan jobs. The plan job evaluates
          the flake with the input SSH key and OIDC permission, so repositories
          with self-hosted runners should keep this on a GitHub-hosted label or
          route it through runner groups; see docs/runner-provenance.md.
        required: false
        default: ubuntu-latest
        type: string
      enable-packing:
        description: >-
          Opt in to measured cohort packing: price candidate cohort groupings
          from measured store sizes under pack-capacity, rather than one cohort
          job per manifest cohort. Off by default; never repartitions a manifest
          without a measurement to price the result against.
        required: false
        default: false
        type: boolean
      pack-capacity:
        description:
          Disk budget, in bytes, that measured cohort packing prices candidate
          groupings against. Required when enable-packing is true.
        required: false
        default: ''
        type: string
    secrets:
      builder_ssh_key:
        description: SSH private key authenticating to the remote builders.
        required: false
      builder_ssh_config:
        description:
          ssh_config Host blocks for the remote builder connections. A strict
          allowlist accepts endpoint, transport tuning, algorithm, liveness and
          SetEnv directives. Commands, proxies, forwarding, identity sources,
          verbose logging, Include and Match are rejected.
        required: false
      store_ssh_key:
        description: SSH private key authenticating to the direct ssh-ng store.
        required: false
      store_ssh_config:
        description:
          ssh_config Host blocks for the direct store connection. A strict
          allowlist accepts endpoint, transport tuning, algorithm, liveness and
          SetEnv directives. Commands, proxies, forwarding, identity sources,
          verbose logging, Include and Match are rejected. Independent of
          builder scheduling.
        required: false
      input_ssh_key:
        description:
          SSH key used while evaluating private flake inputs. Requires
          input-known-hosts.
        required: false
      read_user:
        description: Basic-auth credentials for tenants whose reads are private.
        required: false
      read_password:
        description: Basic-auth credentials for tenants whose reads are private.
        required: false

permissions: {}

jobs:
  # Resolves cupboard and the effective cache, root prefix, TTL and reuse view
  # once, so every later job consumes the same validated values. The only code
  # executed here is this reusable workflow's own immutable checkout.
  configure:
    name: Resolve the publication inputs
    runs-on: ${{ inputs.plan-runner }}
    # A hung leg must not burn the 360-minute default.
    timeout-minutes: 10
    permissions:
      contents: read # resolve cupboard releases and check out workflow code
    outputs:
      cupboard: ${{ steps.resolve-cupboard.outputs.cupboard }}
      cache: ${{ steps.resolve.outputs.cache }}
      root-prefix: ${{ steps.resolve.outputs.root-prefix }}
      ttl: ${{ steps.resolve.outputs.ttl }}
      reuse-view: ${{ steps.resolve.outputs.reuse-view }}
    steps:
      - name: Require GitHub Cloud workflow identity
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          if [ "${GITHUB_SERVER_URL}" != https://github.com ]; then
            echo '::error::The reusable cupboard workflows require GitHub Cloud because GitHub Enterprise Server does not provide job.workflow_repository, job.workflow_ref or job.workflow_sha'
            exit 1
          fi

      - name: Reserve the cupboard workflow checkout
        env:
          CUPBOARD_WORKFLOW_CHECKOUT: ${{ github.workspace }}/.cupboard-workflow
        run: |
          set -euo pipefail
          if [ -e "${CUPBOARD_WORKFLOW_CHECKOUT}" ] || [ -L "${CUPBOARD_WORKFLOW_CHECKOUT}" ]; then
            echo '::error::The caller checkout already contains .cupboard-workflow; refusing to replace caller content'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cupboard-workflow
          persist-credentials: false

      - uses: ./.cupboard-workflow/actions/resolve-cupboard
        id: resolve-cupboard
        with:
          cupboard-version: ${{ inputs.cupboard-version }}
          workflow-repository: ${{ job.workflow_repository }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          github-token: ${{ github.token }}
          github-api-url: ${{ github.api_url }}
          github-graphql-url: ${{ github.graphql_url }}

      - name: Resolve inputs
        id: resolve
        env:
          PRESET: ${{ inputs.preset }}
          CACHE: ${{ inputs.cache }}
          ROOT_PREFIX: ${{ inputs.root-prefix }}
          TTL: ${{ inputs.ttl }}
          REUSE_VIEW: ${{ inputs.reuse-view }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          BRANCH: ${{ inputs.branch }}
          STORE: ${{ inputs.store }}
          STORE_AMBIENT_IDENTITY: ${{ inputs.store-ambient-identity }}
          BUILDERS: ${{ inputs.builders }}
          BUILDER_KNOWN_HOSTS: ${{ inputs.builder-known-hosts }}
          STORE_KNOWN_HOSTS: ${{ inputs.store-known-hosts }}
        run: |
          set -euo pipefail
          for name in PRESET CACHE ROOT_PREFIX TTL REUSE_VIEW BRANCH; do
            if [[ "${!name}" == *$'\n'* || "${!name}" == *$'\r'* ]]; then
              echo "::error::${name} must not contain line breaks"
              exit 1
            fi
          done
          if [[ "${BUILDERS}" == *$'\n'* || "${BUILDERS}" == *$'\r'* ]]; then
            echo '::error::builders must not contain line breaks; separate inline builders with semicolons'
            exit 1
          fi
          if [ -n "${STORE}" ] && [ -n "${BUILDERS}" ]; then
            echo '::error::store and builders select different build modes and are mutually exclusive'
            exit 1
          fi
          if [ "${STORE_AMBIENT_IDENTITY}" = true ] && [ -z "${STORE}" ]; then
            echo '::error::store-ambient-identity requires the store input'
            exit 1
          fi
          if [ -n "${BUILDERS}" ] && [[ ! "${BUILDER_KNOWN_HOSTS}" =~ [^[:space:]] ]]; then
            echo '::error::builder-known-hosts is required when builders are enabled'
            exit 1
          fi

          store_uri_has_host_key=false
          if [[ "${STORE}" == *'?'* ]]; then
            store_query="${STORE#*\?}"
            store_query="${store_query%%#*}"
            IFS='&' read -r -a store_parameters <<< "${store_query}"
            for parameter in "${store_parameters[@]}"; do
              case "${parameter}" in
                base64-ssh-public-host-key=?*)
                  store_uri_has_host_key=true
                  break
                  ;;
                base64-ssh-public-host-key=)
                  break
                  ;;
              esac
            done
          fi

          store_uri_uses_default_ssh_port=false
          if [[ "${STORE}" == ssh-ng://* ]]; then
            store_authority="${STORE#ssh-ng://}"
            store_authority="${store_authority%%[/?#]*}"
            store_destination="${store_authority##*@}"
            store_port=''
            if [[ "${store_destination}" == \[*\] ]]; then
              store_port=''
            elif [[ "${store_destination}" == \[*\]:* ]]; then
              store_port="${store_destination##*]:}"
            elif [[ "${store_destination}" == *:* ]]; then
              store_port="${store_destination##*:}"
            fi
            if [ -z "${store_port}" ] || [ "${store_port}" = 22 ]; then
              store_uri_uses_default_ssh_port=true
            fi
          fi

          if [ -n "${STORE}" ] && [[ ! "${STORE_KNOWN_HOSTS}" =~ [^[:space:]] ]]; then
            if [ "${store_uri_has_host_key}" != true ]; then
              echo '::error::store-known-hosts is required unless the store URI supplies base64-ssh-public-host-key'
              exit 1
            fi
            if [ "${store_uri_uses_default_ssh_port}" != true ]; then
              echo '::error::store-known-hosts is required for a nonstandard SSH port; URI-only host-key pinning supports only the default SSH port'
              exit 1
            fi
          fi
          case "${PRESET}" in
            '')
              if [ -z "${ROOT_PREFIX}" ]; then
                echo '::error::root-prefix is required when no preset derives it'
                exit 1
              fi
              ;;
            pull-request-and-branch)
              # A caller either states the event arithmetic or delegates it,
              # never half of each: a preset alongside any input it derives is
              # refused.
              if [ -n "${CACHE}${ROOT_PREFIX}${TTL}" ]; then
                echo '::error::preset is mutually exclusive with cache, root-prefix and ttl'
                exit 1
              fi
              if [ "${EVENT_NAME}" = pull_request ]; then
                CACHE="pr-${PR_NUMBER}"
                TTL=14d
                if [ -n "${REUSE_VIEW}" ]; then
                  echo "::notice::reuse-view '${REUSE_VIEW}' applies to non-pull-request runs; disabled for this run"
                fi
                REUSE_VIEW=''
                ROOT_PREFIX="github:${REPOSITORY}/${CACHE}"
              elif [ "${REF}" = "refs/heads/${BRANCH}" ]; then
                ROOT_PREFIX="github:${REPOSITORY}/${BRANCH}"
              else
                echo "::error::preset 'pull-request-and-branch' accepts pull_request runs or refs/heads/${BRANCH}; got event '${EVENT_NAME}' on '${REF}'"
                exit 1
              fi
              ;;
            *)
              echo "::error::unknown preset '${PRESET}'"
              exit 1
              ;;
          esac
          {
            echo "cache=${CACHE}"
            echo "root-prefix=${ROOT_PREFIX}"
            echo "ttl=${TTL}"
            echo "reuse-view=${REUSE_VIEW}"
          } >> "${GITHUB_OUTPUT}"

  plan:
    name: Plan the publication
    needs: configure
    # The plan job receives the input SSH key, read credentials and OIDC
    # permission, and evaluates the flake, so where it runs is the operator's
    # choice like any other job: the label comes from the plan-runner input.
    # Self-hosted estates should read docs/runner-provenance.md before
    # pointing it at their own machines.
    runs-on: ${{ inputs.plan-runner }}
    # A hung leg must not burn the 360-minute default.
    timeout-minutes: 30
    permissions:
      attestations: read # verify a selected cupboard release
      contents: read # check out the flake source
      id-token: write # OIDC token for the retention-root ensure calls
    outputs:
      cohort-matrix: ${{ steps.plan.outputs.cohort-matrix }}
      cohort-count: ${{ steps.plan.outputs.cohort-count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reserve the cupboard workflow checkout
        env:
          CUPBOARD_WORKFLOW_CHECKOUT: ${{ github.workspace }}/.cupboard-workflow
        run: |
          set -euo pipefail
          if [ -e "${CUPBOARD_WORKFLOW_CHECKOUT}" ] || [ -L "${CUPBOARD_WORKFLOW_CHECKOUT}" ]; then
            echo '::error::The caller checkout already contains .cupboard-workflow; refusing to replace caller content'
            exit 1
          fi

      # Checked out at the called workflow's own commit, not `main`, so a
      # tagged or SHA-pinned caller executes matching action code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cupboard-workflow
          persist-credentials: false

      - uses: ./.cupboard-workflow/actions/prepare
        with:
          ssh-key: ${{ secrets.input_ssh_key }}
          input-known-hosts: ${{ inputs.input-known-hosts }}
          nix-config: ${{ inputs.nix-config }}
          # Evaluating closure roots can realise derivations for their target
          # systems, so planning needs the caller's builders as well.
          remote: ${{ inputs.builders != '' && inputs.store == '' }}
          store: ${{ inputs.store }}
          builders: ${{ inputs.store == '' && inputs.builders || '' }}
          builder-ssh-key:
            ${{ inputs.builders != '' && inputs.store == '' &&
            secrets.builder_ssh_key || '' }}
          builder-ssh-config:
            ${{ inputs.builders != '' && inputs.store == '' &&
            secrets.builder_ssh_config || '' }}
          builder-known-hosts:
            ${{ inputs.builders != '' && inputs.store == '' &&
            inputs.builder-known-hosts || '' }}
          store-ssh-key:
            ${{ inputs.store != '' && secrets.store_ssh_key || '' }}
          store-ssh-config:
            ${{ inputs.store != '' && secrets.store_ssh_config || '' }}
          store-known-hosts:
            ${{ inputs.store != '' && inputs.store-known-hosts || '' }}
          store-ambient-identity:
            ${{ inputs.store != '' && inputs.store-ambient-identity || false }}

      - uses: ./.cupboard-workflow/actions/setup
        id: setup
        with:
          cache-url: ${{ inputs.url }}
          cache: ${{ needs.configure.outputs.cache }}
          cupboard: ${{ needs.configure.outputs.cupboard }}
          read-user: ${{ secrets.read_user }}
          read-password: ${{ secrets.read_password }}
          reuse-view: ${{ needs.configure.outputs.reuse-view }}

      - name: Evaluate target manifest
        id: targets
        env:
          TARGETS: ${{ inputs.targets }}
          PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          if [[ "${PUSH}" == true ]]; then
            manifest=$(nix eval --json "${TARGETS}")
          else
            manifest=$(
              nix eval --json "${TARGETS}" \
                --apply 'targets: map (target: builtins.removeAttrs target ["rootDrvPath"]) targets'
            )
          fi
          echo "manifest=${manifest}" >> "${GITHUB_OUTPUT}"

      - uses: ./.cupboard-workflow/actions/plan
        id: plan
        with:
          targets: ${{ steps.targets.outputs.manifest }}
          url: ${{ inputs.url }}
          cupboard-path: ${{ steps.setup.outputs.cupboard-path }}
          cache: ${{ needs.configure.outputs.cache }}
          root-prefix: ${{ needs.configure.outputs.root-prefix }}
          ttl: ${{ needs.configure.outputs.ttl }}
          optimise: ${{ inputs.push }}
          read-user: ${{ secrets.read_user }}
          read-password: ${{ secrets.read_password }}
          enable-packing: ${{ inputs.enable-packing }}
          pack-capacity: ${{ inputs.pack-capacity }}
          store: ${{ inputs.store }}

      - name: Summarise plan
        env:
          RETAINED: ${{ steps.plan.outputs.retained-count }}
          PLAN_FILE: ${{ steps.plan.outputs.plan-file }}
        run: |
          {
            echo '## Cupboard publication plan'
            echo
            echo "- Retained without building: ${RETAINED}"
            echo "- Independent targets: $(jq '.targets | length' "${PLAN_FILE}")"
          } >> "${GITHUB_STEP_SUMMARY}"

  cohort:
    needs: [configure, plan]
    if: ${{ needs.plan.outputs.cohort-count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.cohort-matrix) }}
    name: ${{ matrix.key }}
    runs-on: ${{ matrix.runsOn }}
    # A hung leg must not burn the 360-minute default.
    timeout-minutes: 180
    permissions:
      attestations: write # record build provenance on the repository
      contents: read # check out the flake source
      id-token: write # OIDC token for the partition, roots.ensure and the push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reserve the cupboard workflow checkout
        env:
          CUPBOARD_WORKFLOW_CHECKOUT: ${{ github.workspace }}/.cupboard-workflow
        run: |
          set -euo pipefail
          if [ -e "${CUPBOARD_WORKFLOW_CHECKOUT}" ] || [ -L "${CUPBOARD_WORKFLOW_CHECKOUT}" ]; then
            echo '::error::The caller checkout already contains .cupboard-workflow; refusing to replace caller content'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cupboard-workflow
          persist-credentials: false

      - uses: ./.cupboard-workflow/actions/prepare
        with:
          ssh-key: ${{ secrets.input_ssh_key }}
          input-known-hosts: ${{ inputs.input-known-hosts }}
          nix-config: ${{ inputs.nix-config }}
          maximise-space: ${{ inputs.maximise-space }}
          remote: ${{ matrix.remote && inputs.store == '' }}
          store: ${{ inputs.store }}
          builders:
            ${{ matrix.remote && inputs.store == '' && inputs.builders || '' }}
          builder-ssh-key:
            ${{ matrix.remote && inputs.store == '' && secrets.builder_ssh_key
            || '' }}
          builder-ssh-config:
            ${{ matrix.remote && inputs.store == '' &&
            secrets.builder_ssh_config || '' }}
          builder-known-hosts:
            ${{ matrix.remote && inputs.store == '' &&
            inputs.builder-known-hosts || '' }}
          store-ssh-key:
            ${{ inputs.store != '' && secrets.store_ssh_key || '' }}
          store-ssh-config:
            ${{ inputs.store != '' && secrets.store_ssh_config || '' }}
          store-known-hosts:
            ${{ inputs.store != '' && inputs.store-known-hosts || '' }}
          store-ambient-identity:
            ${{ inputs.store != '' && inputs.store-ambient-identity || false }}

      - uses: ./.cupboard-workflow/actions/setup
        id: setup
        with:
          cache-url: ${{ inputs.url }}
          cache: ${{ needs.configure.outputs.cache }}
          cupboard: ${{ needs.configure.outputs.cupboard }}
          read-user: ${{ secrets.read_user }}
          read-password: ${{ secrets.read_password }}
          reuse-view: ${{ needs.configure.outputs.reuse-view }}

      # One build-cohort run is the whole cohort: the availability partition,
      # the supervised `cupboard build-push` build with streamed uploads,
      # retry attempts, remote attribution and the receipt, and one push per
      # root group to set each target root over its full declared list.
      - uses: ./.cupboard-workflow/actions/build-cohort
        id: build-cohort
        with:
          cohort-json: ${{ toJSON(matrix) }}
          # The planner rejects mixed tolerance, so this is every member's
          # declared severity. The action applies it only to attributable target
          # failures; infrastructure and unbounded publication failures remain
          # fatal instead of being hidden by workflow-level continue-on-error.
          best-effort: ${{ matrix.bestEffort }}
          url: ${{ inputs.url }}
          cupboard-path: ${{ steps.setup.outputs.cupboard-path }}
          cache: ${{ needs.configure.outputs.cache }}
          reuse-view: ${{ needs.configure.outputs.reuse-view }}
          ttl: ${{ needs.configure.outputs.ttl }}
          read-user: ${{ secrets.read_user }}
          read-password: ${{ secrets.read_password }}
          max-jobs: ${{ matrix.remote && inputs.store == '' && '0' || '' }}
          store: ${{ inputs.store }}
          push: ${{ inputs.push }}
          gc-between-cohorts:
            ${{ inputs.gc-between-cohorts && runner.environment ==
            'github-hosted' && inputs.store == '' }}
          # Every cohort job in this run shares one root, so a later cohort
          # can substitute an earlier one's streamed work instead of
          # rebuilding it.
          run-root:
            ${{ format('{0}/_cupboard-run/{1}',
            needs.configure.outputs.root-prefix, github.run_id) }}
          run-root-ttl: ${{ inputs.run-root-ttl }}

      # The build receipt carries the per-path NAR hashes, derivers and any
      # current-invocation evidence the provenance subjects need. A streamed
      # cohort writes it from its supervised build. A remote-store cohort uses
      # Nix's keyed build results to claim only queryable outputs this invocation
      # built, then reconciles every returned path without treating substitution,
      # already-valid paths or floating targets as build evidence. A cohort that
      # publishes nothing has no receipt.
      - uses: ./.cupboard-workflow/actions/attest
        id: attest
        if: ${{ inputs.push && steps.build-cohort.outputs.receipt-file != '' }}
        with:
          receipt-file: ${{ steps.build-cohort.outputs.receipt-file }}
          url: ${{ inputs.url }}
          cache: ${{ needs.configure.outputs.cache }}
          read-user: ${{ secrets.read_user }}
          read-password: ${{ secrets.read_password }}

      # The provenance bundle is signed after publication, since it needs the
      # receipt's subjects, so a dedicated step files it against the paths the
      # cache already serves. Gated as the attest step is, plus the bundle
      # itself: a receipt with no established subjects signs nothing.
      - uses: ./.cupboard-workflow/actions/attest-attach
        if:
          ${{ inputs.push && steps.build-cohort.outputs.receipt-file != '' &&
          steps.attest.outputs.bundle-path != '' }}
        with:
          url: ${{ inputs.url }}
          cupboard-path: ${{ steps.setup.outputs.cupboard-path }}
          cache: ${{ needs.configure.outputs.cache }}
          read-user: ${{ secrets.read_user }}
          read-password: ${{ secrets.read_password }}
          receipt-file: ${{ steps.build-cohort.outputs.receipt-file }}
          checksums-file: ${{ steps.attest.outputs.checksums-file }}
          bundle: ${{ steps.attest.outputs.bundle-path }}

      # The cohort job is where a run of one cohort per job crosses a
      # collection boundary. Every root has been set on the destination, and
      # attestation reads the destination's committed narinfos rather than the
      # build store, so the build's out-links have done their work. Removing
      # the directory that holds them makes the cohort's own outputs collectable
      # here, and a later cohort job sharing the runner substitutes them from
      # the cache.
      # `nix store gc` then sweeps dead paths alone, leaving a user's own gc
      # roots standing, and a sweep that fails is reported without failing the
      # job. The boundary runs after a failed cohort too, where the disk it
      # reclaims is worth most.
      - name: Explain skipped local store collection
        if:
          ${{ !cancelled() && inputs.gc-between-cohorts && (runner.environment
          != 'github-hosted' || inputs.store != '') }}
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          STORE: ${{ inputs.store }}
        run: |
          if [ "${RUNNER_ENVIRONMENT}" != github-hosted ]; then
            echo '::notice::gc-between-cohorts was requested, but local store collection is unsupported on self-hosted runners; leaving the store untouched'
          elif [ -n "${STORE}" ]; then
            echo '::notice::gc-between-cohorts was requested, but the build uses a direct remote store; leaving the runner local store untouched'
          fi

      - name: Collect the local store
        if:
          ${{ !cancelled() && inputs.gc-between-cohorts && runner.environment ==
          'github-hosted' && inputs.store == '' }}
        env:
          OUT_LINK_DIRECTORY:
            ${{ steps.build-cohort.outputs.out-link-directory }}
        run: |
          set -uo pipefail
          if [ -n "${OUT_LINK_DIRECTORY}" ]; then
            rm -rf -- "${OUT_LINK_DIRECTORY}"
          fi
          if ! nix store gc; then
            echo '::warning::nix store gc failed; a later cohort job builds with the store as it stands'
          fi
