# Build a typed set of flake outputs, seeding shared cache misses once before
# target-specific jobs fan out, then publish every result under its own root.
name: cupboard flake publish

on:
  workflow_call:
    inputs:
      url:
        description: cupboard tenant URL.
        required: true
        type: string
      targets:
        description:
          Flake attribute containing the target manifest and derivation paths.
        required: false
        default: '.#cupboardOutputs'
        type: string
      preset:
        description: >-
          Derive cache, root-prefix and ttl from the triggering event instead of
          passing them explicitly. 'pull-request-and-branch' gives a
          pull_request run its own pr-<number> cache with a 14-day TTL and a run
          on the configured branch the default cache, each under
          github:<repository>/<cache or branch>. Other refs are refused before
          planning. Applies reuse-view to branch runs only, announcing with a
          notice when a pull-request run drops a configured view. Mutually
          exclusive with cache, root-prefix and ttl; empty keeps the explicit
          inputs.
        required: false
        default: ''
        type: string
      branch:
        description:
          Branch trusted for non-pull-request runs under the
          pull-request-and-branch preset. Must match github setup --branch.
        required: false
        default: main
        type: string
      cache:
        description: Named cache to publish to; empty selects the default cache.
        required: false
        default: ''
        type: string
      root-prefix:
        description:
          Prefix prepended to each target's rootSuffix. Required unless a preset
          derives it.
        required: false
        default: ''
        type: string
      ttl:
        description: Retention TTL such as 14d; empty retains permanently.
        required: false
        default: ''
        type: string
      intermediate-retention:
        description:
          How seed and fallback intermediates are retained. 'root' keeps the
          temporary per-run seed roots at a 24h TTL; 'grace' relies on the
          destination cache's retention grace policy instead. workflow_call
          inputs have no enum, so an invalid value is caught by the plan action
          before any push. Named destination roots are unaffected either way.
        required: false
        default: 'root'
        type: string
      reuse-view:
        description:
          Named tenant reuse view to opt into for shared intermediates missing
          from the destination. setup refuses to configure a view whose
          nix-cache-info priority ties or beats the destination's; empty
          disables reading through a view.
        required: false
        default: ''
        type: string
      cupboard-version:
        description:
          cupboard release used by the actions. Pass the release tag the caller
          pins this workflow with; the workflow code already comes from that
          tag, so one value keeps the code and the CLI it drives from skewing.
        required: true
        type: string
      maximise-space:
        description:
          Reclaim runner disk space before building by deleting preinstalled
          software (language toolchains, Android/.NET SDKs, docker images) from
          the runner image. Destructive and not undone by the run, so it is an
          explicit opt-in; enable it only on ephemeral GitHub-hosted runners,
          whose images it is safe to strip.
        required: false
        default: false
        type: boolean
      push:
        description: Attest and publish results; false only builds each target.
        required: false
        default: true
        type: boolean
      nix-config:
        description:
          Flake installable that evaluates to extra nix.conf text for builders.
        required: false
        default: ''
        type: string
      builders:
        description:
          nix.conf builders specification used by remote target groups.
        required: false
        default: ''
        type: string
      builder-known-hosts:
        description:
          known_hosts lines for the remote builders. Hosts they name are pinned;
          other hosts are accepted on first connection.
        required: false
        default: ''
        type: string
      plan-runner:
        description: >-
          Runner label for the configure and plan jobs. The plan job evaluates
          the flake with the input SSH key and OIDC permission, so repositories
          with self-hosted runners should keep this on a GitHub-hosted label or
          route it through runner groups; see docs/runner-provenance.md.
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      builder_ssh_key:
        description: SSH private key authenticating to the remote builders.
        required: false
      builder_ssh_config:
        description:
          ssh_config text for the remote builder connections, scoped under Host
          blocks. Carries connection-environment secrets such as auth tokens.
        required: false
      input_ssh_key:
        description: SSH key used while evaluating private flake inputs.
        required: false
      read_user:
        description: Basic-auth credentials for tenants whose reads are private.
        required: false
      read_password:
        description: Basic-auth credentials for tenants whose reads are private.
        required: false

permissions: {}

jobs:
  # Resolves the effective cache, root prefix, TTL and reuse view once, so a
  # preset caller and an explicit caller feed every later job identically. No
  # secret and no caller-controlled code reaches this job: it evaluates only
  # workflow expressions over the event context.
  configure:
    name: Resolve the publication inputs
    runs-on: ${{ inputs.plan-runner }}
    # A hung leg must not burn the 360-minute default.
    timeout-minutes: 10
    permissions: {}
    outputs:
      cache: ${{ steps.resolve.outputs.cache }}
      root-prefix: ${{ steps.resolve.outputs.root-prefix }}
      ttl: ${{ steps.resolve.outputs.ttl }}
      reuse-view: ${{ steps.resolve.outputs.reuse-view }}
    steps:
      - name: Resolve inputs
        id: resolve
        env:
          PRESET: ${{ inputs.preset }}
          CACHE: ${{ inputs.cache }}
          ROOT_PREFIX: ${{ inputs.root-prefix }}
          TTL: ${{ inputs.ttl }}
          REUSE_VIEW: ${{ inputs.reuse-view }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          for name in PRESET CACHE ROOT_PREFIX TTL REUSE_VIEW BRANCH; do
            if [[ "${!name}" == *$'\n'* || "${!name}" == *$'\r'* ]]; then
              echo "::error::${name} must not contain line breaks"
              exit 1
            fi
          done
          case "${PRESET}" in
            '')
              if [ -z "${ROOT_PREFIX}" ]; then
                echo '::error::root-prefix is required when no preset derives it'
                exit 1
              fi
              ;;
            pull-request-and-branch)
              # A caller either states the event arithmetic or delegates it,
              # never half of each: a preset alongside any input it derives is
              # refused.
              if [ -n "${CACHE}${ROOT_PREFIX}${TTL}" ]; then
                echo '::error::preset is mutually exclusive with cache, root-prefix and ttl'
                exit 1
              fi
              if [ "${EVENT_NAME}" = pull_request ]; then
                CACHE="pr-${PR_NUMBER}"
                TTL=14d
                if [ -n "${REUSE_VIEW}" ]; then
                  echo "::notice::reuse-view '${REUSE_VIEW}' applies to non-pull-request runs; disabled for this run"
                fi
                REUSE_VIEW=''
                ROOT_PREFIX="github:${REPOSITORY}/${CACHE}"
              elif [ "${REF}" = "refs/heads/${BRANCH}" ]; then
                ROOT_PREFIX="github:${REPOSITORY}/${BRANCH}"
              else
                echo "::error::preset 'pull-request-and-branch' accepts pull_request runs or refs/heads/${BRANCH}; got event '${EVENT_NAME}' on '${REF}'"
                exit 1
              fi
              ;;
            *)
              echo "::error::unknown preset '${PRESET}'"
              exit 1
              ;;
          esac
          {
            echo "cache=${CACHE}"
            echo "root-prefix=${ROOT_PREFIX}"
            echo "ttl=${TTL}"
            echo "reuse-view=${REUSE_VIEW}"
          } >> "${GITHUB_OUTPUT}"

  plan:
    name: Plan the publication
    needs: configure
    # The plan job receives the input SSH key, read credentials and OIDC
    # permission, and evaluates the flake, so where it runs is the operator's
    # choice like any other job: the label comes from the plan-runner input.
    # Self-hosted estates should read docs/runner-provenance.md before
    # pointing it at their own machines.
    runs-on: ${{ inputs.plan-runner }}
    # A hung leg must not burn the 360-minute default.
    timeout-minutes: 30
    permissions:
      contents: read # check out the flake source
      id-token: write # OIDC token for the retention-root ensure calls
    outputs:
      seed-matrix: ${{ steps.plan.outputs.seed-matrix }}
      seed-count: ${{ steps.plan.outputs.seed-count }}
      target-matrix: ${{ steps.plan.outputs.target-matrix }}
      target-count: ${{ steps.plan.outputs.target-count }}
      fallback-matrix: ${{ steps.plan.outputs.fallback-matrix }}
      fallback-count: ${{ steps.plan.outputs.fallback-count }}
      plan-artifact-name: ${{ steps.plan.outputs.plan-artifact-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checked out at the called workflow's own commit, not `main`, so a
      # tagged or SHA-pinned caller executes matching action code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cupboard
          persist-credentials: false

      - uses: ./.cupboard/actions/prepare
        with:
          ssh-key: ${{ secrets.input_ssh_key }}
          nix-config: ${{ inputs.nix-config }}
          # Evaluating closure roots can realise derivations for their target
          # systems, so planning needs the caller's builders as well.
          remote: ${{ inputs.builders != '' }}
          builders: ${{ inputs.builders }}
          builder-ssh-key: ${{ secrets.builder_ssh_key }}
          builder-ssh-config: ${{ secrets.builder_ssh_config }}
          builder-known-hosts: ${{ inputs.builder-known-hosts }}

      - uses: ./.cupboard/actions/setup
        id: setup
        with:
          cache-url: ${{ inputs.url }}
          cache: ${{ needs.configure.outputs.cache }}
          cupboard-version: ${{ inputs.cupboard-version }}
          expected-source-commit: ${{ job.workflow_sha }}
          release-repository: underwhelmingperformance/cupboard
          read-user: ${{ secrets.read_user }}
          read-password: ${{ secrets.read_password }}
          reuse-view: ${{ needs.configure.outputs.reuse-view }}

      - name: Evaluate target manifest
        id: targets
        env:
          TARGETS: ${{ inputs.targets }}
          PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          if [[ "${PUSH}" == true ]]; then
            manifest=$(nix eval --json "${TARGETS}")
          else
            manifest=$(
              nix eval --json "${TARGETS}" \
                --apply 'targets: map (target: builtins.removeAttrs target ["rootDrvPath"]) targets'
            )
          fi
          echo "manifest=${manifest}" >> "${GITHUB_OUTPUT}"

      - uses: ./.cupboard/actions/plan
        id: plan
        with:
          targets: ${{ steps.targets.outputs.manifest }}
          url: ${{ inputs.url }}
          cupboard-path: ${{ steps.setup.outputs.cupboard-path }}
          cache: ${{ needs.configure.outputs.cache }}
          root-prefix: ${{ needs.configure.outputs.root-prefix }}
          ttl: ${{ needs.configure.outputs.ttl }}
          intermediate-retention: ${{ inputs.intermediate-retention }}
          optimise: ${{ inputs.push }}
          read-user: ${{ secrets.read_user }}
          read-password: ${{ secrets.read_password }}
          reuse-view: ${{ needs.configure.outputs.reuse-view }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.plan.outputs.plan-artifact-name }}
          path: ${{ steps.plan.outputs.plan-file }}
          if-no-files-found: error
          retention-days: 1

      - name: Summarise plan
        env:
          RETAINED: ${{ steps.plan.outputs.retained-count }}
          PLAN_FILE: ${{ steps.plan.outputs.plan-file }}
        run: |
          {
            echo '## Cupboard publication plan'
            echo
            echo "- Retained without building: ${RETAINED}"
            echo "- Shared seed groups: $(jq '[.seedGroups[] | select(.key | startswith("seed"))] | length' "${PLAN_FILE}")"
            echo "- Adopted through the reuse view: $(jq '[.seedGroups[] | select(.key | startswith("adopt"))] | length' "${PLAN_FILE}")"
            echo "- Destination-resident shared outputs: $(jq '.destinationIntermediates | length' "${PLAN_FILE}")"
            echo "- Independent targets: $(jq '.targets | length' "${PLAN_FILE}")"
            echo "- Unknown-output fallback groups: $(jq '.fallbackGroups | length' "${PLAN_FILE}")"
          } >> "${GITHUB_STEP_SUMMARY}"

  seed:
    name: ${{ matrix.key }}
    needs: [configure, plan]
    if: ${{ needs.plan.outputs.seed-count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.seed-matrix) }}
    runs-on: ${{ matrix.runsOn }}
    # A hung leg must not burn the 360-minute default.
    timeout-minutes: 180
    permissions:
      attestations: write # record build provenance on the repository
      contents: read # check out the flake source
      id-token: write # OIDC token for the cache push and Sigstore signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cupboard
          persist-credentials: false

      - uses: ./.cupboard/actions/prepare
        with:
          ssh-key: ${{ secrets.input_ssh_key }}
          nix-config: ${{ inputs.nix-config }}
          maximise-space: ${{ inputs.maximise-space }}
          remote: ${{ matrix.remote }}
          builders: ${{ inputs.builders }}
          builder-ssh-key: ${{ secrets.builder_ssh_key }}
          builder-ssh-config: ${{ secrets.builder_ssh_config }}
          builder-known-hosts: ${{ inputs.builder-known-hosts }}

      - uses: ./.cupboard/actions/setup
        with:
          cache-url: ${{ inputs.url }}
          cache: ${{ needs.configure.outputs.cache }}
          cupboard-version: ${{ inputs.cupboard-version }}
          expected-source-commit: ${{ job.workflow_sha }}
          release-repository: underwhelmingperformance/cupboard
          read-user: ${{ secrets.read_user }}
          read-password: ${{ secrets.read_password }}
          reuse-view: ${{ needs.configure.outputs.reuse-view }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.plan-artifact-name }}
          path: ${{ runner.temp }}/cupboard-plan

      - name: Resolve seed installables
        id: installables
        env:
          GROUP: ${{ matrix.key }}
        run: |
          set -euo pipefail
          plan=$(find "${RUNNER_TEMP}/cupboard-plan" -type f -name '*.json' -print -quit)

          attrs=()
          while IFS= read -r attr; do
            attrs+=("${attr}")
          done < <(jq -r --arg group "${GROUP}" '.seedGroups[] | select(.key == $group) | .targets[]' "${plan}")
          if [ "${#attrs[@]}" -gt 0 ]; then
            # Best-effort: an attribute that does not evaluate on this runner
            # degrades exactly as a failed build of it would, through the
            # keep-going retry loop below, not by failing the whole step.
            nix derivation show -r -- "${attrs[@]}" > /dev/null ||
              echo "::warning::some seed attributes did not evaluate on this runner"
          fi

          candidates=()
          while IFS= read -r candidate; do
            candidates+=("${candidate}")
          done < <(jq -r --arg group "${GROUP}" '.seedGroups[] | select(.key == $group) | .candidates[] | "\(.drvPath)^\(.output)"' "${plan}")
          delimiter=CUPBOARD_INSTALLABLES
          while true; do
            collision=false
            for record in "${candidates[@]}"; do
              if [[ "${record}" == "${delimiter}" ]]; then
                collision=true
                break
              fi
            done
            if [[ "${collision}" == false ]]; then
              break
            fi
            delimiter="${delimiter}_"
          done
          {
            echo "value<<${delimiter}"
            printf '%s\n' "${candidates[@]}"
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

      # A remote copy can truncate after some paths have arrived. The build
      # action keeps one receipt across all three attempts, so those paths stay
      # attributable even when a retry finds them already valid.
      - uses: ./.cupboard/actions/build-paths
        id: build
        with:
          installables: ${{ steps.installables.outputs.value }}
          keep-going: 'true'
          max-jobs: ${{ matrix.remote && '0' || '' }}
          allow-failure: 'true'

      - uses: ./.cupboard/actions/attest
        id: attest
        if: ${{ inputs.push && steps.build.outputs.paths != '' }}
        with:
          receipt-file: ${{ steps.build.outputs.receipt-file }}

      - uses: ./.cupboard/actions/push
        if: ${{ inputs.push && steps.build.outputs.paths != '' }}
        with:
          url: ${{ inputs.url }}
          paths: ${{ steps.build.outputs.paths }}
          cache: ${{ needs.configure.outputs.cache }}
          # The plan action decides these per group; its tests prove the
          # retention and reuse combinations.
          root: ${{ matrix.root }}
          ttl: ${{ matrix.ttl }}
          no-retain: ${{ matrix.noRetain }}
          require-grace: ${{ matrix.requireGrace }}
          attestations: ${{ steps.attest.outputs.bundle-path }}
          cupboard-version: ${{ inputs.cupboard-version }}
          expected-source-commit: ${{ job.workflow_sha }}
          release-repository: underwhelmingperformance/cupboard

  fallback:
    name: ${{ matrix.key }}
    needs: [configure, plan]
    if: ${{ needs.plan.outputs.fallback-count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.fallback-matrix) }}
    runs-on: ${{ matrix.runsOn }}
    # A hung leg must not burn the 360-minute default.
    timeout-minutes: 180
    permissions:
      attestations: write # record build provenance on the repository
      contents: read # check out the flake source
      id-token: write # OIDC token for the cache push and Sigstore signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cupboard
          persist-credentials: false

      - uses: ./.cupboard/actions/prepare
        with:
          ssh-key: ${{ secrets.input_ssh_key }}
          nix-config: ${{ inputs.nix-config }}
          maximise-space: ${{ inputs.maximise-space }}
          remote: ${{ matrix.remote }}
          builders: ${{ inputs.builders }}
          builder-ssh-key: ${{ secrets.builder_ssh_key }}
          builder-ssh-config: ${{ secrets.builder_ssh_config }}
          builder-known-hosts: ${{ inputs.builder-known-hosts }}

      - uses: ./.cupboard/actions/setup
        with:
          cache-url: ${{ inputs.url }}
          cache: ${{ needs.configure.outputs.cache }}
          cupboard-version: ${{ inputs.cupboard-version }}
          expected-source-commit: ${{ job.workflow_sha }}
          release-repository: underwhelmingperformance/cupboard
          read-user: ${{ secrets.read_user }}
          read-password: ${{ secrets.read_password }}
          reuse-view: ${{ needs.configure.outputs.reuse-view }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.plan-artifact-name }}
          path: ${{ runner.temp }}/cupboard-plan

      - name: Resolve fallback installables
        id: installables
        env:
          GROUP: ${{ matrix.key }}
        run: |
          set -euo pipefail
          plan=$(find "${RUNNER_TEMP}/cupboard-plan" -type f -name '*.json' -print -quit)

          attrs=()
          while IFS= read -r attr; do
            attrs+=("${attr}")
          done < <(jq -r --arg group "${GROUP}" '.fallbackGroups[] | select(.key == $group) | .targets[] | "\(.attr)^\(.outputs | join(","))"' "${plan}")
          delimiter=CUPBOARD_INSTALLABLES
          while true; do
            collision=false
            for record in "${attrs[@]}"; do
              if [[ "${record}" == "${delimiter}" ]]; then
                collision=true
                break
              fi
            done
            if [[ "${collision}" == false ]]; then
              break
            fi
            delimiter="${delimiter}_"
          done
          {
            echo "value<<${delimiter}"
            printf '%s\n' "${attrs[@]}"
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

      - uses: ./.cupboard/actions/build-paths
        id: build
        with:
          installables: ${{ steps.installables.outputs.value }}
          keep-going: 'true'
          max-jobs: ${{ matrix.remote && '0' || '' }}
          allow-failure: 'true'

      - uses: ./.cupboard/actions/attest
        id: attest
        if: ${{ inputs.push && steps.build.outputs.paths != '' }}
        with:
          receipt-file: ${{ steps.build.outputs.receipt-file }}

      - uses: ./.cupboard/actions/push
        if: ${{ inputs.push && steps.build.outputs.paths != '' }}
        with:
          url: ${{ inputs.url }}
          paths: ${{ steps.build.outputs.paths }}
          cache: ${{ needs.configure.outputs.cache }}
          # The plan action decides these per group; its tests prove the
          # retention and reuse combinations.
          root: ${{ matrix.root }}
          ttl: ${{ matrix.ttl }}
          no-retain: ${{ matrix.noRetain }}
          require-grace: ${{ matrix.requireGrace }}
          attestations: ${{ steps.attest.outputs.bundle-path }}
          cupboard-version: ${{ inputs.cupboard-version }}
          expected-source-commit: ${{ job.workflow_sha }}
          release-repository: underwhelmingperformance/cupboard

  target:
    needs: [configure, plan, seed, fallback]
    # The targets run whatever became of the best-effort seed and fallback
    # warm-ups, but a cancelled run must not keep building and publishing.
    if:
      ${{ !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.target-count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.target-matrix) }}
    name: ${{ matrix.attr }}
    runs-on: ${{ matrix.runsOn }}
    # A hung leg must not burn the 360-minute default.
    timeout-minutes: 180
    continue-on-error: ${{ matrix.bestEffort }}
    permissions:
      attestations: write # record build provenance on the repository
      contents: read # check out the flake source
      id-token: write # OIDC token for the cache push and Sigstore signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cupboard
          persist-credentials: false

      - uses: ./.cupboard/actions/prepare
        with:
          ssh-key: ${{ secrets.input_ssh_key }}
          nix-config: ${{ inputs.nix-config }}
          maximise-space: ${{ inputs.maximise-space }}
          remote: ${{ matrix.remote }}
          builders: ${{ inputs.builders }}
          builder-ssh-key: ${{ secrets.builder_ssh_key }}
          builder-ssh-config: ${{ secrets.builder_ssh_config }}
          builder-known-hosts: ${{ inputs.builder-known-hosts }}

      - uses: ./.cupboard/actions/setup
        with:
          cache-url: ${{ inputs.url }}
          cache: ${{ needs.configure.outputs.cache }}
          cupboard-version: ${{ inputs.cupboard-version }}
          expected-source-commit: ${{ job.workflow_sha }}
          release-repository: underwhelmingperformance/cupboard
          read-user: ${{ secrets.read_user }}
          read-password: ${{ secrets.read_password }}
          reuse-view: ${{ needs.configure.outputs.reuse-view }}

      - uses: ./.cupboard/actions/build-paths
        id: build
        with:
          installables: ${{ matrix.attr }}^${{ join(matrix.outputs, ',') }}
          max-jobs: ${{ matrix.remote && '0' || '' }}

      - uses: ./.cupboard/actions/attest
        id: attest
        if: ${{ inputs.push }}
        with:
          receipt-file: ${{ steps.build.outputs.receipt-file }}

      - uses: ./.cupboard/actions/push
        if: ${{ inputs.push }}
        with:
          url: ${{ inputs.url }}
          paths: ${{ steps.build.outputs.paths }}
          cache: ${{ needs.configure.outputs.cache }}
          # The plan action computes each target's root with the same
          # construction its ensure calls use, so the ensured root and the
          # published root cannot drift apart.
          root: ${{ matrix.root }}
          ttl: ${{ needs.configure.outputs.ttl }}
          attestations: ${{ steps.attest.outputs.bundle-path }}
          cupboard-version: ${{ inputs.cupboard-version }}
          expected-source-commit: ${{ job.workflow_sha }}
          release-repository: underwhelmingperformance/cupboard
