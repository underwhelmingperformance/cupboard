# Build a typed set of flake outputs and publish each target under its own
# root.
name: cupboard flake publish

on:
  workflow_call:
    inputs:
      url:
        description: Cupboard tenant URL.
        required: true
        type: string
      targets:
        description:
          Flake attribute containing the target manifest and derivation paths.
        required: false
        default: '.#cupboardOutputs'
        type: string
      preset:
        description: >-
          Derive cache, root-prefix, and ttl from the triggering event.
          'pull-request-and-branch' gives each pull_request run a pr-<number>
          cache with a 14-day TTL. A run on the configured branch uses the
          default cache. Both roots start with github:<repository>; other refs
          are rejected before planning. Only branch runs use reuse-view. This
          input is mutually exclusive with cache, root-prefix, ttl, and
          permanent; leave it empty to use those explicit inputs.
        required: false
        default: ''
        type: string
      branch:
        description:
          Branch trusted for non-pull-request runs under the
          pull-request-and-branch preset. Must match github setup --branch.
        required: false
        default: main
        type: string
      cache:
        description:
          Named cache to publish to, regardless of its read access. Leave empty
          to publish to the default cache. The workflow supplies one read_user
          and read_password pair for authenticated reads, so supply the
          credential that the selected private cache accepts. If the cache has
          its own verifier, the tenant-wide fallback credential is rejected by
          setup's initial cache-info probe, before publication starts.
        required: false
        default: ''
        type: string
      root-prefix:
        description:
          Prefix prepended to each target's rootSuffix. Required unless a preset
          derives it.
        required: false
        default: ''
        type: string
      ttl:
        description:
          Retention TTL such as 14d. Leave empty to inherit the selected cache's
          retention policy unless permanent is true.
        required: false
        default: ''
        type: string
      permanent:
        description: Retain every target root permanently.
        required: false
        default: false
        type: boolean
      run-root-ttl:
        description:
          TTL for the per-run root that every cohort push attaches, such as 7d
          or 12h. The root keeps streamed work available, so a later cohort can
          substitute a shared output instead of rebuilding it.
        required: false
        default: '24h'
        type: string
      run-root-permanent:
        description:
          Retain the per-run root permanently. Set run-root-ttl to an empty
          string when enabling this input.
        required: false
        default: false
        type: boolean
      reuse-view:
        description:
          Named tenant reuse view for shared intermediates missing from the
          destination. setup rejects a view whose nix-cache-info priority is not
          numerically greater than the destination's. Leave empty to disable the
          view.
        required: false
        default: ''
        type: string
      trusted-public-key:
        description:
          Nix signing key to trust for reads from the Cupboard tenant. When
          omitted, setup fetches the tenant's current key from /pubkey.
        required: false
        default: ''
        type: string
      cupboard-version:
        description: >-
          Exact published cupboard release tag to install, or 'latest'. When
          omitted, install a release for the called workflow revision or build
          its source if no release exists.
        required: false
        type: string
      maximise-space:
        description:
          Reclaim runner disk space before building by deleting preinstalled
          software such as language toolchains, Android and .NET SDKs, and
          Docker images. The run does not restore this software. Enable the
          option only on ephemeral GitHub-hosted runners.
        required: false
        default: false
        type: boolean
      push:
        description:
          Publish cohort results. When false, build every cohort directly
          without cache planning or publication.
        required: false
        default: true
        type: boolean
      gc-between-cohorts:
        description:
          On a GitHub-hosted runner using its local store, release the build's
          out-links and collect dead paths once a cohort job has published and
          attested its work. Requested collection is skipped with a notice on a
          self-hosted runner or when a direct remote store is selected. Off by
          default.
        required: false
        default: false
        type: boolean
      nix-config:
        description:
          Flake installable that evaluates to extra nix.conf text for the plan
          and cohort jobs. These settings override the workflow's own defaults,
          such as always-allow-substitutes.
        required: false
        default: ''
        type: string
      input-known-hosts:
        description:
          known_hosts lines that pin every SSH host serving a private flake
          input. Required when input_ssh_key is supplied.
        required: false
        default: ''
        type: string
      builders:
        description:
          One-line nix.conf builders specification for remote target groups.
          Separate multiple entries with semicolons. This is mutually exclusive
          with store. Set the machine SSH-key column to '-' and do not set a
          non-empty ssh-key in a builder store URI. Supply the private key
          through builder_ssh_key.
        required: false
        default: ''
        type: string
      builder-known-hosts:
        description:
          known_hosts lines that pin every enabled remote builder. Required when
          builders is supplied.
        required: false
        default: ''
        type: string
      store-known-hosts:
        description:
          known_hosts lines that pin the direct ssh-ng store. Required unless
          store uses the default SSH port and supplies
          base64-ssh-public-host-key. Independent of classic builder delegation.
        required: false
        default: ''
        type: string
      store-ambient-identity:
        description:
          Authenticate the direct store with the runner's SSH agent or default
          identity files instead of store_ssh_key. Intended only for explicitly
          provisioned self-hosted runners. When it is false and no store_ssh_key
          is supplied, the job fails rather than offering an ambient identity.
        required: false
        default: false
        type: boolean
      store:
        description: >-
          Remote ssh-ng store URI for every cohort job. Planning queries this
          store for path availability, building realises outputs there, and
          publication reads metadata and NAR bytes from it. The realised closure
          therefore does not enter the runner's local store. Measured packing
          also queries this store. When omitted, each runner uses its own store.
          Do not set a non-empty ssh-key in the URI; supply the private key
          through store_ssh_key.
        required: false
        default: ''
        type: string
      plan-runner:
        description: >-
          Runner label for the configure and plan jobs. The plan job evaluates
          the flake with the input SSH key and OIDC permission, so repositories
          with self-hosted runners should leave this input on a GitHub-hosted
          label, or route the job through runner groups; see
          docs/runner-provenance.md.
        required: false
        default: ubuntu-latest
        type: string
      enable-packing:
        description: >-
          Pack cohorts within pack-capacity using measured store sizes, rather
          than creating one job for each manifest cohort. Off by default; a
          cohort without a measurement is not repartitioned.
        required: false
        default: false
        type: boolean
      pack-capacity:
        description:
          Disk limit in bytes for measured cohort packing. Required when
          enable-packing is true.
        required: false
        default: ''
        type: string
    secrets:
      builder_ssh_key:
        description: SSH private key authenticating to the remote builders.
        required: false
      builder_ssh_config:
        description:
          ssh_config Host blocks for remote builder connections. The allowlist
          accepts endpoint, transport tuning, algorithm, liveness, and SetEnv
          directives. It rejects commands, proxies, forwarding, identity
          sources, verbose logging, Include, and Match.
        required: false
      store_ssh_key:
        description: SSH private key authenticating to the direct ssh-ng store.
        required: false
      store_ssh_config:
        description:
          ssh_config Host blocks for the direct store connection. The allowlist
          accepts endpoint, transport tuning, algorithm, liveness, and SetEnv
          directives. It rejects commands, proxies, forwarding, identity
          sources, verbose logging, Include, and Match. Independent of builder
          scheduling.
        required: false
      input_ssh_key:
        description:
          SSH key used while evaluating private flake inputs. Requires
          input-known-hosts.
        required: false
      read_user:
        description: Basic-auth user for private cache or reuse-view reads.
        required: false
      read_password:
        description: Basic-auth password for private cache or reuse-view reads.
        required: false

permissions: {}

jobs:
  # Resolve cupboard, the cache, root prefix, TTL, and reuse view once. Every
  # later job uses these validated values. This job executes code only from the
  # reusable workflow's immutable checkout.
  configure:
    name: Resolve the publication inputs
    runs-on: ${{ inputs.plan-runner }}
    timeout-minutes: 10
    permissions:
      contents: read # resolve cupboard releases and check out workflow code
    outputs:
      cupboard: ${{ steps.resolve-cupboard.outputs.cupboard }}
      cache: ${{ steps.resolve.outputs.cache }}
      root-prefix: ${{ steps.resolve.outputs.root-prefix }}
      ttl: ${{ steps.resolve.outputs.ttl }}
      permanent: ${{ steps.resolve.outputs.permanent }}
      reuse-view: ${{ steps.resolve.outputs.reuse-view }}
    steps:
      - name: Require GitHub Cloud workflow identity
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          if [ "${GITHUB_SERVER_URL}" != https://github.com ]; then
            echo '::error::The reusable cupboard workflows require GitHub Cloud because GitHub Enterprise Server does not provide job.workflow_repository, job.workflow_ref or job.workflow_sha'
            exit 1
          fi

      - name: Reserve the cupboard workflow checkout
        env:
          CUPBOARD_WORKFLOW_CHECKOUT: ${{ github.workspace }}/.cupboard-workflow
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          if [ -L "${CUPBOARD_WORKFLOW_CHECKOUT}" ]; then
            echo '::error::.cupboard-workflow is a symlink; refusing to replace it'
            exit 1
          fi
          if [ -e "${CUPBOARD_WORKFLOW_CHECKOUT}" ]; then
            origin="$(git -C "${CUPBOARD_WORKFLOW_CHECKOUT}" remote get-url origin 2>/dev/null || true)"
            expected="https://github.com/${WORKFLOW_REPOSITORY}"
            if [ "${origin}" != "${expected}" ] && [ "${origin}" != "${expected}.git" ]; then
              echo '::error::.cupboard-workflow is not a prior checkout of the called workflow; refusing to replace it'
              exit 1
            fi
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cupboard-workflow
          persist-credentials: false

      - uses: ./.cupboard-workflow/actions/resolve-cupboard
        id: resolve-cupboard
        with:
          cupboard-version: ${{ inputs.cupboard-version }}
          workflow-repository: ${{ job.workflow_repository }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          github-token: ${{ github.token }}
          github-api-url: ${{ github.api_url }}
          github-graphql-url: ${{ github.graphql_url }}

      - name: Resolve inputs
        id: resolve
        env:
          PRESET: ${{ inputs.preset }}
          CACHE: ${{ inputs.cache }}
          ROOT_PREFIX: ${{ inputs.root-prefix }}
          TTL: ${{ inputs.ttl }}
          PERMANENT: ${{ inputs.permanent }}
          REUSE_VIEW: ${{ inputs.reuse-view }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          BRANCH: ${{ inputs.branch }}
          STORE: ${{ inputs.store }}
          STORE_AMBIENT_IDENTITY: ${{ inputs.store-ambient-identity }}
          BUILDERS: ${{ inputs.builders }}
          BUILDER_KNOWN_HOSTS: ${{ inputs.builder-known-hosts }}
          STORE_KNOWN_HOSTS: ${{ inputs.store-known-hosts }}
        run: |
          set -euo pipefail
          for name in PRESET CACHE ROOT_PREFIX TTL REUSE_VIEW BRANCH; do
            if [[ "${!name}" == *$'\n'* || "${!name}" == *$'\r'* ]]; then
              echo "::error::${name} must not contain line breaks"
              exit 1
            fi
          done
          if [[ "${BUILDERS}" == *$'\n'* || "${BUILDERS}" == *$'\r'* ]]; then
            echo '::error::builders must not contain line breaks; separate inline builders with semicolons'
            exit 1
          fi
          if [ -n "${STORE}" ] && [ -n "${BUILDERS}" ]; then
            echo '::error::store and builders select different build modes and are mutually exclusive'
            exit 1
          fi
          if [ "${STORE_AMBIENT_IDENTITY}" = true ] && [ -z "${STORE}" ]; then
            echo '::error::store-ambient-identity requires the store input'
            exit 1
          fi
          if [ -n "${BUILDERS}" ] && [[ ! "${BUILDER_KNOWN_HOSTS}" =~ [^[:space:]] ]]; then
            echo '::error::builder-known-hosts is required when builders are enabled'
            exit 1
          fi

          store_uri_has_host_key=false
          if [[ "${STORE}" == *'?'* ]]; then
            store_query="${STORE#*\?}"
            store_query="${store_query%%#*}"
            IFS='&' read -r -a store_parameters <<< "${store_query}"
            for parameter in "${store_parameters[@]}"; do
              case "${parameter}" in
                base64-ssh-public-host-key=?*)
                  store_uri_has_host_key=true
                  break
                  ;;
                base64-ssh-public-host-key=)
                  break
                  ;;
              esac
            done
          fi

          store_uri_uses_default_ssh_port=false
          if [[ "${STORE}" == ssh-ng://* ]]; then
            store_authority="${STORE#ssh-ng://}"
            store_authority="${store_authority%%[/?#]*}"
            store_destination="${store_authority##*@}"
            store_port=''
            if [[ "${store_destination}" == \[*\] ]]; then
              store_port=''
            elif [[ "${store_destination}" == \[*\]:* ]]; then
              store_port="${store_destination##*]:}"
            elif [[ "${store_destination}" == *:* ]]; then
              store_port="${store_destination##*:}"
            fi
            if [ -z "${store_port}" ] || [ "${store_port}" = 22 ]; then
              store_uri_uses_default_ssh_port=true
            fi
          fi

          if [ -n "${STORE}" ] && [[ ! "${STORE_KNOWN_HOSTS}" =~ [^[:space:]] ]]; then
            if [ "${store_uri_has_host_key}" != true ]; then
              echo '::error::store-known-hosts is required unless the store URI supplies base64-ssh-public-host-key'
              exit 1
            fi
            if [ "${store_uri_uses_default_ssh_port}" != true ]; then
              echo '::error::store-known-hosts is required for a nonstandard SSH port; URI-only host-key pinning supports only the default SSH port'
              exit 1
            fi
          fi
          case "${PRESET}" in
            '')
              if [ -z "${ROOT_PREFIX}" ]; then
                echo '::error::root-prefix is required when no preset derives it'
                exit 1
              fi
              ;;
            pull-request-and-branch)
              if [ -n "${CACHE}${ROOT_PREFIX}${TTL}" ] || [ "${PERMANENT}" = true ]; then
                echo '::error::preset is mutually exclusive with cache, root-prefix, ttl and permanent'
                exit 1
              fi
              if [ "${EVENT_NAME}" = pull_request ]; then
                CACHE="pr-${PR_NUMBER}"
                TTL=14d
                PERMANENT=false
                if [ -n "${REUSE_VIEW}" ]; then
                  echo "::notice::reuse-view '${REUSE_VIEW}' applies to non-pull-request runs; disabled for this run"
                fi
                REUSE_VIEW=''
                ROOT_PREFIX="github:${REPOSITORY}/${CACHE}"
              elif [ "${REF}" = "refs/heads/${BRANCH}" ]; then
                ROOT_PREFIX="github:${REPOSITORY}/${BRANCH}"
                PERMANENT=true
              else
                echo "::error::preset 'pull-request-and-branch' accepts pull_request runs or refs/heads/${BRANCH}; got event '${EVENT_NAME}' on '${REF}'"
                exit 1
              fi
              ;;
            *)
              echo "::error::unknown preset '${PRESET}'"
              exit 1
              ;;
          esac
          {
            echo "cache=${CACHE}"
            echo "root-prefix=${ROOT_PREFIX}"
            echo "ttl=${TTL}"
            echo "permanent=${PERMANENT}"
            echo "reuse-view=${REUSE_VIEW}"
          } >> "${GITHUB_OUTPUT}"

  plan:
    name: Plan the publication
    needs: configure
    runs-on: ${{ inputs.plan-runner }}
    timeout-minutes: 30
    permissions:
      attestations: read # verify a selected cupboard release
      contents: read # check out the flake source
      id-token: write # OIDC token for the retention-root ensure calls
    outputs:
      cohort-matrix: ${{ steps.plan.outputs.cohort-matrix }}
      cohort-count: ${{ steps.plan.outputs.cohort-count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reserve the cupboard workflow checkout
        env:
          CUPBOARD_WORKFLOW_CHECKOUT: ${{ github.workspace }}/.cupboard-workflow
        run: |
          set -euo pipefail
          if [ -e "${CUPBOARD_WORKFLOW_CHECKOUT}" ] || [ -L "${CUPBOARD_WORKFLOW_CHECKOUT}" ]; then
            echo '::error::The caller checkout already contains .cupboard-workflow; refusing to replace caller content'
            exit 1
          fi

      # Checked out at the called workflow's own commit, not `main`, so a
      # tagged or SHA-pinned caller executes matching action code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cupboard-workflow
          persist-credentials: false

      - uses: ./.cupboard-workflow/actions/prepare
        with:
          ssh-key: ${{ secrets.input_ssh_key }}
          input-known-hosts: ${{ inputs.input-known-hosts }}
          nix-config: ${{ inputs.nix-config }}
          # Evaluating closure roots can realise derivations for their target
          # systems, so planning needs the caller's builders as well.
          remote: ${{ inputs.builders != '' && inputs.store == '' }}
          store: ${{ inputs.store }}
          builders: ${{ inputs.store == '' && inputs.builders || '' }}
          builder-ssh-key:
            ${{ inputs.builders != '' && inputs.store == '' &&
            secrets.builder_ssh_key || '' }}
          builder-ssh-config:
            ${{ inputs.builders != '' && inputs.store == '' &&
            secrets.builder_ssh_config || '' }}
          builder-known-hosts:
            ${{ inputs.builders != '' && inputs.store == '' &&
            inputs.builder-known-hosts || '' }}
          store-ssh-key:
            ${{ inputs.store != '' && secrets.store_ssh_key || '' }}
          store-ssh-config:
            ${{ inputs.store != '' && secrets.store_ssh_config || '' }}
          store-known-hosts:
            ${{ inputs.store != '' && inputs.store-known-hosts || '' }}
          store-ambient-identity:
            ${{ inputs.store != '' && inputs.store-ambient-identity || false }}

      - uses: ./.cupboard-workflow/actions/setup
        id: setup
        with:
          cache-url: ${{ inputs.url }}
          cache: ${{ needs.configure.outputs.cache }}
          cupboard: ${{ needs.configure.outputs.cupboard }}
          trusted-public-key: ${{ inputs.trusted-public-key }}
          read-user: ${{ secrets.read_user }}
          read-password: ${{ secrets.read_password }}
          reuse-view: ${{ needs.configure.outputs.reuse-view }}

      - name: Evaluate target manifest
        id: targets
        env:
          TARGETS: ${{ inputs.targets }}
          PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          if [[ "${PUSH}" == true ]]; then
            manifest=$(nix eval --json "${TARGETS}")
          else
            manifest=$(
              nix eval --json "${TARGETS}" \
                --apply 'targets: map (target: builtins.removeAttrs target ["rootDrvPath"]) targets'
            )
          fi
          echo "manifest=${manifest}" >> "${GITHUB_OUTPUT}"

      - uses: ./.cupboard-workflow/actions/plan
        id: plan
        with:
          targets: ${{ steps.targets.outputs.manifest }}
          url: ${{ inputs.url }}
          cupboard-path: ${{ steps.setup.outputs.cupboard-path }}
          cache: ${{ needs.configure.outputs.cache }}
          root-prefix: ${{ needs.configure.outputs.root-prefix }}
          ttl: ${{ needs.configure.outputs.ttl }}
          permanent: ${{ needs.configure.outputs.permanent }}
          optimise: ${{ inputs.push }}
          read-user: ${{ secrets.read_user }}
          read-password: ${{ secrets.read_password }}
          enable-packing: ${{ inputs.enable-packing }}
          pack-capacity: ${{ inputs.pack-capacity }}
          store: ${{ inputs.store }}
          # A retention root does not prove that provenance was attached.
          # Re-run cached targets so a previous attachment failure is retried.
          require-provenance: ${{ inputs.push }}

      - name: Summarise plan
        env:
          RETAINED: ${{ steps.plan.outputs.retained-count }}
          PLAN_FILE: ${{ steps.plan.outputs.plan-file }}
        run: |
          {
            echo '## Cupboard publication plan'
            echo
            echo "- Retained without building: ${RETAINED}"
            echo "- Independent targets: $(jq '.targets | length' "${PLAN_FILE}")"
          } >> "${GITHUB_STEP_SUMMARY}"

  cohort:
    needs: [configure, plan]
    if: ${{ needs.plan.outputs.cohort-count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.cohort-matrix) }}
    name: ${{ matrix.key }}
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 180
    permissions:
      attestations: write # record build provenance on the repository
      contents: read # check out the flake source
      id-token: write # OIDC token for the partition, roots.ensure and the push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reserve the cupboard workflow checkout
        env:
          CUPBOARD_WORKFLOW_CHECKOUT: ${{ github.workspace }}/.cupboard-workflow
        run: |
          set -euo pipefail
          if [ -e "${CUPBOARD_WORKFLOW_CHECKOUT}" ] || [ -L "${CUPBOARD_WORKFLOW_CHECKOUT}" ]; then
            echo '::error::The caller checkout already contains .cupboard-workflow; refusing to replace caller content'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cupboard-workflow
          persist-credentials: false

      - uses: ./.cupboard-workflow/actions/prepare
        with:
          ssh-key: ${{ secrets.input_ssh_key }}
          input-known-hosts: ${{ inputs.input-known-hosts }}
          nix-config: ${{ inputs.nix-config }}
          maximise-space: ${{ inputs.maximise-space }}
          remote: ${{ matrix.remote && inputs.store == '' }}
          store: ${{ inputs.store }}
          builders:
            ${{ matrix.remote && inputs.store == '' && inputs.builders || '' }}
          builder-ssh-key:
            ${{ matrix.remote && inputs.store == '' && secrets.builder_ssh_key
            || '' }}
          builder-ssh-config:
            ${{ matrix.remote && inputs.store == '' &&
            secrets.builder_ssh_config || '' }}
          builder-known-hosts:
            ${{ matrix.remote && inputs.store == '' &&
            inputs.builder-known-hosts || '' }}
          store-ssh-key:
            ${{ inputs.store != '' && secrets.store_ssh_key || '' }}
          store-ssh-config:
            ${{ inputs.store != '' && secrets.store_ssh_config || '' }}
          store-known-hosts:
            ${{ inputs.store != '' && inputs.store-known-hosts || '' }}
          store-ambient-identity:
            ${{ inputs.store != '' && inputs.store-ambient-identity || false }}

      - uses: ./.cupboard-workflow/actions/setup
        id: setup
        with:
          cache-url: ${{ inputs.url }}
          cache: ${{ needs.configure.outputs.cache }}
          cupboard: ${{ needs.configure.outputs.cupboard }}
          trusted-public-key: ${{ inputs.trusted-public-key }}
          read-user: ${{ secrets.read_user }}
          read-password: ${{ secrets.read_password }}
          reuse-view: ${{ needs.configure.outputs.reuse-view }}

      - uses: ./.cupboard-workflow/actions/build-cohort
        id: build-cohort
        with:
          cohort-json: ${{ toJSON(matrix) }}
          # The planner requires every member of a cohort to use the same value.
          # The action treats a failure as best-effort only when it can
          # attribute the failure to a target; infrastructure and unbounded
          # publication failures remain fatal.
          best-effort: ${{ matrix.bestEffort }}
          url: ${{ inputs.url }}
          cupboard-path: ${{ steps.setup.outputs.cupboard-path }}
          cache: ${{ needs.configure.outputs.cache }}
          reuse-view: ${{ needs.configure.outputs.reuse-view }}
          ttl: ${{ needs.configure.outputs.ttl }}
          permanent: ${{ needs.configure.outputs.permanent }}
          read-user: ${{ secrets.read_user }}
          read-password: ${{ secrets.read_password }}
          store: ${{ inputs.store }}
          push: ${{ inputs.push }}
          require-provenance: ${{ inputs.push }}
          gc-between-cohorts:
            ${{ inputs.gc-between-cohorts && runner.environment ==
            'github-hosted' && inputs.store == '' }}
          # Every cohort job in this run shares one root, so a later cohort can
          # substitute work an earlier cohort streamed instead of rebuilding
          # it.
          run-root:
            ${{ format('{0}/_cupboard-run/{1}',
            needs.configure.outputs.root-prefix, github.run_id) }}
          run-root-ttl: ${{ inputs.run-root-ttl }}
          run-root-permanent: ${{ inputs.run-root-permanent }}

      # A streamed cohort derives its receipt from the supervised build. A
      # remote-store cohort records only the queryable outputs that Nix reports
      # as results of this invocation. Substituted, already-valid and floating
      # paths are not build evidence. A cohort that published nothing writes no
      # receipt.
      - uses: ./.cupboard-workflow/actions/attest
        id: attest
        if: ${{ inputs.push && steps.build-cohort.outputs.receipt-file != '' }}
        with:
          receipt-file: ${{ steps.build-cohort.outputs.receipt-file }}
          url: ${{ inputs.url }}
          cache: ${{ needs.configure.outputs.cache }}
          read-user: ${{ secrets.read_user }}
          read-password: ${{ secrets.read_password }}

      # Attestation verifies the receipt against committed narinfos, so attach
      # the bundle only after publication and only when signing produced a
      # bundle.
      - uses: ./.cupboard-workflow/actions/attest-attach
        if:
          ${{ inputs.push && steps.build-cohort.outputs.receipt-file != '' &&
          steps.attest.outputs.bundle-path != '' }}
        with:
          url: ${{ inputs.url }}
          cupboard-path: ${{ steps.setup.outputs.cupboard-path }}
          cache: ${{ needs.configure.outputs.cache }}
          read-user: ${{ secrets.read_user }}
          read-password: ${{ secrets.read_password }}
          receipt-file: ${{ steps.build-cohort.outputs.receipt-file }}
          checksums-file: ${{ steps.attest.outputs.checksums-file }}
          # Each output contains one bundle path per line. The attach input
          # ignores empty lines.
          bundle: |
            ${{ steps.attest.outputs.bundle-path }}
            ${{ steps.attest.outputs.origin-bundle-path }}

      # At this point, every retention root has been set on the destination and
      # attestation has read the committed narinfos. Remove this build's
      # out-links before collection so a later cohort can substitute these
      # outputs from the cache. `nix store gc` leaves other GC roots intact.
      # Collection also runs after a failed cohort and does not fail the job.
      - name: Explain skipped local store collection
        if:
          ${{ !cancelled() && inputs.gc-between-cohorts && (runner.environment
          != 'github-hosted' || inputs.store != '') }}
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          STORE: ${{ inputs.store }}
        run: |
          if [ "${RUNNER_ENVIRONMENT}" != github-hosted ]; then
            echo '::notice::gc-between-cohorts was requested, but local store collection is unsupported on self-hosted runners; leaving the store untouched'
          elif [ -n "${STORE}" ]; then
            echo '::notice::gc-between-cohorts was requested, but the build uses a direct remote store; leaving the runner local store untouched'
          fi

      - name: Collect the local store
        if:
          ${{ !cancelled() && inputs.gc-between-cohorts && runner.environment ==
          'github-hosted' && inputs.store == '' }}
        env:
          OUT_LINK_DIRECTORY:
            ${{ steps.build-cohort.outputs.out-link-directory }}
        run: |
          set -uo pipefail
          if [ -n "${OUT_LINK_DIRECTORY}" ]; then
            rm -rf -- "${OUT_LINK_DIRECTORY}"
          fi
          if ! nix store gc; then
            echo '::warning::nix store gc failed; a later cohort job builds with the store as it stands'
          fi
