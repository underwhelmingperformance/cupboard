name: cupboard flake publish with trusted contributors
on:
  workflow_call:
    inputs:
      audience:
        description:
          Audience of the GitHub OIDC token. Defaults to the tenant URL.
        required: false
        type: string
      url:
        description: Tenant URL to publish to.
        required: true
        type: string
      targets:
        description: Flake attribute that evaluates to the target manifest.
        required: false
        default: .#cupboardOutputs
        type: string
      preset:
        description:
          "Choose the cache, root prefix and TTL from the event that triggered
          the run. The only preset is pull-request-and-branch. A pull_request
          run publishes to the cache gh-<repository-id>-pr-<number>, with roots
          under github:<repository>/pr-<number>/ that expire after 14 days. When
          publication is enabled, the workflow creates that cache if it does not
          exist. With `publish: none`, it reads from the tenant's default cache
          without creating or removing a pull-request cache. The preset refuses
          a pull request from a fork. When a pull request is closed and
          publication is enabled, the run closes that pull request's cache. Its
          contents remain available through the cache's configured grace period.
          A run on the branch in the branch input publishes to the default
          cache, with permanent roots under github:<repository>/<branch>/. The
          preset fails any other run. Cannot be combined with cache,
          root-prefix, ttl or permanent. Leave empty to set those inputs
          yourself."
        required: false
        default: ''
        type: string
      cache-access-mode:
        description:
          Required access for the selected cache, public or private. Without a
          preset, setup checks this on every event. With the preset, it selects
          access only for a publishing pull-request cache; branch and read-only
          runs use the default cache's access. When omitted, a new cache
          inherits the tenant's default cache access. An existing cache keeps
          its access, and an explicit mode must match it.
        required: false
        default: ''
        type: string
      branch:
        description:
          Branch whose runs publish to the default cache under the
          pull-request-and-branch preset. Must match the --branch option of
          cupboard github setup.
        required: false
        default: main
        type: string
      cache:
        description:
          Named cache to publish to. Leave empty to publish to the default
          cache. If this cache needs a different static read credential from
          read_user and read_password, supply destination_read_user and
          destination_read_password.
        required: false
        default: ''
        type: string
      root-prefix:
        description:
          Start of every target's root name. The target's rootSuffix follows it.
          Required unless preset is set.
        required: false
        default: ''
        type: string
      ttl:
        description:
          How long each target's root lasts after it was last set, such as 14d.
          If ttl is empty and permanent is false, the roots follow the cache's
          retention settings.
        required: false
        default: ''
        type: string
      permanent:
        description: Keep every target's root until it is replaced or removed.
        required: false
        default: false
        type: boolean
      run-root-ttl:
        description:
          How long the run root lasts, such as 7d or 12h. Every cohort job adds
          the paths that it publishes to the run root, so a later cohort can
          download a shared dependency from the cache instead of building it
          again.
        required: false
        default: 24h
        type: string
      run-root-permanent:
        description:
          Keep the run root permanently. Set run-root-ttl to an empty string
          when you turn this on.
        required: false
        default: false
        type: boolean
      read-caches:
        description:
          Additional canonical cache URLs from the selected tenant, one per
          line. Adds runner substituters and OIDC read resources without
          changing the destination cache. Cannot use credentials for these
          caches or a default static read credential. Remote builders need their
          own read credentials.
        required: false
        default: ''
        type: string
      reuse-view:
        description:
          Reuse view to read through, for paths that the destination cache does
          not have. The workflow refuses a view unless its priority number is
          greater than the destination's. The preset ignores this input. Leave
          empty for no view.
        required: false
        default: ''
        type: string
      trusted-public-key:
        description:
          Nix public key to trust for reads from the tenant's caches. If empty,
          each job downloads the tenant's current key from /pubkey and trusts
          it.
        required: false
        default: ''
        type: string
      cupboard-version:
        description:
          An exact cupboard release tag to install, or latest. If empty, the
          workflow installs the release that was published from its own commit.
          If there is no such release, it builds cupboard from that commit.
        required: false
        type: string
      maximise-space:
        description:
          Free disk space before building by deleting preinstalled software,
          such as language toolchains, the Android and .NET SDKs and Docker
          images on Linux, and Xcode on macOS. The software is not restored, so
          only use this on ephemeral GitHub-hosted runners.
        required: false
        default: false
        type: boolean
      build:
        description:
          Control when to build the requested outputs. `missing` uses an output
          from the store or a substituter when one is available, and builds it
          otherwise. `rebuild` builds each output again in the selected Nix
          store, even if it is already available. Nix may still fetch
          dependencies from substituters.
        required: false
        default: missing
        type: string
      substituter:
        description:
          Control whether to publish outputs available from external
          substituters. `copy` selects them for publication. `leave` keeps them
          upstream if consumers can obtain matching NARs for the output and all
          its runtime references under the configured signature policy. Both
          modes select outputs built in this run. The configured reference
          source is part of this tenant and can publish paths by reference.
        required: false
        default: leave
        type: string
      publish:
        description:
          Control which paths are published. `none` publishes no paths.
          `outputs` publishes selected requested outputs. `built` also publishes
          intermediates built during this run. `closure` also publishes their
          runtime references. With publication enabled, a successful run with no
          selected outputs replaces its retention roots with empty path lists.
        required: false
        default: built
        type: string
      push:
        description:
          Publish the selected paths and update retention roots. When false,
          publication is disabled regardless of the publish input.
        required: false
        default: true
        type: boolean
      attest:
        description:
          Sign and attach SLSA build provenance for paths built on the runner in
          this run. A missing attestation does not change the build choice. The
          workflow skips signing when publication is disabled.
        required: false
        default: true
        type: boolean
      gc-between-cohorts:
        description:
          Run garbage collection on the runner's Nix store after each cohort in
          a job has been published. This frees the disk space that the published
          paths used, and a later build downloads them from the cache if it
          needs them. It only happens on GitHub-hosted runners that use their
          own store. On a self-hosted runner, or when store is set, the job
          prints a notice and leaves the store as it is.
        required: false
        default: false
        type: boolean
      nix-config:
        description:
          Flake attribute that evaluates to extra nix.conf text for the plan and
          cohort jobs. These settings override the workflow's own, such as
          always-allow-substitutes.
        required: false
        default: ''
        type: string
      input-known-hosts:
        description:
          known_hosts lines for every SSH host that serves a private flake
          input. Required when input_ssh_key is set.
        required: false
        default: ''
        type: string
      builders:
        description:
          Nix builders specification on one line, as in nix.conf, for targets
          with remote set to true. Separate several builders with semicolons.
          Cannot be combined with store. Put '-' in the SSH key column, and do
          not set an ssh-key parameter in any builder URI. Supply the private
          key as the builder_ssh_key secret.
        required: false
        default: ''
        type: string
      builder-known-hosts:
        description:
          known_hosts lines for every remote builder. Required when builders is
          set.
        required: false
        default: ''
        type: string
      store-known-hosts:
        description:
          known_hosts lines for the remote store. Required unless the store uses
          port 22 and its URI includes base64-ssh-public-host-key.
        required: false
        default: ''
        type: string
      store-ambient-identity:
        description:
          Connect to the remote store with the runner's SSH agent or default key
          files instead of store_ssh_key. Only use this on a self-hosted runner
          that is dedicated to this job. When it is false and store_ssh_key is
          not set, the job's SSH configuration turns off the runner's agent and
          default key files, so authentication with a key fails.
        required: false
        default: false
        type: boolean
      store:
        description:
          ssh-ng:// URI of a remote store. Cohort jobs use it as their selected
          store for realisation and any enabled publication. Requested outputs
          built by a job remain in that store. Packing also measures sizes
          there. If empty, each job uses its runner's store. Supply the private
          key as store_ssh_key, not as an ssh-key parameter in the URI.
        required: false
        default: ''
        type: string
      plan-runner:
        description:
          Runner label for the configure, plan and cache-removal jobs. The plan
          job evaluates the flake with the input SSH key and can request an OIDC
          token. If your repository has self-hosted runners, keep this on a
          GitHub-hosted label or restrict the job with runner groups. See
          docs/security.md#runners.
        required: false
        default: ubuntu-latest
        type: string
      enable-packing:
        description:
          Pack small single-target cohorts into as few jobs as fit within
          pack-capacity, using measured closure sizes. Without packing, each
          cohort gets its own job. Off by default. A cohort without a
          measurement is not packed.
        required: false
        default: false
        type: boolean
      pack-capacity:
        description:
          Disk space in bytes that each packed job can use. Required when
          enable-packing is true.
        required: false
        default: ''
        type: string
    secrets:
      builder_ssh_key:
        description: SSH private key for the remote builders.
        required: false
      builder_ssh_config:
        description:
          ssh_config text for the remote builders. Every setting must be inside
          a Host block. Only HostName, User, Port, connection tuning, algorithm,
          keep-alive and SetEnv settings are accepted. Settings that run
          commands, use proxies, forward connections, load other identities,
          share connections, change the log level, or use Include or Match are
          refused.
        required: false
      store_ssh_key:
        description: SSH private key for the remote store.
        required: false
      store_ssh_config:
        description:
          ssh_config text for the remote store. Every setting must be inside a
          Host block. Only HostName, User, Port, connection tuning, algorithm,
          keep-alive and SetEnv settings are accepted. Settings that run
          commands, use proxies, forward connections, load other identities,
          share connections, change the log level, or use Include or Match are
          refused.
        required: false
      input_ssh_key:
        description:
          SSH private key for fetching private flake inputs. Requires
          input-known-hosts.
        required: false
      destination_read_user:
        description:
          User name of a credential to read the destination cache when its
          credential differs from read_user and read_password.
        required: false
      destination_read_password:
        description:
          Password of the destination cache's distinct read credential.
        required: false
      read_user:
        description:
          User name of the default static read credential for the selected cache
          and reference source.
        required: false
      read_password:
        description: Password of the default static read credential.
        required: false
      fallback_read_user:
        description:
          Deprecated alias of read_user. Supply it with fallback_read_password.
          The workflow warns when this secret is supplied.
        required: false
      fallback_read_password:
        description:
          Deprecated alias of read_password. Supply it with fallback_read_user.
          The workflow warns when this secret is supplied.
        required: false
      private_substituters:
        description:
          URLs of other private caches to read from, one per line, with the
          credential in each URL.
        required: false
permissions: {}
jobs:
  lookup:
    name: Resolve the merged pull request
    runs-on: ${{ inputs.plan-runner }}
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      pull-request: ${{ steps.lookup.outputs.pull-request }}
    steps:
      - name: Resolve the merged pull request
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          PRESET: ${{ inputs.preset }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BRANCH: ${{ inputs.branch }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          SHA: ${{ github.sha }}
        uses: $/actions/workflow-inputs
        with:
          mode: resolve-merged-pull-request

  publication:
    needs: lookup
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: $/.github/workflows/cupboard-flake-publish.yml
    with:
      audience: ${{ inputs.audience }}
      url: ${{ inputs.url }}
      targets: ${{ inputs.targets }}
      preset: ${{ inputs.preset }}
      cache-access-mode: ${{ inputs.cache-access-mode }}
      branch: ${{ inputs.branch }}
      cache: ${{ inputs.cache }}
      root-prefix: ${{ inputs.root-prefix }}
      ttl: ${{ inputs.ttl }}
      permanent: ${{ inputs.permanent }}
      run-root-ttl: ${{ inputs.run-root-ttl }}
      run-root-permanent: ${{ inputs.run-root-permanent }}
      read-caches: ${{ inputs.read-caches }}
      reuse-view: ${{ inputs.reuse-view }}
      trusted-public-key: ${{ inputs.trusted-public-key }}
      cupboard-version: ${{ inputs.cupboard-version }}
      maximise-space: ${{ inputs.maximise-space }}
      build: ${{ inputs.build }}
      substituter: ${{ inputs.substituter }}
      publish: ${{ inputs.publish }}
      push: ${{ inputs.push }}
      attest: ${{ inputs.attest }}
      gc-between-cohorts: ${{ inputs.gc-between-cohorts }}
      nix-config: ${{ inputs.nix-config }}
      input-known-hosts: ${{ inputs.input-known-hosts }}
      builders: ${{ inputs.builders }}
      builder-known-hosts: ${{ inputs.builder-known-hosts }}
      store-known-hosts: ${{ inputs.store-known-hosts }}
      store-ambient-identity: ${{ inputs.store-ambient-identity }}
      store: ${{ inputs.store }}
      plan-runner: ${{ inputs.plan-runner }}
      enable-packing: ${{ inputs.enable-packing }}
      pack-capacity: ${{ inputs.pack-capacity }}
      merged-pull-request: ${{ needs.lookup.outputs.pull-request }}
    secrets:
      builder_ssh_key: ${{ secrets.builder_ssh_key }}
      builder_ssh_config: ${{ secrets.builder_ssh_config }}
      store_ssh_key: ${{ secrets.store_ssh_key }}
      store_ssh_config: ${{ secrets.store_ssh_config }}
      input_ssh_key: ${{ secrets.input_ssh_key }}
      destination_read_user: ${{ secrets.destination_read_user }}
      destination_read_password: ${{ secrets.destination_read_password }}
      read_user: ${{ secrets.read_user }}
      read_password: ${{ secrets.read_password }}
      fallback_read_user: ${{ secrets.fallback_read_user }}
      fallback_read_password: ${{ secrets.fallback_read_password }}
      private_substituters: ${{ secrets.private_substituters }}
