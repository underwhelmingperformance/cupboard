name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 1.4.0 or v1.4.0.
        required: true
        type: string

concurrency:
  group:
    ${{ github.workflow }}-${{ startsWith(inputs.version, 'v') && inputs.version
    || format('v{0}', inputs.version) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: validate release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "${INPUT_VERSION}" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must be <major>.<minor>.<patch> with an optional lowercase v prefix"
            exit 1
          fi

          echo "version=v${INPUT_VERSION#v}" >> "${GITHUB_OUTPUT}"

  build:
    name: build ${{ matrix.asset-platform }} ${{ matrix.asset-arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.build.outputs.version }}
    permissions:
      contents: read
      id-token: write # OIDC token for the build provenance attestation
      attestations: write # write the build provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset-platform: linux
            asset-arch: x64
          - runner: ubuntu-24.04-arm
            asset-platform: linux
            asset-arch: arm64
          - runner: macos-26-intel
            asset-platform: macos
            asset-arch: x64
          - runner: macos-15
            asset-platform: macos
            asset-arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - id: build
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: >
          pnpm build:binary -- --version "$VERSION" --out-dir dist/release

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.asset-path }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.asset-name }}
          path: ${{ steps.build.outputs.asset-path }}
          if-no-files-found: error

  draft:
    name: assemble draft release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create and update the draft GitHub release
      id-token: write # OIDC token for the checksums attestation
      attestations: write # write the checksums attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/assets
          merge-multiple: true

      - name: Write checksums
        env:
          INPUT_DIRECTORY: dist/assets
        run: >
          node --experimental-transform-types
          --disable-warning=ExperimentalWarning scripts/release.ts checksums

      - name: Generate checksums attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/assets/checksums.txt

      - name: Create or update draft release
        env:
          INPUT_VERSION: ${{ needs.build.outputs.version }}
          INPUT_DIRECTORY: dist/assets
          INPUT_COMMITISH: ${{ github.sha }}
          INPUT_GITHUB_TOKEN: ${{ github.token }}
        run: >
          node --experimental-transform-types
          --disable-warning=ExperimentalWarning scripts/release.ts publish
