name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.asset-platform }} ${{ matrix.asset-arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset-platform: linux
            asset-arch: x64
          - runner: ubuntu-24.04-arm
            asset-platform: linux
            asset-arch: arm64
          - runner: macos-15-intel
            asset-platform: macos
            asset-arch: x64
          - runner: macos-15
            asset-platform: macos
            asset-arch: arm64
    steps:
      - id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"

          if [[ "$version" != v* ]]; then
            version="v$version"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ steps.version.outputs.version }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          pnpm build:binary -- --version "$VERSION" --out-dir dist/release

      - name: Generate artifact attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ steps.build.outputs.asset-path }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.asset-name }}
          path: ${{ steps.build.outputs.asset-path }}
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/assets
          merge-multiple: true

      - id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"

          if [[ "$version" != v* ]]; then
            version="v$version"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Write checksums
        shell: bash
        working-directory: dist/assets
        run: shasum -a 256 cupboard-*.tar.gz > checksums.txt

      - name: Generate checksums attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/assets/checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          gh release create "$VERSION" dist/assets/* --verify-tag --title
          "$VERSION"
