# Build a flake installable and publish it to a cupboard cache with GitHub OIDC
# authentication. Callers pin this reusable workflow so a trust rule can require
# its exact job_workflow_ref. The workflow installs a release for that revision
# or builds the revision from source.
name: cupboard publish

on:
  workflow_call:
    inputs:
      audience:
        description:
          Audience of the GitHub OIDC token. Defaults to the tenant URL.
        required: false
        type: string
      url:
        description: Tenant URL or cache URL to publish to.
        required: true
        type: string
      installable:
        description: Flake installable to realise and, when enabled, publish.
        required: false
        type: string
        default: '.'
      cache:
        description:
          Named cache to publish to. Leave empty to publish to the default
          cache.
        required: false
        type: string
        default: ''
      manage-pr-cache:
        description: >-
          Create the named cache for pull requests from this repository, reopen
          it when the pull request reopens, and close it through its configured
          grace when the pull request closes. Requires cache. Closed pull
          requests skip publication.
        required: false
        type: boolean
        default: false
      root:
        description:
          Start of the retention root name. The workflow appends the runner's
          Nix system, such as x86_64-linux, so each platform has its own root.
          If empty, the root is github:<repository>/<ref name>, without the
          system.
        required: false
        type: string
        default: ''
      ttl:
        description:
          How long the root lasts after it was last set, such as 7d. If empty,
          the root is permanent when permanent is true, and follows the cache's
          retention settings otherwise.
        required: false
        type: string
        default: ''
      permanent:
        description:
          Keep the root permanently when ttl is empty. Set it to false to use
          the cache's retention settings instead.
        required: false
        type: boolean
        default: true
      build:
        description: >-
          Control when to build the requested outputs. `missing` uses an output
          from the store or a substituter when one is available, and builds it
          otherwise. `rebuild` builds each output again in the selected Nix
          store, even if it is already available. Nix may still fetch
          dependencies from substituters.
        required: false
        type: string
        default: missing
      substituter:
        description: >-
          Control whether to publish outputs available from external
          substituters. `copy` selects them for publication. `leave` keeps them
          upstream if consumers can obtain matching NARs for the output and all
          its runtime references under the configured signature policy. Both
          modes select outputs built in this run. With `publish: closure`, all
          runtime references of selected outputs are published, including
          substituted dependencies.
        required: false
        type: string
        default: copy
      publish:
        description: >-
          Control which paths are published. `none` skips publication and
          retention updates. `outputs` publishes selected output paths. `built`
          also publishes observed build intermediates. `closure` publishes all
          their runtime references. If no outputs remain selected, `outputs` and
          `closure` replace the retention root with an empty path list.
        required: false
        type: string
        default: outputs
      attest:
        description: >-
          Sign and attach SLSA build provenance for paths built on the runner in
          this run. A missing attestation does not change the build choice. The
          workflow skips signing when publication is disabled.
        required: false
        default: true
        type: boolean
      runs-on:
        description: Runner label to build on.
        required: false
        type: string
        default: ubuntu-24.04
      trusted-public-key:
        description:
          Nix public key to trust for reads from the cache. If empty, the job
          downloads the cache's current key from /pubkey and trusts it.
        required: false
        type: string
        default: ''
      cupboard-version:
        description:
          An exact cupboard release tag to install, or latest. If empty, the
          workflow installs the release that was published from its own commit.
          If there is no such release, it builds cupboard from that commit.
        required: false
        type: string

# The caller grants the job permissions; nothing runs at workflow scope.
permissions: {}

jobs:
  configure:
    name: select cache operation
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    outputs:
      cupboard: ${{ steps.resolve-cupboard.outputs.cupboard }}
      operation: ${{ steps.operation.outputs.operation }}
    steps:
      - name: Require GitHub Cloud workflow identity
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          if [ "${GITHUB_SERVER_URL}" != https://github.com ]; then
            echo '::error::The reusable cupboard workflows require GitHub Cloud because GitHub Enterprise Server does not provide job.workflow_repository, job.workflow_ref or job.workflow_sha'
            exit 1
          fi

      - name: Resolve cache operation
        id: operation
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REPOSITORY_ID: ${{ github.repository_id }}
          HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          MANAGE_PR_CACHE: ${{ inputs.manage-pr-cache }}
          PUBLISH: ${{ inputs.publish }}
          CACHE: ${{ inputs.cache }}
        run: |
          set -euo pipefail
          case "$PUBLISH" in
            none|outputs|built|closure) ;;
            *) echo '::error::publish must be none, outputs, built, or closure' >&2; exit 2 ;;
          esac
          if [[ "$EVENT_NAME" == pull_request && "$HEAD_REPOSITORY_ID" != "$REPOSITORY_ID" ]]; then
            echo 'operation=skip' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          operation=publish
          if [[ "$EVENT_NAME" == pull_request ]]; then
            if [[ "$MANAGE_PR_CACHE" == true && "$PUBLISH" != none && -z "$CACHE" ]]; then
              echo '::error::manage-pr-cache requires a named cache input' >&2
              exit 2
            fi
            if [[ "$EVENT_ACTION" == closed ]]; then
              operation=skip
              if [[ "$MANAGE_PR_CACHE" == true && "$PUBLISH" != none ]]; then
                operation=close
              fi
            fi
          fi
          echo "operation=$operation" >> "$GITHUB_OUTPUT"

      - name: Validate publication options
        if: steps.operation.outputs.operation == 'publish'
        env:
          BUILD: ${{ inputs.build }}
          SUBSTITUTER: ${{ inputs.substituter }}
          PUBLISH: ${{ inputs.publish }}
          ATTEST: ${{ inputs.attest }}
        run: |
          case "${BUILD}" in
            missing|rebuild) ;;
            *) echo '::error::build must be missing or rebuild'; exit 1 ;;
          esac
          case "${SUBSTITUTER}" in
            leave|copy) ;;
            *) echo '::error::substituter must be leave or copy'; exit 1 ;;
          esac
          case "${ATTEST}" in
            true|false) ;;
            *) echo '::error::attest must be true or false'; exit 1 ;;
          esac

      - uses: $/actions/resolve-cupboard
        id: resolve-cupboard
        if: steps.operation.outputs.operation != 'skip'
        with:
          cupboard-version: ${{ inputs.cupboard-version }}
          workflow-repository: ${{ job.workflow_repository }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          github-token: ${{ github.token }}
          github-api-url: ${{ github.api_url }}
          github-graphql-url: ${{ github.graphql_url }}

  publish:
    needs: configure
    if: needs.configure.outputs.operation == 'publish'
    name: build and push
    runs-on: ${{ inputs.runs-on }}
    permissions:
      attestations: write # allow the attest action to upload bundles to the repository's attestation store
      contents: read # check out the flake source
      id-token: write # OIDC token for the cache push and Sigstore signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_version: 2.34.7

      # A source acquisition builds cupboard from a git checkout, so fetch the
      # workflow's own source for that case. Reserve the path first so
      # actions/checkout cannot replace caller-controlled content.
      - name: Reserve the cupboard workflow checkout
        if: ${{ fromJSON(needs.configure.outputs.cupboard).kind == 'source' }}
        env:
          CUPBOARD_WORKFLOW_CHECKOUT: ${{ github.workspace }}/.cupboard-workflow
        run: |
          set -euo pipefail
          if [ -e "${CUPBOARD_WORKFLOW_CHECKOUT}" ] || [ -L "${CUPBOARD_WORKFLOW_CHECKOUT}" ]; then
            echo '::error::The caller checkout already contains .cupboard-workflow; refusing to replace caller content'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ fromJSON(needs.configure.outputs.cupboard).kind == 'source' }}
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cupboard-workflow
          persist-credentials: false

      # Substitute from the destination cache, so a build reuses the store
      # paths that cache already holds.
      - uses: $/actions/setup
        id: setup
        with:
          cache-url: ${{ inputs.url }}
          audience: ${{ inputs.audience }}
          cache: ${{ inputs.cache }}
          provision-cache:
            ${{ inputs.manage-pr-cache && github.event_name == 'pull_request' &&
            inputs.publish != 'none' && inputs.cache || '' }}
          provision-cache-ttl: ${{ inputs.ttl }}
          trusted-public-key: ${{ inputs.trusted-public-key }}
          cupboard: ${{ needs.configure.outputs.cupboard }}
          checkout-dir: ${{ github.workspace }}/.cupboard-workflow

      - name: Reopen the cache
        if:
          ${{ inputs.manage-pr-cache && inputs.publish != 'none' &&
          github.event_name == 'pull_request' && github.event.action ==
          'reopened' }}
        env:
          AUDIENCE: ${{ steps.setup.outputs.read-session-audience }}
          CUPBOARD_PATH: ${{ steps.setup.outputs.cupboard-path }}
          URL: ${{ inputs.url }}
          CACHE: ${{ inputs.cache }}
        run: |
          set -euo pipefail
          args=(cache reopen "$URL" "$CACHE" --github-oidc)
          if [[ -n "$AUDIENCE" ]]; then args+=(--audience "$AUDIENCE"); fi
          "$CUPBOARD_PATH" "${args[@]}"

      - uses: $/actions/build-paths
        id: build
        with:
          installables: ${{ inputs.installable }}
          inline-paths: false
          publication-url: ${{ inputs.url }}
          build: ${{ inputs.build }}
          publish: ${{ inputs.publish }}
          substituter: ${{ inputs.substituter }}
          cupboard-path: ${{ steps.setup.outputs.cupboard-path }}
          read-session-target: ${{ steps.setup.outputs.read-session-target }}
          read-session-view: ${{ steps.setup.outputs.read-session-view }}
          read-session-caches: ${{ steps.setup.outputs.read-session-caches }}
          audience: ${{ steps.setup.outputs.read-session-audience }}

      # A retention root holds one set of paths, and each push replaces that
      # set completely, so builds for different systems must retain under
      # sibling roots. Append this builder's system to the caller's prefix.
      - name: Resolve the retention root
        id: root
        if: ${{ inputs.publish != 'none' && inputs.root != '' }}
        env:
          ROOT: ${{ inputs.root }}
        run:
          echo "root=${ROOT}/$(nix config show system)" | tee -a
          "${GITHUB_OUTPUT}"

      - uses: $/actions/push
        id: push
        if: ${{ inputs.publish != 'none' }}
        with:
          url: ${{ inputs.url }}
          paths-file: ${{ steps.build.outputs.publish-paths-file }}
          closure: ${{ inputs.publish == 'closure' }}
          build-receipt-file: ${{ steps.build.outputs.receipt-file }}
          cache: ${{ inputs.cache }}
          root:
            ${{ steps.root.outputs.root || format('github:{0}/{1}',
            github.repository, github.ref_name) }}
          ttl: ${{ inputs.ttl }}
          permanent: ${{ inputs.ttl == '' && inputs.permanent }}
          cupboard-path: ${{ steps.setup.outputs.cupboard-path }}
          read-session-target: ${{ steps.setup.outputs.read-session-target }}
          read-session-view: ${{ steps.setup.outputs.read-session-view }}
          read-session-caches: ${{ steps.setup.outputs.read-session-caches }}
          audience: ${{ steps.setup.outputs.read-session-audience }}

      - name: Attest built paths
        id: attest
        if: ${{ inputs.attest && steps.push.outcome == 'success' }}
        uses: $/actions/attest
        with:
          inline-bundles: false
          receipt-file: ${{ steps.push.outputs.receipt-file }}
          url: ${{ inputs.url }}
          cache: ${{ inputs.cache }}
          cupboard-path: ${{ steps.setup.outputs.cupboard-path }}
          read-session-target: ${{ steps.setup.outputs.read-session-target }}
          read-session-view: ${{ steps.setup.outputs.read-session-view }}
          read-session-caches: ${{ steps.setup.outputs.read-session-caches }}
          audience: ${{ steps.setup.outputs.read-session-audience }}

      - uses: $/actions/attest-attach
        if: ${{ inputs.attest && steps.attest.outputs.bundles-file != '' }}
        with:
          url: ${{ inputs.url }}
          cupboard-path: ${{ steps.setup.outputs.cupboard-path }}
          read-session-target: ${{ steps.setup.outputs.read-session-target }}
          read-session-view: ${{ steps.setup.outputs.read-session-view }}
          read-session-caches: ${{ steps.setup.outputs.read-session-caches }}
          audience: ${{ steps.setup.outputs.read-session-audience }}
          cache: ${{ inputs.cache }}
          receipt-file: ${{ steps.push.outputs.receipt-file }}
          checksums-file: ${{ steps.attest.outputs.checksums-file }}
          bundles-file: ${{ steps.attest.outputs.bundles-file }}

      - name: Report stored attestation coverage
        uses: $/actions/attest-status
        if:
          ${{ !cancelled() && inputs.publish != 'none' &&
          steps.push.outputs.receipt-file != '' }}
        with:
          url: ${{ inputs.url }}
          cache: ${{ inputs.cache }}
          cupboard-path: ${{ steps.setup.outputs.cupboard-path }}
          read-session-target: ${{ steps.setup.outputs.read-session-target }}
          read-session-view: ${{ steps.setup.outputs.read-session-view }}
          read-session-caches: ${{ steps.setup.outputs.read-session-caches }}
          audience: ${{ steps.setup.outputs.read-session-audience }}
          receipt-file: ${{ steps.push.outputs.receipt-file }}
          bundles-file: ${{ steps.attest.outputs.bundles-file }}

  close-cache:
    name: close the pull request's cache
    needs: configure
    if: needs.configure.outputs.operation == 'close'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      attestations: read # verify release CLI attestations during acquisition
      contents: read
      id-token: write # authenticate cache closure through GitHub OIDC
    steps:
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_version: 2.34.7

      # A source acquisition builds cupboard from a git checkout, so fetch the
      # workflow's own source for that case. Reserve the path first so
      # actions/checkout cannot replace caller-controlled content.
      - name: Reserve the cupboard workflow checkout
        if: ${{ fromJSON(needs.configure.outputs.cupboard).kind == 'source' }}
        env:
          CUPBOARD_WORKFLOW_CHECKOUT: ${{ github.workspace }}/.cupboard-workflow
        run: |
          set -euo pipefail
          if [ -e "${CUPBOARD_WORKFLOW_CHECKOUT}" ] || [ -L "${CUPBOARD_WORKFLOW_CHECKOUT}" ]; then
            echo '::error::The caller checkout already contains .cupboard-workflow; refusing to replace caller content'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ fromJSON(needs.configure.outputs.cupboard).kind == 'source' }}
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cupboard-workflow
          persist-credentials: false

      - uses: $/actions/setup
        id: setup
        with:
          cupboard: ${{ needs.configure.outputs.cupboard }}
          checkout-dir: ${{ github.workspace }}/.cupboard-workflow
          audience: ${{ inputs.audience }}

      - name: Close the cache
        env:
          AUDIENCE: ${{ steps.setup.outputs.read-session-audience }}
          CUPBOARD_PATH: ${{ steps.setup.outputs.cupboard-path }}
          URL: ${{ inputs.url }}
          CACHE: ${{ inputs.cache }}
        run: |
          set -euo pipefail
          args=(cache close "$URL" "$CACHE" --github-oidc)
          if [[ -n "$AUDIENCE" ]]; then args+=(--audience "$AUDIENCE"); fi
          "$CUPBOARD_PATH" "${args[@]}"
