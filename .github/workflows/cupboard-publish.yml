# Build a flake installable and publish it to a cupboard cache with GitHub OIDC
# authentication. Callers pin this reusable workflow so a trust rule can require
# its exact job_workflow_ref. The workflow installs a release for that revision
# or builds the revision from source.
name: cupboard publish

on:
  workflow_call:
    inputs:
      url:
        description: Tenant or named-cache URL to push to.
        required: true
        type: string
      installable:
        description: Flake installable to build and push.
        required: false
        type: string
        default: '.'
      cache:
        description:
          Named cache to push to. Leave empty to push to the default cache.
        required: false
        type: string
        default: ''
      root:
        description:
          Prefix for the retention root. The workflow appends the builder's Nix
          system, so each platform retains under its own root.
        required: false
        type: string
        default: ''
      ttl:
        description:
          Retention TTL such as 7d. When empty, retain permanently if permanent
          is true; otherwise inherit the cache's retention.
        required: false
        type: string
        default: ''
      permanent:
        description:
          Retain the root permanently when ttl is empty. Set false to inherit
          the cache's retention instead.
        required: false
        type: boolean
        default: true
      push:
        description: >-
          Control which outputs this workflow publishes to the destination
          cache. `none` runs the build without publishing its outputs and
          requires `attest: none`. This workflow has no reuse view, so
          `built-and-reused` publishes only outputs built in this run and
          outputs already present in the selected build store. `all` also
          publishes substituted outputs. A push replaces the retention root's
          complete path set, and `built-and-reused` leaves substituted outputs
          out of that set, so the workflow rejects `built-and-reused` when
          `root` is set.
        required: false
        type: string
        default: all
      attest:
        description: >-
          Control which attestations this workflow signs and attaches to
          published outputs. `none` skips signing in this workflow. `built`
          signs SLSA build provenance for outputs built in this run. `all` also
          signs build-origin statements that record how the published outputs
          were obtained. Signing requires `push` to be `built-and-reused` or
          `all`.
        required: false
        type: string
        default: all
      runs-on:
        description: Runner label to build on.
        required: false
        type: string
        default: ubuntu-24.04
      trusted-public-key:
        description:
          Nix public key to trust for reads from the cache. Leave empty to fetch
          the key the deployment serves and trust that.
        required: false
        type: string
        default: ''
      cupboard-version:
        description: >-
          Exact published cupboard release tag to install, or 'latest'. When
          omitted, install a release for the called workflow revision or build
          its source if no release exists.
        required: false
        type: string

# The caller grants the job permissions; nothing runs at workflow scope.
permissions: {}

jobs:
  publish:
    name: build and push
    runs-on: ${{ inputs.runs-on }}
    permissions:
      attestations: write # allow the attest action to upload bundles to the repository's attestation store
      contents: read # check out the flake source
      id-token: write # OIDC token for the cache push and Sigstore signing
    steps:
      - name: Require GitHub Cloud workflow identity
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          if [ "${GITHUB_SERVER_URL}" != https://github.com ]; then
            echo '::error::The reusable cupboard workflows require GitHub Cloud because GitHub Enterprise Server does not provide job.workflow_repository, job.workflow_ref or job.workflow_sha'
            exit 1
          fi

      - name: Validate publication options
        env:
          PUSH: ${{ inputs.push }}
          ATTEST: ${{ inputs.attest }}
          ROOT: ${{ inputs.root }}
        run: |
          case "${PUSH}" in
            none|built-and-reused|all) ;;
            *) echo '::error::push must be none, built-and-reused, or all'; exit 1 ;;
          esac
          case "${ATTEST}" in
            none|built|all) ;;
            *) echo '::error::attest must be none, built, or all'; exit 1 ;;
          esac
          if [ "${PUSH}" = none ] && [ "${ATTEST}" != none ]; then
            echo '::error::attest must be none when push is none'
            exit 1
          fi
          if [ "${PUSH}" = built-and-reused ] && [ -n "${ROOT}" ]; then
            echo '::error::push: built-and-reused with root would remove substituted outputs from the retention root; use push: all or omit root'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_version: 2.34.7

      - uses: $/actions/resolve-cupboard
        id: resolve-cupboard
        with:
          cupboard-version: ${{ inputs.cupboard-version }}
          workflow-repository: ${{ job.workflow_repository }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          github-token: ${{ github.token }}
          github-api-url: ${{ github.api_url }}
          github-graphql-url: ${{ github.graphql_url }}

      # A source acquisition builds cupboard from a git checkout, so fetch the
      # workflow's own source for that case. Reserve the path first so
      # actions/checkout cannot replace caller-controlled content.
      - name: Reserve the cupboard workflow checkout
        if:
          ${{ fromJSON(steps.resolve-cupboard.outputs.cupboard).kind == 'source'
          }}
        env:
          CUPBOARD_WORKFLOW_CHECKOUT: ${{ github.workspace }}/.cupboard-workflow
        run: |
          set -euo pipefail
          if [ -e "${CUPBOARD_WORKFLOW_CHECKOUT}" ] || [ -L "${CUPBOARD_WORKFLOW_CHECKOUT}" ]; then
            echo '::error::The caller checkout already contains .cupboard-workflow; refusing to replace caller content'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if:
          ${{ fromJSON(steps.resolve-cupboard.outputs.cupboard).kind == 'source'
          }}
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cupboard-workflow
          persist-credentials: false

      # Substitute from the destination cache, so a build reuses the store
      # paths that cache already holds.
      - uses: $/actions/setup
        id: setup
        with:
          cache-url: ${{ inputs.url }}
          cache: ${{ inputs.cache }}
          trusted-public-key: ${{ inputs.trusted-public-key }}
          cupboard: ${{ steps.resolve-cupboard.outputs.cupboard }}
          checkout-dir: ${{ github.workspace }}/.cupboard-workflow

      - uses: $/actions/build-paths
        id: build
        with:
          installables: ${{ inputs.installable }}
          # A cached output provides no evidence of a build in this run. With
          # `attest: built`, rebuild cached final derivations so a retry after
          # an attachment failure produces a new receipt.
          require-provenance: ${{ inputs.attest == 'built' }}

      # A retention root holds one set of paths, and each push replaces that
      # set completely, so builds for different systems must retain under
      # sibling roots. Append this builder's system to the caller's prefix.
      - name: Resolve the retention root
        id: root
        if: ${{ inputs.push != 'none' && inputs.root != '' }}
        env:
          ROOT: ${{ inputs.root }}
        run:
          echo "root=${ROOT}/$(nix config show system)" | tee -a
          "${GITHUB_OUTPUT}"

      - uses: $/actions/push
        id: push
        if:
          ${{ inputs.push != 'none' && ((inputs.push == 'all' &&
          steps.build.outputs.paths != '') ||
          steps.build.outputs.unsubstituted-paths != '') }}
        with:
          url: ${{ inputs.url }}
          paths:
            ${{ inputs.push == 'all' && steps.build.outputs.paths ||
            steps.build.outputs.unsubstituted-paths }}
          cache: ${{ inputs.cache }}
          root: ${{ steps.root.outputs.root || '' }}
          ttl: ${{ inputs.ttl }}
          permanent: ${{ inputs.ttl == '' && inputs.permanent }}
          cupboard-path: ${{ steps.setup.outputs.cupboard-path }}

      # This workflow exposes no read credentials and therefore supports only
      # public-read caches. Use the flake workflow for a private cache.
      - name: Attest committed paths
        id: attest
        if: ${{ inputs.attest != 'none' && steps.push.outcome == 'success' }}
        uses: $/actions/attest
        with:
          mode: ${{ inputs.attest }}
          receipt-file:
            ${{ inputs.push == 'all' && steps.build.outputs.receipt-file ||
            steps.build.outputs.unsubstituted-receipt-file }}
          url: ${{ inputs.url }}
          cache: ${{ inputs.cache }}

      - uses: $/actions/attest-attach
        if: ${{ inputs.attest != 'none' && steps.attest.outputs.bundles != '' }}
        with:
          url: ${{ inputs.url }}
          cupboard-path: ${{ steps.setup.outputs.cupboard-path }}
          cache: ${{ inputs.cache }}
          receipt-file: ${{ steps.attest.outputs.receipt-file }}
          checksums-file: ${{ steps.attest.outputs.checksums-file }}
          bundle: ${{ steps.attest.outputs.bundles }}
