# The reusable publish workflow: build a flake installable and push it to a
# cupboard cache with GitHub OIDC authentication. Callers reference it at main
# so a trust rule can pin the job_workflow_ref claim to this file at
# refs/heads/main, and route by cache and retention root per trigger.
name: cupboard publish

on:
  workflow_call:
    inputs:
      url:
        description: Tenant or named-cache URL to push to.
        required: true
        type: string
      installable:
        description: Flake installable to build and push.
        required: false
        type: string
        default: '.'
      cache:
        description: Named cache to push to. Empty pushes to the default cache.
        required: false
        type: string
        default: ''
      root:
        description:
          Retention root prefix recorded over the pushed paths. The builder's
          Nix system is appended, so one prefix serves every platform.
        required: false
        type: string
        default: ''
      ttl:
        description: Retention TTL such as 7d. Empty retains permanently.
        required: false
        type: string
        default: ''
      attest:
        description: Sign and attach SLSA build provenance for the paths.
        required: false
        type: boolean
        default: true
      runs-on:
        description: Runner label to build on.
        required: false
        type: string
        default: ubuntu-24.04
      trusted-public-key:
        description:
          Nix trusted public key for the cache. Empty trusts the key the
          deployment serves, on first use.
        required: false
        type: string
        default: ''
      cupboard-version:
        description: cupboard release to install.
        required: false
        type: string
        default: latest

# The caller grants the job permissions; nothing runs at workflow scope.
permissions: {}

jobs:
  publish:
    name: build and push
    runs-on: ${{ inputs.runs-on }}
    permissions:
      attestations: write # record the build provenance on the repository
      contents: read # check out the flake source
      id-token: write # OIDC token for the cache push and Sigstore signing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The composite actions ship alongside this workflow, which callers
      # reference at main, so fetch the same ref's copy of them into the
      # workspace. Running them from a local path keeps a repository's
      # SHA-pinning policy for remote actions intact; the directory is
      # untracked, so the flake source and its revision are unaffected.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: underwhelmingperformance/cupboard
          ref: main
          path: .cupboard
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Substitute from the cache being published to, so builds reuse the
      # store paths it already holds.
      # Locally-run actions have no github.action_repository to default the
      # release repository from, so name the repository publishing the
      # cupboard binaries explicitly.
      - uses: ./.cupboard/actions/setup
        with:
          cache-url: ${{ inputs.url }}
          cache: ${{ inputs.cache }}
          trusted-public-key: ${{ inputs.trusted-public-key }}
          cupboard-version: ${{ inputs.cupboard-version }}
          release-repository: underwhelmingperformance/cupboard

      # The attest and push actions take store paths, so record what the build
      # produces.
      - name: Build
        id: build
        env:
          INSTALLABLE: ${{ inputs.installable }}
        run: |
          {
            echo 'paths<<EOF'
            nix build -L --print-out-paths "${INSTALLABLE}"
            echo 'EOF'
          } | tee -a "${GITHUB_OUTPUT}"

      # A retention root holds one closure and a push replaces it wholesale, so
      # builds for different systems must retain under sibling roots. Append
      # this builder's system to the caller's prefix.
      - name: Resolve the retention root
        id: root
        if: ${{ inputs.root != '' }}
        env:
          ROOT: ${{ inputs.root }}
        run:
          echo "root=${ROOT}/$(nix config show system)" | tee -a
          "${GITHUB_OUTPUT}"

      - name: Attest
        id: attest
        if: ${{ inputs.attest }}
        uses: ./.cupboard/actions/attest
        with:
          paths: ${{ steps.build.outputs.paths }}

      - uses: ./.cupboard/actions/push
        with:
          url: ${{ inputs.url }}
          paths: ${{ steps.build.outputs.paths }}
          cache: ${{ inputs.cache }}
          root: ${{ steps.root.outputs.root || '' }}
          ttl: ${{ inputs.ttl }}
          attestations: ${{ steps.attest.outputs.bundle-path || '' }}
          cupboard-version: ${{ inputs.cupboard-version }}
          release-repository: underwhelmingperformance/cupboard
