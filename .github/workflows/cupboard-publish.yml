# Build a flake installable and publish it to a cupboard cache with GitHub OIDC
# authentication. Callers pin this reusable workflow so a trust rule can require
# its exact job_workflow_ref. The workflow installs a release for that revision
# or builds the revision from source.
name: cupboard publish

on:
  workflow_call:
    inputs:
      url:
        description: Tenant or named-cache URL to push to.
        required: true
        type: string
      installable:
        description: Flake installable to build and push.
        required: false
        type: string
        default: '.'
      cache:
        description: Named cache to push to. Empty pushes to the default cache.
        required: false
        type: string
        default: ''
      root:
        description:
          Retention root prefix recorded over the pushed paths. The builder's
          Nix system is appended, so one prefix serves every platform.
        required: false
        type: string
        default: ''
      ttl:
        description: Retention TTL such as 7d. Empty retains permanently.
        required: false
        type: string
        default: ''
      attest:
        description: Sign and attach SLSA build provenance for the paths.
        required: false
        type: boolean
        default: true
      runs-on:
        description: Runner label to build on.
        required: false
        type: string
        default: ubuntu-24.04
      trusted-public-key:
        description:
          Nix trusted public key for the cache. Empty trusts the key the
          deployment serves, on first use.
        required: false
        type: string
        default: ''
      cupboard-version:
        description: >-
          Exact published cupboard release tag to install, or 'latest'. When
          omitted, install a release for the called workflow revision or build
          its source if no release exists.
        required: false
        type: string

# The caller grants the job permissions; nothing runs at workflow scope.
permissions: {}

jobs:
  publish:
    name: build and push
    runs-on: ${{ inputs.runs-on }}
    permissions:
      attestations: write # record the build provenance on the repository
      contents: read # check out the flake source
      id-token: write # OIDC token for the cache push and Sigstore signing
    steps:
      - name: Require GitHub Cloud workflow identity
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          if [ "${GITHUB_SERVER_URL}" != https://github.com ]; then
            echo '::error::The reusable cupboard workflows require GitHub Cloud because GitHub Enterprise Server does not provide job.workflow_repository, job.workflow_ref or job.workflow_sha'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The composite actions ship with this workflow. Reserve the checkout path
      # before fetching the called revision so actions/checkout cannot replace
      # caller-controlled content.
      - name: Reserve the cupboard workflow checkout
        env:
          CUPBOARD_WORKFLOW_CHECKOUT: ${{ github.workspace }}/.cupboard-workflow
        run: |
          set -euo pipefail
          if [ -e "${CUPBOARD_WORKFLOW_CHECKOUT}" ] || [ -L "${CUPBOARD_WORKFLOW_CHECKOUT}" ]; then
            echo '::error::The caller checkout already contains .cupboard-workflow; refusing to replace caller content'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cupboard-workflow
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Resolve either the explicit selector or this workflow revision to one
      # validated acquisition coordinate.
      - uses: ./.cupboard-workflow/actions/resolve-cupboard
        id: resolve-cupboard
        with:
          cupboard-version: ${{ inputs.cupboard-version }}
          workflow-repository: ${{ job.workflow_repository }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          github-token: ${{ github.token }}
          github-api-url: ${{ github.api_url }}
          github-graphql-url: ${{ github.graphql_url }}

      # Substitute from the cache being published to, so builds reuse the
      # store paths it already holds.
      - uses: ./.cupboard-workflow/actions/setup
        id: setup
        with:
          cache-url: ${{ inputs.url }}
          cache: ${{ inputs.cache }}
          trusted-public-key: ${{ inputs.trusted-public-key }}
          cupboard: ${{ steps.resolve-cupboard.outputs.cupboard }}

      - uses: ./.cupboard-workflow/actions/build-paths
        id: build
        with:
          installables: ${{ inputs.installable }}
          # A cached output provides no evidence of a build in this run. Rebuild
          # cached final derivations when provenance is required so a retry after
          # an attachment failure produces a new receipt.
          require-provenance: ${{ inputs.attest }}

      # A retention root holds one closure and a push replaces it wholesale, so
      # builds for different systems must retain under sibling roots. Append
      # this builder's system to the caller's prefix.
      - name: Resolve the retention root
        id: root
        if: ${{ inputs.root != '' }}
        env:
          ROOT: ${{ inputs.root }}
        run:
          echo "root=${ROOT}/$(nix config show system)" | tee -a
          "${GITHUB_OUTPUT}"

      - uses: ./.cupboard-workflow/actions/push
        id: push
        with:
          url: ${{ inputs.url }}
          paths: ${{ steps.build.outputs.paths }}
          cache: ${{ inputs.cache }}
          root: ${{ steps.root.outputs.root || '' }}
          ttl: ${{ inputs.ttl }}
          cupboard-path: ${{ steps.setup.outputs.cupboard-path }}

      # This workflow exposes no read credentials and therefore supports only
      # public-read caches. Use the flake workflow for a private cache.
      - name: Attest committed paths
        id: attest
        if: ${{ inputs.attest }}
        uses: ./.cupboard-workflow/actions/attest
        with:
          receipt-file: ${{ steps.build.outputs.receipt-file }}
          url: ${{ inputs.url }}
          cache: ${{ inputs.cache }}

      - uses: ./.cupboard-workflow/actions/attest-attach
        if: ${{ inputs.attest && steps.attest.outputs.bundle-path != '' }}
        with:
          url: ${{ inputs.url }}
          cupboard-path: ${{ steps.setup.outputs.cupboard-path }}
          cache: ${{ inputs.cache }}
          receipt-file: ${{ steps.build.outputs.receipt-file }}
          checksums-file: ${{ steps.attest.outputs.checksums-file }}
          # Both bundles cover the same subjects. The attach input takes one
          # path per line and ignores an empty one, so a run that signed only
          # the build provenance attaches only that bundle.
          bundle: |
            ${{ steps.attest.outputs.bundle-path }}
            ${{ steps.attest.outputs.origin-bundle-path }}
