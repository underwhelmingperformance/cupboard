# The reusable publish workflow: build a flake installable and push it to a
# cupboard cache with GitHub OIDC authentication. Callers pin the workflow so a
# trust rule can require that exact job_workflow_ref; cupboard resolves a
# release built from that revision, or builds the revision itself.
name: cupboard publish

on:
  workflow_call:
    inputs:
      url:
        description: Tenant or named-cache URL to push to.
        required: true
        type: string
      installable:
        description: Flake installable to build and push.
        required: false
        type: string
        default: '.'
      cache:
        description: Named cache to push to. Empty pushes to the default cache.
        required: false
        type: string
        default: ''
      root:
        description:
          Retention root prefix recorded over the pushed paths. The builder's
          Nix system is appended, so one prefix serves every platform.
        required: false
        type: string
        default: ''
      ttl:
        description: Retention TTL such as 7d. Empty retains permanently.
        required: false
        type: string
        default: ''
      attest:
        description: Sign and attach SLSA build provenance for the paths.
        required: false
        type: boolean
        default: true
      runs-on:
        description: Runner label to build on.
        required: false
        type: string
        default: ubuntu-24.04
      trusted-public-key:
        description:
          Nix trusted public key for the cache. Empty trusts the key the
          deployment serves, on first use.
        required: false
        type: string
        default: ''
      cupboard-version:
        description: >-
          Exact published cupboard release tag to install, or 'latest'. Empty
          uses a release for the called workflow revision when one exists,
          otherwise source.
        required: false
        type: string

# The caller grants the job permissions; nothing runs at workflow scope.
permissions: {}

jobs:
  publish:
    name: build and push
    runs-on: ${{ inputs.runs-on }}
    permissions:
      attestations: write # record the build provenance on the repository
      contents: read # check out the flake source
      id-token: write # OIDC token for the cache push and Sigstore signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The composite actions ship alongside this workflow, so fetch the called
      # workflow's resolved revision into a reserved workspace path. A caller is
      # allowed to own any path in its checkout, so fail before checkout rather
      # than letting actions/checkout replace caller content at that path.
      - name: Reserve the cupboard workflow checkout
        env:
          CUPBOARD_WORKFLOW_CHECKOUT: ${{ github.workspace }}/.cupboard-workflow
        run: |
          set -euo pipefail
          if [ -e "${CUPBOARD_WORKFLOW_CHECKOUT}" ] || [ -L "${CUPBOARD_WORKFLOW_CHECKOUT}" ]; then
            echo '::error::The caller checkout already contains .cupboard-workflow; refusing to replace caller content'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cupboard-workflow
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Collapse an explicit selector, or the called workflow revision, to one
      # validated coordinate before setup or publication consumes it.
      - uses: ./.cupboard-workflow/actions/resolve-cupboard
        id: resolve-cupboard
        with:
          cupboard-version: ${{ inputs.cupboard-version }}
          workflow-repository: ${{ job.workflow_repository }}
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}
          github-token: ${{ github.token }}
          github-api-url: ${{ github.api_url }}
          github-graphql-url: ${{ github.graphql_url }}

      # Substitute from the cache being published to, so builds reuse the
      # store paths it already holds.
      - uses: ./.cupboard-workflow/actions/setup
        id: setup
        with:
          cache-url: ${{ inputs.url }}
          cache: ${{ inputs.cache }}
          trusted-public-key: ${{ inputs.trusted-public-key }}
          cupboard: ${{ steps.resolve-cupboard.outputs.cupboard }}

      - uses: ./.cupboard-workflow/actions/build-paths
        id: build
        with:
          installables: ${{ inputs.installable }}
          # A cached output has no current-run build evidence. When provenance
          # is required, build-paths rebuilds only such final derivations before
          # writing its receipt, so a rerun cannot turn an earlier attach
          # failure into a successful unattested publication.
          require-provenance: ${{ inputs.attest }}

      # A retention root holds one closure and a push replaces it wholesale, so
      # builds for different systems must retain under sibling roots. Append
      # this builder's system to the caller's prefix.
      - name: Resolve the retention root
        id: root
        if: ${{ inputs.root != '' }}
        env:
          ROOT: ${{ inputs.root }}
        run:
          echo "root=${ROOT}/$(nix config show system)" | tee -a
          "${GITHUB_OUTPUT}"

      - uses: ./.cupboard-workflow/actions/push
        id: push
        with:
          url: ${{ inputs.url }}
          paths: ${{ steps.build.outputs.paths }}
          cache: ${{ inputs.cache }}
          root: ${{ steps.root.outputs.root || '' }}
          ttl: ${{ inputs.ttl }}
          cupboard-path: ${{ steps.setup.outputs.cupboard-path }}

      # This compact workflow has always targeted public-read caches and
      # exposes no read secrets. Private caches use the flake workflow, which
      # threads both credential halves into attest and attach.
      - name: Attest committed paths
        id: attest
        if: ${{ inputs.attest }}
        uses: ./.cupboard-workflow/actions/attest
        with:
          receipt-file: ${{ steps.build.outputs.receipt-file }}
          url: ${{ inputs.url }}
          cache: ${{ inputs.cache }}

      - uses: ./.cupboard-workflow/actions/attest-attach
        if: ${{ inputs.attest && steps.attest.outputs.bundle-path != '' }}
        with:
          url: ${{ inputs.url }}
          cupboard-path: ${{ steps.setup.outputs.cupboard-path }}
          cache: ${{ inputs.cache }}
          receipt-file: ${{ steps.build.outputs.receipt-file }}
          checksums-file: ${{ steps.attest.outputs.checksums-file }}
          bundle: ${{ steps.attest.outputs.bundle-path }}
