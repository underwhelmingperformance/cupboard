# The distribution leg of the release flow. release.yml builds the binaries,
# drafts the release, and writes the substituter instructions into the draft's
# notes; publishing that draft creates the tag and fires this workflow, which
# builds the tagged revision through the flake on every supported system,
# pushes the builds to the shared release cache named in those notes, and
# publishes the flake release to FlakeHub so consumers can track versions with
# a semver range.
name: release cache

on:
  release:
    types:
      - published

# One run per release; a re-run of the same tag queues rather than racing an
# in-flight publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}

permissions:
  contents: read

jobs:
  publish:
    name: publish (release cache)
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: x86_64-darwin
            runner: macos-26-intel
          - system: aarch64-darwin
            runner: macos-15
    permissions:
      attestations: write # allow the attest action to upload bundles to the repository's attestation store
      contents: read # check out the flake source
      id-token: write # OIDC token for the cache push and Sigstore signing
    uses: underwhelmingperformance/cupboard/.github/workflows/cupboard-publish.yml@main # zizmor: ignore[unpinned-uses]
    with:
      runs-on: ${{ matrix.runner }}
      url: https://cupboard.supply/t/cupboard
      build: rebuild
      cache: releases
      trusted-public-key: cupboard-1:tiaTSFvY6LqLUwbjsNcig64LnxZ+T5EQgW5Cr4XjXqU=
      root: github:${{ github.repository }}/${{ github.event.release.tag_name }}

  flakehub:
    name: publish (flakehub)
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the tagged flake source
      id-token: write # OIDC token that authenticates the FlakeHub publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install

      - uses: DeterminateSystems/flakehub-push@e001ee821cdb763ef120c01f1048bfb2f938bb9c # v7
        with:
          visibility: public
          tag: ${{ github.event.release.tag_name }}
