# The distribution leg of the release flow. release.yml builds the binaries,
# drafts the release, and writes the substituter instructions into the draft's
# notes; publishing that draft creates the tag and fires this workflow, which
# builds the tagged revision through the flake on every supported system,
# pushes the builds to the shared release cache named in those notes, and
# publishes the flake release to FlakeHub so consumers can track versions with
# a semver range.
name: release cache

on:
  release:
    types:
      - published

# One run per release; a re-run of the same tag queues rather than racing an
# in-flight publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}

permissions:
  contents: read

jobs:
  publish:
    name: publish (release cache)
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: x86_64-darwin
            runner: macos-26-intel
          - system: aarch64-darwin
            runner: macos-15
    permissions:
      attestations: write # record the build provenance on the repository
      contents: read # check out the flake source
      id-token: write # OIDC token for the cache push and Sigstore signing
    # The @main reference is load-bearing: the tenant's trust rule pins the
    # job_workflow_ref claim to this file at refs/heads/main.
    uses: underwhelmingperformance/cupboard/.github/workflows/cupboard-publish.yml@main # zizmor: ignore[unpinned-uses]
    with:
      runs-on: ${{ matrix.runner }}
      url: https://cupboard.supply/t/cupboard
      cache: releases
      root: github:${{ github.repository }}/${{ github.event.release.tag_name }}
      cupboard-version: ${{ github.event.release.tag_name }}

  flakehub:
    name: publish (flakehub)
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the tagged flake source
      id-token: write # OIDC token that authenticates the FlakeHub publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_version: 2.34.7

      - uses: DeterminateSystems/flakehub-push@71f57208810a5d299fc6545350981de98fdbc860 # v6
        with:
          visibility: public
          tag: ${{ github.event.release.tag_name }}
