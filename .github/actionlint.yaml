# actionlint reads the self-repository `uses: $/...` form as a malformed action
# or reusable workflow reference. Support is unmerged upstream in pull request
# #732:
# https://github.com/rhysd/actionlint/pull/732
#
# Ignore those two messages for the `$/` spellings alone, so a malformed
# reference still fails.
# Remove the entries once the pinned actionlint release parses the syntax.

# GitHub documents `job.workflow_repository`, `job.workflow_ref`, and
# `job.workflow_sha` and shows how a reusable workflow can check out its own
# source:
# https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context
# actionlint support is tracked upstream in issue #647 and pull request #696:
# https://github.com/rhysd/actionlint/issues/647
# https://github.com/rhysd/actionlint/pull/696
#
# The reusable publish workflows use these properties to resolve the cupboard
# release that matches the called revision. Ignore only the corresponding
# unknown-property messages in those workflow files.
# Remove the entry once the pinned actionlint release models the properties.
paths:
  .github/workflows/ci.yml:
    ignore:
      - 'specifying action "\$/[^"]*" in invalid format because ref is missing'
      - 'reusable workflow call "\$/[^"]*" at "uses" is not following the format'
  .github/workflows/cupboard-publish.yml:
    ignore:
      - 'property "workflow_(repository|ref|sha)" is not defined in object type'
      - 'specifying action "\$/[^"]*" in invalid format because ref is missing'
      - 'reusable workflow call "\$/[^"]*" at "uses" is not following the format'
  .github/workflows/cupboard-flake-publish.yml:
    ignore:
      - 'property "workflow_(repository|ref|sha)" is not defined in object type'
      - 'specifying action "\$/[^"]*" in invalid format because ref is missing'
      - 'reusable workflow call "\$/[^"]*" at "uses" is not following the format'
