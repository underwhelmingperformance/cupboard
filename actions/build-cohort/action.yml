name: Build a publish cohort
description:
  Recheck a publication cohort against the selected store, build missing
  targets, publish results when enabled, write the build receipt, and update
  each target root. Local builds stream through `cupboard build-push`; remote
  ssh-ng builds publish keyed results directly.
inputs:
  cohort-json:
    description: This job's entry from the plan cohort-matrix.
    required: true
  url:
    description: Cupboard Worker URL.
    required: true
  cupboard-path:
    description: Path to the cupboard binary installed by actions/setup.
    required: true
  cache:
    description:
      Named cache to inspect and publish to. Empty selects the default cache.
    required: false
  reuse-view:
    description: Named reuse view to probe for substitutable paths.
    required: false
  ttl:
    description: TTL applied when retaining an already cached target.
    required: false
  audience:
    description: GitHub OIDC audience. Defaults to url.
    required: false
  read-user:
    description: Username for cache reads.
    required: false
  read-password:
    description: Password for cache reads.
    required: false
  max-jobs:
    description:
      Maximum build jobs for the selected store. Leave empty to use that store's
      Nix configuration.
    required: false
  store:
    description: >-
      URI of the remote ssh-ng store used for planning, building and
      publication. Every selected output path must be known during planning;
      floating content-addressed outputs require a local build. Leave empty to
      use the runner's store.
    required: false
  push:
    description: >-
      Publish the cohort. `true` streams a local build or publishes keyed
      remote-store results, then sets each target root; `false` only builds.
    required: false
  require-provenance:
    description: >-
      Require provenance from this run for every final output. The action skips
      a target build only when the cache already serves its output path and has
      an attestation for it. It executes every other selected final derivation,
      including one whose output is already valid in the build store.
    required: false
    default: 'false'
  best-effort:
    description: >-
      Tolerate a target build failure, but only once the action has published
      every surviving path, updated their retention roots and written the output
      files. Planning, authentication, copying, publication, retention and
      receipt failures remain fatal.
    required: false
  gc-between-cohorts:
    description: >-
      Collect the local Nix store between build-push cohorts. A later cohort
      then substitutes the shared paths from the cache instead of keeping them
      on the runner's disk. Disabled by default, and when it is disabled the
      action deletes no store paths.
    required: false
  run-root:
    description: Run root that every published path joins as it commits.
    required: false
  run-root-ttl:
    description: Expire the run root after this duration, such as 2d.
    required: false
  receipt-file:
    description: >-
      Where to write the cohort's build receipt. Defaults to a runner-local path
      under RUNNER_TEMP.
    required: false
  target-paths-file:
    description: Where to write the cohort's target output paths.
    required: false
  intermediate-paths-file:
    description: >-
      Where to write built outputs that are not any target's own output.
    required: false
  reference-paths-file:
    description: >-
      Where to write paths the destination already serves and can publish by
      reference.
    required: false
  left-upstream-file:
    description: >-
      Where to record targets excluded from publication because an upstream
      substituter serves them.
    required: false
  counts-file:
    description: >-
      Where to write the partition counts and capacity result for the receipt.
    required: false
outputs:
  target-paths-file:
    description: File containing the cohort's target output paths.
    value: ${{ steps.build-cohort.outputs.target-paths-file }}
  intermediate-paths-file:
    description: File containing built outputs that are not target paths.
    value: ${{ steps.build-cohort.outputs.intermediate-paths-file }}
  reference-paths-file:
    description: File containing paths publishable by reference.
    value: ${{ steps.build-cohort.outputs.reference-paths-file }}
  left-upstream-file:
    description: >-
      File containing targets excluded from publication because an upstream
      substituter serves them.
    value: ${{ steps.build-cohort.outputs.left-upstream-file }}
  counts-file:
    description: File containing the partition counts and capacity result.
    value: ${{ steps.build-cohort.outputs.counts-file }}
  receipt-file:
    description: >-
      Build receipt for actions/attest. A streamed cohort writes it from its
      supervised build. A remote-store cohort records the paths published from
      the selected store, and records provenance only for the outputs Nix
      reported as results. This output is empty when publication is disabled or
      the cohort has no result paths to publish.
    value: ${{ steps.build-cohort.outputs.receipt-file }}
  out-link-directory:
    description: >-
      Directory containing the build's out-links. They keep the cohort's target
      closures alive until the job finishes reading those paths.
    value: ${{ steps.build-cohort.outputs.out-link-directory }}
runs:
  using: composite
  steps:
    - name: Resolve the pinned toolchain
      id: toolchain
      shell: bash
      run: |
        manifest="$GITHUB_ACTION_PATH/../../package.json"
        version="$(sed -n 's/.*"packageManager": *"pnpm@\([^+"]*\).*/\1/p' "$manifest")"
        node_version="$(tr -d '\r\n' < "$GITHUB_ACTION_PATH/../../.node-version")"
        test -n "$version" && test -n "$node_version"
        echo "pnpm-version=$version" >> "$GITHUB_OUTPUT"
        echo "node-version=$node_version" >> "$GITHUB_OUTPUT"

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: ${{ steps.toolchain.outputs.pnpm-version }}
        package_json_file: ${{ github.action_path }}/../../package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.toolchain.outputs.node-version }}

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: pnpm install --filter @cupboard/action... --prod --frozen-lockfile

    - name: Build cohort
      id: build-cohort
      shell: bash
      env:
        COHORT_JSON: ${{ inputs.cohort-json }}
        URL: ${{ inputs.url }}
        CUPBOARD_PATH: ${{ inputs.cupboard-path }}
        CACHE: ${{ inputs.cache }}
        REUSE_VIEW: ${{ inputs.reuse-view }}
        TTL: ${{ inputs.ttl }}
        AUDIENCE: ${{ inputs.audience }}
        READ_USER: ${{ inputs.read-user }}
        READ_PASSWORD: ${{ inputs.read-password }}
        MAX_JOBS: ${{ inputs.max-jobs }}
        STORE: ${{ inputs.store }}
        PUSH: ${{ inputs.push }}
        REQUIRE_PROVENANCE: ${{ inputs.require-provenance }}
        BEST_EFFORT: ${{ inputs.best-effort }}
        GC_BETWEEN_COHORTS: ${{ inputs.gc-between-cohorts }}
        RUN_ROOT: ${{ inputs.run-root }}
        RUN_ROOT_TTL: ${{ inputs.run-root-ttl }}
        RECEIPT_FILE: ${{ inputs.receipt-file }}
        TARGET_PATHS_FILE: ${{ inputs.target-paths-file }}
        INTERMEDIATE_PATHS_FILE: ${{ inputs.intermediate-paths-file }}
        REFERENCE_PATHS_FILE: ${{ inputs.reference-paths-file }}
        LEFT_UPSTREAM_FILE: ${{ inputs.left-upstream-file }}
        COUNTS_FILE: ${{ inputs.counts-file }}
      run: |
        args=(build-cohort
          --cohort-json "$COHORT_JSON"
          --url "$URL"
          --cupboard-path "$CUPBOARD_PATH"
          --cache "$CACHE"
          --reuse-view "$REUSE_VIEW"
          --ttl "$TTL"
          --audience "$AUDIENCE"
          --read-user "$READ_USER"
          --read-password "$READ_PASSWORD"
          --max-jobs "$MAX_JOBS"
          --store "$STORE"
          --push "$PUSH"
          --require-provenance "$REQUIRE_PROVENANCE"
          --best-effort "$BEST_EFFORT"
          --gc-between-cohorts "$GC_BETWEEN_COHORTS"
          --run-root "$RUN_ROOT"
          --run-root-ttl "$RUN_ROOT_TTL"
          --receipt-file "$RECEIPT_FILE"
          --target-paths-file "$TARGET_PATHS_FILE"
          --intermediate-paths-file "$INTERMEDIATE_PATHS_FILE"
          --reference-paths-file "$REFERENCE_PATHS_FILE"
          --left-upstream-file "$LEFT_UPSTREAM_FILE"
          --counts-file "$COUNTS_FILE")
        node --experimental-transform-types \
          --disable-warning=ExperimentalWarning \
          "$GITHUB_ACTION_PATH/../src/main.ts" "${args[@]}"
