name: Build a publish cohort
description:
  Builds one cohort for the flake publish workflow. It checks the cohort's
  targets again against the build store, builds the missing ones, publishes the
  results if push is true, writes the build receipt, and sets each target's
  root. On the runner, `cupboard build-push` publishes each output as soon as it
  is built. With a remote store, the action publishes the outputs from that
  store after the build.
inputs:
  cohort-json:
    description: This job's entry from the plan's cohort-matrix.
    required: true
  url:
    description: Tenant URL or cache URL to publish to.
    required: true
  cupboard-path:
    description: Path to the cupboard executable that actions/setup installed.
    required: true
  cache:
    description:
      Named cache to check and publish to. Leave empty for the default cache.
    required: false
  reuse-view:
    description:
      Reuse view to check for paths that can be published by reference.
    required: false
  ttl:
    description: TTL for each target's root, such as 14d.
    required: false
  permanent:
    description: Keep each target's root permanently.
    required: false
    default: 'false'
  audience:
    description: Audience of the GitHub OIDC token. Defaults to url.
    required: false
  read-user:
    description: User name of a read credential for a private destination cache.
    required: false
  read-password:
    description: Password of a read credential for a private destination cache.
    required: false
  fallback-read-user:
    description:
      User name of the tenant read credential, for reading a private reuse view.
    required: false
  fallback-read-password:
    description:
      Password of the tenant read credential, for reading a private reuse view.
    required: false
  max-jobs:
    description:
      Maximum number of build jobs in the build store. Leave empty to use that
      store's Nix configuration.
    required: false
  store:
    description:
      ssh-ng:// URI of a remote store to plan, build and publish with. Every
      output path must be known during planning, so floating content-addressed
      outputs must be built on the runner instead. Leave empty to use the
      runner's store.
    required: false
  push:
    description:
      When true, publish the cohort and set each target's root. On the runner,
      outputs are published as they are built. With a remote store, they are
      published from the store after the build. When false, the action only
      builds.
    required: false
  require-provenance:
    description:
      Require build provenance from this run for every target output. The action
      only skips a target's build when the cache already serves the target's
      outputs and has a build-provenance attestation for them. It builds every
      other target's final derivation, even when the output is already in the
      build store.
    required: false
    default: 'false'
  best-effort:
    description:
      Let the step succeed when a target's build fails. The action first
      publishes every path that it could build, sets the roots and writes the
      output files. A failure in planning, authentication, copying, publishing,
      setting roots or writing the receipt still fails the step.
    required: false
  gc-between-cohorts:
    description:
      Run garbage collection on the runner's Nix store between the cohorts that
      one `cupboard build-push` run builds. This frees the disk space that the
      published paths used, and a later cohort downloads them from the cache if
      it needs them. Off by default. When it is off, the action deletes no store
      paths.
    required: false
  run-root:
    description: Run root to add every published path to.
    required: false
  run-root-ttl:
    description: How long the run root lasts after it was last set, such as 2d.
    required: false
  run-root-permanent:
    description: Keep the run root permanently.
    required: false
    default: 'false'
  receipt-file:
    description:
      Where to write the cohort's build receipt. Defaults to a file under
      RUNNER_TEMP.
    required: false
  target-paths-file:
    description: Where to write the output paths of the cohort's targets.
    required: false
  intermediate-paths-file:
    description:
      Where to write the built outputs that are not a target's own output.
    required: false
  reference-paths-file:
    description:
      Where to write the paths that can be published by reference, without an
      upload.
    required: false
  left-upstream-file:
    description:
      Where to write the targets that are not published because an upstream
      cache serves them.
    required: false
  counts-file:
    description:
      Where to write the number of targets in each group and the result of the
      disk-space check, for the receipt.
    required: false
outputs:
  target-paths-file:
    description: File that lists the output paths of the cohort's targets.
    value: ${{ steps.build-cohort.outputs.target-paths-file }}
  intermediate-paths-file:
    description: File that lists the built outputs that are not target outputs.
    value: ${{ steps.build-cohort.outputs.intermediate-paths-file }}
  reference-paths-file:
    description: File that lists the paths that can be published by reference.
    value: ${{ steps.build-cohort.outputs.reference-paths-file }}
  left-upstream-file:
    description:
      File that lists the targets that are not published because an upstream
      cache serves them.
    value: ${{ steps.build-cohort.outputs.left-upstream-file }}
  counts-file:
    description:
      File that contains the number of targets in each group and the result of
      the disk-space check.
    value: ${{ steps.build-cohort.outputs.counts-file }}
  receipt-file:
    description:
      Build receipt for actions/attest. On the runner, the action writes it from
      the build that it ran. With a remote store, the receipt lists the paths
      published from the store, and records build provenance only for the
      outputs that Nix reports this build produced. Empty when push is false or
      the cohort has no paths to publish.
    value: ${{ steps.build-cohort.outputs.receipt-file }}
  out-link-directory:
    description:
      Directory of the build's out-links. They stop garbage collection from
      removing the targets' closures until the job has finished with them.
    value: ${{ steps.build-cohort.outputs.out-link-directory }}
runs:
  using: composite
  steps:
    - name: Resolve the pinned toolchain
      id: toolchain
      shell: bash
      run: |
        manifest="$GITHUB_ACTION_PATH/../../package.json"
        version="$(sed -n 's/.*"packageManager": *"pnpm@\([^+"]*\).*/\1/p' "$manifest")"
        node_version="$(tr -d '\r\n' < "$GITHUB_ACTION_PATH/../../.node-version")"
        test -n "$version" && test -n "$node_version"
        echo "pnpm-version=$version" >> "$GITHUB_OUTPUT"
        echo "node-version=$node_version" >> "$GITHUB_OUTPUT"

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ steps.toolchain.outputs.pnpm-version }}
        package_json_file: ${{ github.action_path }}/../../package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.toolchain.outputs.node-version }}

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: pnpm install --filter @cupboard/action... --prod --frozen-lockfile

    - name: Build cohort
      id: build-cohort
      shell: bash
      env:
        COHORT_JSON: ${{ inputs.cohort-json }}
        URL: ${{ inputs.url }}
        CUPBOARD_PATH: ${{ inputs.cupboard-path }}
        CACHE: ${{ inputs.cache }}
        REUSE_VIEW: ${{ inputs.reuse-view }}
        TTL: ${{ inputs.ttl }}
        PERMANENT: ${{ inputs.permanent }}
        AUDIENCE: ${{ inputs.audience }}
        READ_USER: ${{ inputs.read-user }}
        READ_PASSWORD: ${{ inputs.read-password }}
        FALLBACK_READ_USER: ${{ inputs.fallback-read-user }}
        FALLBACK_READ_PASSWORD: ${{ inputs.fallback-read-password }}
        MAX_JOBS: ${{ inputs.max-jobs }}
        STORE: ${{ inputs.store }}
        PUSH: ${{ inputs.push }}
        REQUIRE_PROVENANCE: ${{ inputs.require-provenance }}
        BEST_EFFORT: ${{ inputs.best-effort }}
        GC_BETWEEN_COHORTS: ${{ inputs.gc-between-cohorts }}
        RUN_ROOT: ${{ inputs.run-root }}
        RUN_ROOT_TTL: ${{ inputs.run-root-ttl }}
        RUN_ROOT_PERMANENT: ${{ inputs.run-root-permanent }}
        RECEIPT_FILE: ${{ inputs.receipt-file }}
        TARGET_PATHS_FILE: ${{ inputs.target-paths-file }}
        INTERMEDIATE_PATHS_FILE: ${{ inputs.intermediate-paths-file }}
        REFERENCE_PATHS_FILE: ${{ inputs.reference-paths-file }}
        LEFT_UPSTREAM_FILE: ${{ inputs.left-upstream-file }}
        COUNTS_FILE: ${{ inputs.counts-file }}
      run: |
        args=(build-cohort
          --cohort-json "$COHORT_JSON"
          --url "$URL"
          --cupboard-path "$CUPBOARD_PATH"
          --cache "$CACHE"
          --reuse-view "$REUSE_VIEW"
          --ttl "$TTL"
          --permanent "$PERMANENT"
          --audience "$AUDIENCE"
          --read-user "$READ_USER"
          --read-password "$READ_PASSWORD"
          --fallback-read-user "$FALLBACK_READ_USER"
          --fallback-read-password "$FALLBACK_READ_PASSWORD"
          --max-jobs "$MAX_JOBS"
          --store "$STORE"
          --push "$PUSH"
          --require-provenance "$REQUIRE_PROVENANCE"
          --best-effort "$BEST_EFFORT"
          --gc-between-cohorts "$GC_BETWEEN_COHORTS"
          --run-root "$RUN_ROOT"
          --run-root-ttl "$RUN_ROOT_TTL"
          --run-root-permanent "$RUN_ROOT_PERMANENT"
          --receipt-file "$RECEIPT_FILE"
          --target-paths-file "$TARGET_PATHS_FILE"
          --intermediate-paths-file "$INTERMEDIATE_PATHS_FILE"
          --reference-paths-file "$REFERENCE_PATHS_FILE"
          --left-upstream-file "$LEFT_UPSTREAM_FILE"
          --counts-file "$COUNTS_FILE")
        node --experimental-transform-types \
          --disable-warning=ExperimentalWarning \
          "$GITHUB_ACTION_PATH/../src/main.ts" "${args[@]}"
