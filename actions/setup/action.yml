name: Set up cupboard
description:
  Installs the cupboard CLI. If cache-url is set, it also adds cupboard caches
  to Nix's substituters for the rest of the job, and can create a named cache
  first.
inputs:
  cupboard:
    description:
      The cupboard output of actions/resolve-cupboard, which identifies a
      release to install or a commit to build cupboard from. Cannot be combined
      with cupboard-version, include-prereleases, release-repository or
      expected-source-commit.
    required: false
  cupboard-version:
    description:
      Release tag to install, such as v1.2.3, or latest. Defaults to latest.
    required: false
  include-prereleases:
    description:
      Whether latest can resolve to a prerelease. Defaults to true. When false,
      latest is GitHub's latest release.
    required: false
  github-token:
    description:
      GitHub token for requesting releases, release assets and attestations.
      Defaults to the job's token.
    required: false
  release-repository:
    description:
      Repository to install cupboard releases from. Defaults to the repository
      that contains this action.
    required: false
  expected-source-commit:
    description:
      Full commit ID that the release's provenance must record. Requires an
      exact cupboard-version.
    required: false
  install-dir:
    description:
      Directory to install cupboard into. Defaults to cupboard-bin under
      RUNNER_TEMP.
    required: false
  add-to-path:
    description: Add the directory that contains the cupboard binary to PATH.
    required: false
    default: 'true'
  cache-url:
    description: Tenant URL whose caches setup adds to Nix's substituters.
    required: false
  cache:
    description:
      Named caches to use, one per line or separated by commas. Leave empty to
      use the tenant's default cache.
    required: false
  include-default-cache:
    description:
      When true, use the tenant's default cache as well as the named caches in
      cache. The cache input cannot refer to the default cache, because a named
      cache can be called default.
    required: false
  cache-credentials:
    description: >-
      JSON array with one entry for each cache that has its own cache read
      credential, in the form {"cache": {"kind": "named", "name": ...},
      "credential": {"user": ..., "password": ...}}. Pass it from a secret. A
      cache without an entry is read with read-user and read-password.
    required: false
  private-substituters:
    description:
      URLs of other private caches to read from, one per line, with the user
      name and password in each URL. Pass this value from a secret. setup adds
      these URLs to Nix's substituters, and Nix still needs each cache's public
      key.
    required: false
  destination-read-user:
    description:
      User name of the cache read credential for the selected cache. When you
      select several caches, use cache-credentials instead.
    required: false
  destination-read-password:
    description: Password of the cache read credential for the selected cache.
    required: false
  provision-cache:
    description:
      Named cache to create with the job's OIDC token before Nix is configured.
      provision-cache-access and provision-cache-ttl set its access and default
      root TTL. If the cache already exists, setup keeps its settings, but fails
      if its access differs from provision-cache-access.
    required: false
  provision-cache-access:
    description:
      Access for the created cache, public or private. Required with
      provision-cache. A reuse view only includes caches with the same access as
      the view, so this must match the access of any view that should include
      the cache.
    required: false
  provision-cache-ttl:
    description:
      Default root TTL for the created cache, such as 14d. When a root expires,
      garbage collection can remove the paths that no other root keeps. Leave
      empty for roots that never expire.
    required: false
  trusted-public-key:
    description:
      Nix public key to trust for reads from the cache. If empty, setup
      downloads the cache's current keys from /pubkey, trusts them, and prints a
      warning.
    required: false
  read-user:
    description:
      User name of the tenant read credential. setup writes the credential to a
      netrc file, and Nix uses it for every cache on the tenant's host that does
      not have its own credential.
    required: false
  read-password:
    description: Password of the tenant read credential.
    required: false
  reuse-view:
    description:
      Reuse view to add as an extra substituter, after the selected caches.
      setup refuses a view unless its priority number is greater than the
      priority number of every selected cache, so Nix asks the caches first.
    required: false
  nix-config-file:
    description:
      An existing Nix configuration file, for Nix processes that do not inherit
      NIX_CONFIG. setup appends a line that includes its own settings file if
      that file exists.
    required: false
  checkout-dir:
    description:
      Git checkout of the cupboard commit to build when the cupboard input
      specifies a source commit. Defaults to the root of the checkout that
      contains this action.
    required: false
outputs:
  cupboard-path:
    description: Path to the installed cupboard executable.
    value: ${{ steps.setup.outputs.cupboard-path }}
  cupboard:
    description:
      JSON that identifies the installed release or source commit. Pass it as
      the cupboard input of another setup step to install the same cupboard.
    value: ${{ steps.setup.outputs.cupboard }}
  cupboard-version:
    description:
      Tag of the installed release. Empty when cupboard was built from source.
    value: ${{ steps.setup.outputs.cupboard-version }}
  nix-config-file:
    description:
      Path to the Nix configuration file that setup wrote under RUNNER_TEMP.
    value: ${{ steps.setup.outputs.nix-config-file }}
runs:
  using: composite
  steps:
    - name: Resolve the pinned toolchain
      id: toolchain
      shell: bash
      # The workspace manifest's packageManager field is the single pnpm pin;
      # the release integrity suffix, when present, is not part of the version.
      run: |
        manifest="$GITHUB_ACTION_PATH/../../package.json"
        node_version_file="$GITHUB_ACTION_PATH/../../.node-version"
        version="$(sed -n 's/.*"packageManager": *"pnpm@\([^+"]*\).*/\1/p' "$manifest")"
        if [ -z "$version" ]; then
          echo "::error::package.json declares no pnpm packageManager pin"
          exit 1
        fi
        if [ ! -r "$node_version_file" ]; then
          echo "::error::.node-version is not readable"
          exit 1
        fi
        node_version="$(tr -d '\r\n' < "$node_version_file")"
        if [ -z "$node_version" ]; then
          echo "::error::.node-version declares no Node version"
          exit 1
        fi
        echo "pnpm-version=$version" | tee -a "$GITHUB_OUTPUT"
        echo "node-version=$node_version" | tee -a "$GITHUB_OUTPUT"

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ steps.toolchain.outputs.pnpm-version }}
        # Read packageManager from this action's manifest. Reading the caller's
        # checkout could select a different pnpm version and conflict with
        # `version`. scripts/action-tool-parity.test.ts keeps this pin aligned
        # with the workspace manifest.
        package_json_file: ${{ github.action_path }}/../../package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.toolchain.outputs.node-version }}

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: pnpm install --filter @cupboard/action... --prod --frozen-lockfile

    - name: Acquire cupboard
      id: setup
      shell: bash
      env:
        CUPBOARD: ${{ inputs.cupboard }}
        CUPBOARD_VERSION: ${{ inputs.cupboard-version }}
        INCLUDE_PRERELEASES: ${{ inputs.include-prereleases }}
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        RELEASE_REPOSITORY: ${{ inputs.release-repository }}
        EXPECTED_SOURCE_COMMIT: ${{ inputs.expected-source-commit }}
        INSTALL_DIR: ${{ inputs.install-dir }}
        ADD_TO_PATH: ${{ inputs.add-to-path }}
        CACHE_URL: ${{ inputs.cache-url }}
        CACHE: ${{ inputs.cache }}
        INCLUDE_DEFAULT_CACHE: ${{ inputs.include-default-cache }}
        CACHE_CREDENTIALS: ${{ inputs.cache-credentials }}
        PRIVATE_SUBSTITUTERS: ${{ inputs.private-substituters }}
        DESTINATION_READ_USER: ${{ inputs.destination-read-user }}
        DESTINATION_READ_PASSWORD: ${{ inputs.destination-read-password }}
        PROVISION_CACHE: ${{ inputs.provision-cache }}
        PROVISION_CACHE_ACCESS: ${{ inputs.provision-cache-access }}
        PROVISION_CACHE_TTL: ${{ inputs.provision-cache-ttl }}
        REUSE_VIEW: ${{ inputs.reuse-view }}
        TRUSTED_PUBLIC_KEY: ${{ inputs.trusted-public-key }}
        READ_USER: ${{ inputs.read-user }}
        READ_PASSWORD: ${{ inputs.read-password }}
        NIX_CONFIG_FILE: ${{ inputs.nix-config-file }}
        CHECKOUT_DIR:
          ${{ inputs.checkout-dir != '' && inputs.checkout-dir ||
          format('{0}/../..', github.action_path) }}
      run: |
        args=(setup
          --cupboard "$CUPBOARD"
          --cupboard-version "$CUPBOARD_VERSION"
          --include-prereleases "$INCLUDE_PRERELEASES"
          --release-repository "$RELEASE_REPOSITORY"
          --expected-source-commit "$EXPECTED_SOURCE_COMMIT"
          --install-dir "$INSTALL_DIR"
          --add-to-path "$ADD_TO_PATH"
          --cache-url "$CACHE_URL"
          --cache "$CACHE"
          --include-default-cache "$INCLUDE_DEFAULT_CACHE"
          --provision-cache "$PROVISION_CACHE"
          --provision-cache-access "$PROVISION_CACHE_ACCESS"
          --provision-cache-ttl "$PROVISION_CACHE_TTL"
          --reuse-view "$REUSE_VIEW"
          --trusted-public-key "$TRUSTED_PUBLIC_KEY"
          --nix-config-file "$NIX_CONFIG_FILE"
          --checkout-dir "$CHECKOUT_DIR")
        node --experimental-transform-types \
          --disable-warning=ExperimentalWarning \
          "$GITHUB_ACTION_PATH/../src/main.ts" "${args[@]}"
