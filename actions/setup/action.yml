name: Set up cupboard
description:
  Install cupboard and optionally export Nix binary cache configuration.
inputs:
  cupboard-version:
    description:
      cupboard version to install. Use latest or an exact version such as 1.2.3
      or v1.2.3.
    required: false
    default: latest
  github-token:
    description: GitHub token used for release API calls.
    required: false
  release-repository:
    description: Repository that publishes cupboard release assets.
    required: false
  install-dir:
    description: Directory for the downloaded cupboard binary.
    required: false
  add-to-path:
    description: Add install-dir to PATH.
    required: false
    default: 'true'
  cache-url:
    description: cupboard Worker URL to add to Nix substituters.
    required: false
  cache:
    description: Named cache to read from.
    required: false
  trusted-public-key:
    description: Nix trusted public key for the cupboard cache.
    required: false
  read-user:
    description: Username for private cache reads.
    required: false
  read-password:
    description: Password for private cache reads.
    required: false
  nix-config-file:
    description: Optional Nix config file to append to.
    required: false
outputs:
  cupboard-path:
    description: Path to the installed cupboard binary.
    value: ${{ steps.setup.outputs.cupboard-path }}
  cupboard-version:
    description: Resolved cupboard release tag.
    value: ${{ steps.setup.outputs.cupboard-version }}
  nix-config-file:
    description: Path to the generated runner-local Nix config file.
    value: ${{ steps.setup.outputs.nix-config-file }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24.17.0

    - name: Install cupboard
      id: setup
      shell: bash
      env:
        INPUT_CUPBOARD_VERSION: ${{ inputs.cupboard-version }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        INPUT_RELEASE_REPOSITORY:
          ${{ inputs.release-repository || github.action_repository }}
        INPUT_INSTALL_DIR: ${{ inputs.install-dir }}
        INPUT_ADD_TO_PATH: ${{ inputs.add-to-path }}
        INPUT_CACHE_URL: ${{ inputs.cache-url }}
        INPUT_CACHE: ${{ inputs.cache }}
        INPUT_TRUSTED_PUBLIC_KEY: ${{ inputs.trusted-public-key }}
        INPUT_READ_USER: ${{ inputs.read-user }}
        INPUT_READ_PASSWORD: ${{ inputs.read-password }}
        INPUT_NIX_CONFIG_FILE: ${{ inputs.nix-config-file }}
      run: >
        node --experimental-strip-types --disable-warning=ExperimentalWarning
        "$GITHUB_ACTION_PATH/../lib/cupboard-action.ts" setup
