name: Set up cupboard
description:
  Acquire cupboard and optionally export Nix binary cache configuration.
inputs:
  cupboard:
    description:
      Canonical release or source acquisition JSON from resolve-cupboard.
    required: false
  cupboard-version:
    description:
      Release tag to install. Use latest to resolve a published release.
    required: false
  include-prereleases:
    description:
      When true, a prerelease is eligible when the action resolves latest, so
      the action installs the newest release of any kind.
    required: false
  github-token:
    description: GitHub token for release, asset and attestation requests.
    required: false
  release-repository:
    description: Repository that publishes cupboard releases and provenance.
    required: false
  expected-source-commit:
    description:
      Full commit id that the release provenance must identify. Requires an
      exact cupboard-version.
    required: false
  install-dir:
    description: Directory for acquired cupboard files.
    required: false
  add-to-path:
    description:
      Add the directory containing the acquired cupboard binary to PATH.
    required: false
    default: 'true'
  cache-url:
    description: cupboard tenant URL to add to Nix substituters.
    required: false
  cache:
    description:
      Named caches to use at the tenant URL, one per line or comma-separated.
      Leave empty to use the tenant's default cache.
    required: false
  provision-managed-cache:
    description:
      Policy-managed publication cache to prepare with GitHub OIDC before setup
      probes it. Leave empty for durable caches and read-only setup.
    required: false
  cache-credentials:
    description:
      JSON array of cache scopes and cache-specific read credentials. Populate
      it from workflow secrets. A cache without an entry uses read-user and
      read-password.
    required: false
  destination-read-user:
    description:
      Basic-auth username accepted by the single selected destination cache. Use
      cache-credentials when setup selects more than one cache.
    required: false
  destination-read-password:
    description:
      Basic-auth password accepted by the single selected destination cache.
    required: false
  trusted-public-key:
    description: Nix signing key to trust for cache reads.
    required: false
  read-user:
    description: Tenant-level Basic-auth username for cache reads.
    required: false
  read-password:
    description: Tenant-level Basic-auth password for cache reads.
    required: false
  reuse-view:
    description:
      Named tenant reuse view to add as a second substituter, after the
      destination cache. Refused unless the view's nix-cache-info priority is
      numerically greater than the destination's.
    required: false
  nix-config-file:
    description:
      Existing Nix config file. Setup appends an optional include of the
      protected runner-local config file.
    required: false
outputs:
  cupboard-path:
    description: Path to the acquired cupboard executable.
    value: ${{ steps.setup.outputs.cupboard-path }}
  cupboard:
    description:
      Pass this JSON to another setup invocation to acquire the same release or
      source commit.
    value: ${{ steps.setup.outputs.cupboard }}
  cupboard-version:
    description:
      Resolved cupboard release tag. This output is empty for a source
      acquisition.
    value: ${{ steps.setup.outputs.cupboard-version }}
  nix-config-file:
    description: Path to the generated runner-local Nix config file.
    value: ${{ steps.setup.outputs.nix-config-file }}
runs:
  using: composite
  steps:
    - name: Resolve the pinned toolchain
      id: toolchain
      shell: bash
      # The workspace manifest's packageManager field is the single pnpm pin;
      # the release integrity suffix, when present, is not part of the version.
      run: |
        manifest="$GITHUB_ACTION_PATH/../../package.json"
        node_version_file="$GITHUB_ACTION_PATH/../../.node-version"
        version="$(sed -n 's/.*"packageManager": *"pnpm@\([^+"]*\).*/\1/p' "$manifest")"
        if [ -z "$version" ]; then
          echo "::error::package.json declares no pnpm packageManager pin"
          exit 1
        fi
        if [ ! -r "$node_version_file" ]; then
          echo "::error::.node-version is not readable"
          exit 1
        fi
        node_version="$(tr -d '\r\n' < "$node_version_file")"
        if [ -z "$node_version" ]; then
          echo "::error::.node-version declares no Node version"
          exit 1
        fi
        echo "pnpm-version=$version" | tee -a "$GITHUB_OUTPUT"
        echo "node-version=$node_version" | tee -a "$GITHUB_OUTPUT"

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: ${{ steps.toolchain.outputs.pnpm-version }}
        # Read packageManager from this action's manifest. Reading the caller's
        # checkout could select a different pnpm version and conflict with
        # `version`. scripts/action-tool-parity.test.ts keeps this pin aligned
        # with the workspace manifest.
        package_json_file: ${{ github.action_path }}/../../package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.toolchain.outputs.node-version }}

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: pnpm install --filter @cupboard/action... --prod --frozen-lockfile

    - name: Acquire cupboard
      id: setup
      shell: bash
      env:
        CUPBOARD: ${{ inputs.cupboard }}
        CUPBOARD_VERSION: ${{ inputs.cupboard-version }}
        INCLUDE_PRERELEASES: ${{ inputs.include-prereleases }}
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        RELEASE_REPOSITORY: ${{ inputs.release-repository }}
        EXPECTED_SOURCE_COMMIT: ${{ inputs.expected-source-commit }}
        INSTALL_DIR: ${{ inputs.install-dir }}
        ADD_TO_PATH: ${{ inputs.add-to-path }}
        CACHE_URL: ${{ inputs.cache-url }}
        CACHE: ${{ inputs.cache }}
        PROVISION_MANAGED_CACHE: ${{ inputs.provision-managed-cache }}
        CACHE_CREDENTIALS: ${{ inputs.cache-credentials }}
        DESTINATION_READ_USER: ${{ inputs.destination-read-user }}
        DESTINATION_READ_PASSWORD: ${{ inputs.destination-read-password }}
        REUSE_VIEW: ${{ inputs.reuse-view }}
        TRUSTED_PUBLIC_KEY: ${{ inputs.trusted-public-key }}
        READ_USER: ${{ inputs.read-user }}
        READ_PASSWORD: ${{ inputs.read-password }}
        NIX_CONFIG_FILE: ${{ inputs.nix-config-file }}
        CHECKOUT_DIR: ${{ github.action_path }}/../..
      run: |
        args=(setup
          --cupboard "$CUPBOARD"
          --cupboard-version "$CUPBOARD_VERSION"
          --include-prereleases "$INCLUDE_PRERELEASES"
          --github-token "$GH_TOKEN"
          --release-repository "$RELEASE_REPOSITORY"
          --expected-source-commit "$EXPECTED_SOURCE_COMMIT"
          --install-dir "$INSTALL_DIR"
          --add-to-path "$ADD_TO_PATH"
          --cache-url "$CACHE_URL"
          --cache "$CACHE"
          --provision-managed-cache "$PROVISION_MANAGED_CACHE"
          --cache-credentials "$CACHE_CREDENTIALS"
          --destination-read-user "$DESTINATION_READ_USER"
          --destination-read-password "$DESTINATION_READ_PASSWORD"
          --reuse-view "$REUSE_VIEW"
          --trusted-public-key "$TRUSTED_PUBLIC_KEY"
          --read-user "$READ_USER"
          --read-password "$READ_PASSWORD"
          --nix-config-file "$NIX_CONFIG_FILE"
          --checkout-dir "$CHECKOUT_DIR")
        node --experimental-transform-types \
          --disable-warning=ExperimentalWarning \
          "$GITHUB_ACTION_PATH/../src/main.ts" "${args[@]}"
