name: Set up cupboard
description:
  Install cupboard and optionally export Nix binary cache configuration.
inputs:
  cupboard-version:
    description:
      cupboard version to install. Use latest or an exact version such as 1.2.3
      or v1.2.3.
    required: false
    default: latest
  include-prereleases:
    description:
      When resolving latest, consider prereleases and install the newest release
      of any kind.
    required: false
    default: 'true'
  github-token:
    description: GitHub token used for release API calls.
    required: false
  release-repository:
    description: Repository that publishes cupboard release assets.
    required: false
  install-dir:
    description: Directory for the downloaded cupboard binary.
    required: false
  add-to-path:
    description: Add install-dir to PATH.
    required: false
    default: 'true'
  cache-url:
    description: cupboard Worker URL to add to Nix substituters.
    required: false
  cache:
    description: Named cache to read from.
    required: false
  trusted-public-key:
    description: Nix trusted public key for the cupboard cache.
    required: false
  read-user:
    description: Username for private cache reads.
    required: false
  read-password:
    description: Password for private cache reads.
    required: false
  nix-config-file:
    description: Optional Nix config file to append to.
    required: false
outputs:
  cupboard-path:
    description: Path to the installed cupboard binary.
    value: ${{ steps.setup.outputs.cupboard-path }}
  cupboard-version:
    description: Resolved cupboard release tag.
    value: ${{ steps.setup.outputs.cupboard-version }}
  nix-config-file:
    description: Path to the generated runner-local Nix config file.
    value: ${{ steps.setup.outputs.nix-config-file }}
runs:
  using: composite
  steps:
    - name: Resolve the pinned pnpm version
      id: pnpm
      shell: bash
      env:
        # renovate: datasource=npm depName=pnpm
        PNPM_VERSION: '11.8.0'
      run: echo "version=${PNPM_VERSION}" | tee -a "${GITHUB_OUTPUT}"

    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: ${{ steps.pnpm.outputs.version }}
        # pnpm/action-setup cross-checks a package.json and fails the run on a
        # version mismatch. Point it at this action's own manifest, not the
        # caller's checkout, whose pinned pnpm would otherwise break us.
        package_json_file: ${{ github.action_path }}/../../package.json

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24.18.0

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: pnpm install --filter @cupboard/action... --prod --frozen-lockfile

    - name: Install cupboard
      id: setup
      shell: bash
      env:
        INPUT_CUPBOARD_VERSION: ${{ inputs.cupboard-version }}
        INPUT_INCLUDE_PRERELEASES: ${{ inputs.include-prereleases }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        INPUT_RELEASE_REPOSITORY:
          ${{ inputs.release-repository || github.action_repository }}
        INPUT_INSTALL_DIR: ${{ inputs.install-dir }}
        INPUT_ADD_TO_PATH: ${{ inputs.add-to-path }}
        INPUT_CACHE_URL: ${{ inputs.cache-url }}
        INPUT_CACHE: ${{ inputs.cache }}
        INPUT_TRUSTED_PUBLIC_KEY: ${{ inputs.trusted-public-key }}
        INPUT_READ_USER: ${{ inputs.read-user }}
        INPUT_READ_PASSWORD: ${{ inputs.read-password }}
        INPUT_NIX_CONFIG_FILE: ${{ inputs.nix-config-file }}
      run: >
        node --experimental-transform-types
        --disable-warning=ExperimentalWarning
        "$GITHUB_ACTION_PATH/../src/main.ts" setup
