name: Attach cupboard attestation bundles
description:
  Attaches signed Sigstore bundles to the selected paths in a publication
  receipt. actions/attest signs the bundles after publication and writes the
  checksums of the paths covered by those bundles.
inputs:
  url:
    description: Tenant URL of the destination.
    required: true
  cupboard-path:
    description: Path to the cupboard executable that actions/setup installed.
    required: true
  read-session-target:
    description:
      Pass the read-session-target output from actions/setup for private OIDC
      reads.
    required: false
  read-session-caches:
    description:
      Pass the read-session-caches output from actions/setup, a JSON array of
      additional cache URLs.
    required: false
  read-session-view:
    description: Pass the read-session-view output from actions/setup.
    required: false
  cache:
    description:
      Named cache that the paths were published to. Leave empty for the default
      cache.
    required: false
  audience:
    description:
      Audience of the GitHub OIDC token. Defaults to url without a trailing
      slash.
    required: false
  read-user:
    description: User name of a read credential for a private destination cache.
    required: false
  read-password:
    description: Password of a read credential for a private destination cache.
    required: false
  receipt-file:
    description: Receipt for the paths published earlier in the job.
    required: true
  checksums-file:
    description:
      Checksums file from actions/attest. Each listed path must be eligible for
      signing and have the NAR hash recorded in the receipt. The file may omit
      paths that were not built in this run.
    required: true
  bundle:
    description:
      Bundle files from actions/attest, one per line. Empty lines are ignored.
    required: false
  bundles-file:
    description: File containing bundle paths, one per line.
    required: false
runs:
  using: composite
  steps:
    - name: Resolve the pinned toolchain
      id: toolchain
      shell: bash
      # The workspace manifest's packageManager field is the single pnpm pin;
      # the release integrity suffix, when present, is not part of the version.
      run: bash "$GITHUB_ACTION_PATH/../bootstrap.sh" toolchain

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ steps.toolchain.outputs.pnpm-version }}
        # Point pnpm/action-setup's manifest lookup at this action's own
        # manifest, not the caller's checkout, whose pinned pnpm would
        # otherwise conflict with `version`. Parity between this pin and the
        # workspace manifest is enforced by scripts/action-tool-parity.test.ts.
        package_json_file: ${{ github.action_path }}/../../package.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.toolchain.outputs.node-version }}

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: bash "$GITHUB_ACTION_PATH/../bootstrap.sh" install

    - name: Attach attestation bundles
      shell: bash
      env:
        URL: ${{ inputs.url }}
        CUPBOARD_PATH: ${{ inputs.cupboard-path }}
        READ_SESSION_TARGET: ${{ inputs.read-session-target }}
        READ_SESSION_AUDIENCE: ${{ inputs.audience }}
        READ_SESSION_CACHES: ${{ inputs.read-session-caches }}
        READ_SESSION_VIEW: ${{ inputs.read-session-view }}
        CACHE: ${{ inputs.cache }}
        AUDIENCE: ${{ inputs.audience }}
        READ_USER: ${{ inputs.read-user }}
        READ_PASSWORD: ${{ inputs.read-password }}
        RECEIPT_FILE: ${{ inputs.receipt-file }}
        CHECKSUMS_FILE: ${{ inputs.checksums-file }}
        BUNDLE: ${{ inputs.bundle }}
        BUNDLES_FILE: ${{ inputs.bundles-file }}
      run: |
        args=(attest-attach
          --url "$URL"
          --cupboard-path "$CUPBOARD_PATH"
          --cache "$CACHE"
          --audience "$AUDIENCE"
          --read-user "$READ_USER"
          --read-password "$READ_PASSWORD"
          --receipt-file "$RECEIPT_FILE"
          --checksums-file "$CHECKSUMS_FILE"
          --bundle "$BUNDLE"
          --bundles-file "$BUNDLES_FILE")
        source "$GITHUB_ACTION_PATH/../read-session.sh"
        run_with_read_session \
          "$CUPBOARD_PATH" "$READ_SESSION_TARGET" "$READ_SESSION_VIEW" -- \
          node --experimental-transform-types \
            --disable-warning=ExperimentalWarning \
            "$GITHUB_ACTION_PATH/../src/main.ts" "${args[@]}"
