name: Attach cupboard attestation bundles
description:
  Attach signed Sigstore bundles to published subjects in a build receipt.
  actions/attest produces bundles after publication, so this action attaches
  them only to paths that the destination already serves.
inputs:
  url:
    description: cupboard Worker URL.
    required: true
  cupboard-path:
    description: Path to the cupboard binary installed by actions/setup.
    required: true
  cache:
    description: Named public cache that received the paths.
    required: false
  private-cache:
    description:
      Private cache that received the paths. Set either cache or private-cache,
      not both.
    required: false
  audience:
    description: GitHub OIDC audience. Defaults to url.
    required: false
  read-user:
    description: Basic-auth username for a private destination cache.
    required: false
  read-password:
    description: Basic-auth password for a private destination cache.
    required: false
  receipt-file:
    description: Current-run receipt produced by the build action.
    required: true
  checksums-file:
    description:
      Checksums for the signed receipt subjects, produced by actions/attest.
      Only matching receipt subjects are attached.
    required: true
  bundle:
    description:
      Signed Sigstore bundles from the attest action, one path per line. Empty
      lines are ignored.
    required: true
runs:
  using: composite
  steps:
    - name: Resolve the pinned toolchain
      id: toolchain
      shell: bash
      # The workspace manifest's packageManager field is the single pnpm pin;
      # the release integrity suffix, when present, is not part of the version.
      run: |
        manifest="$GITHUB_ACTION_PATH/../../package.json"
        node_version_file="$GITHUB_ACTION_PATH/../../.node-version"
        version="$(sed -n 's/.*"packageManager": *"pnpm@\([^+"]*\).*/\1/p' "$manifest")"
        if [ -z "$version" ]; then
          echo "::error::package.json declares no pnpm packageManager pin"
          exit 1
        fi
        if [ ! -r "$node_version_file" ]; then
          echo "::error::.node-version is not readable"
          exit 1
        fi
        node_version="$(tr -d '\r\n' < "$node_version_file")"
        if [ -z "$node_version" ]; then
          echo "::error::.node-version declares no Node version"
          exit 1
        fi
        echo "pnpm-version=$version" | tee -a "$GITHUB_OUTPUT"
        echo "node-version=$node_version" | tee -a "$GITHUB_OUTPUT"

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ steps.toolchain.outputs.pnpm-version }}
        # Point pnpm/action-setup's manifest lookup at this action's own
        # manifest, not the caller's checkout, whose pinned pnpm would
        # otherwise conflict with `version`. Parity between this pin and the
        # workspace manifest is enforced by scripts/action-tool-parity.test.ts.
        package_json_file: ${{ github.action_path }}/../../package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.toolchain.outputs.node-version }}

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: pnpm install --filter @cupboard/action... --prod --frozen-lockfile

    - name: Attach attestation bundles
      shell: bash
      env:
        URL: ${{ inputs.url }}
        CUPBOARD_PATH: ${{ inputs.cupboard-path }}
        CACHE: ${{ inputs.cache }}
        PRIVATE_CACHE: ${{ inputs.private-cache }}
        AUDIENCE: ${{ inputs.audience }}
        READ_USER: ${{ inputs.read-user }}
        READ_PASSWORD: ${{ inputs.read-password }}
        RECEIPT_FILE: ${{ inputs.receipt-file }}
        CHECKSUMS_FILE: ${{ inputs.checksums-file }}
        BUNDLE: ${{ inputs.bundle }}
      run: |
        args=(attest-attach
          --url "$URL"
          --cupboard-path "$CUPBOARD_PATH"
          --cache "$CACHE"
          --private-cache "$PRIVATE_CACHE"
          --audience "$AUDIENCE"
          --read-user "$READ_USER"
          --read-password "$READ_PASSWORD"
          --receipt-file "$RECEIPT_FILE"
          --checksums-file "$CHECKSUMS_FILE"
          --bundle "$BUNDLE")
        node --experimental-transform-types \
          --disable-warning=ExperimentalWarning \
          "$GITHUB_ACTION_PATH/../src/main.ts" "${args[@]}"
