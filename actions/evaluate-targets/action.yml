name: Evaluate cupboard target manifest
description: Evaluates the target manifest with bounded Nix process concurrency.
inputs:
  concurrency:
    description:
      Maximum simultaneous Nix evaluations. auto uses the number of available
      processors. Lower this value if evaluation exhausts memory.
    required: false
    default: '4'
  targets:
    description: Nix attribute that produces the target manifest.
    required: true
  publish:
    description: Publication scope used when evaluating derivation fields.
    required: false
    default: outputs
  cupboard-path:
    description: Path to cupboard, required for private OIDC reads.
    required: false
  read-session-target:
    description: Pass the read-session-target output from actions/setup.
    required: false
  audience:
    description: Pass the read-session-audience output from actions/setup.
    required: false
  read-session-caches:
    description: Pass the JSON read-session-caches output from actions/setup.
    required: false
  read-session-view:
    description: Pass the read-session-view output from actions/setup.
    required: false
outputs:
  manifest:
    description: Complete target manifest in its original order.
runs:
  using: node24
  main: dist/main.cjs
