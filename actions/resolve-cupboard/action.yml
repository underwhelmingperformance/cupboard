name: Resolve cupboard
description:
  Finds the cupboard release that was published from the commit of the calling
  reusable workflow. If there is no such release, it selects that commit to
  build cupboard from.
inputs:
  cupboard-version:
    description:
      latest or an exact release tag. When set, the action selects this release
      instead of looking up the release for workflow-sha.
    required: false
  workflow-repository:
    description: Repository that contains the called reusable workflow.
    required: true
  workflow-ref:
    description: The called workflow's full job.workflow_ref value.
    required: true
  workflow-sha:
    description: The called workflow's full job.workflow_sha value.
    required: true
  github-token:
    description: GitHub token for release API requests.
    required: false
  github-api-url:
    description: Base URL of the GitHub REST API.
    required: false
  github-graphql-url:
    description: URL of the GitHub GraphQL API.
    required: false
outputs:
  cupboard:
    description:
      JSON that identifies the release to install or the commit to build
      cupboard from. The action checks it against its schema before writing it.
      Pass it as the cupboard input of actions/setup.
    value: ${{ steps.resolve.outputs.cupboard }}
runs:
  using: composite
  steps:
    - name: Resolve the pinned toolchain
      id: toolchain
      shell: bash
      run: |
        manifest="$GITHUB_ACTION_PATH/../../package.json"
        node_version_file="$GITHUB_ACTION_PATH/../../.node-version"
        version="$(sed -n 's/.*"packageManager": *"pnpm@\([^+"]*\).*/\1/p' "$manifest")"
        if [ -z "$version" ]; then
          echo "::error::package.json declares no pnpm packageManager pin"
          exit 1
        fi
        if [ ! -r "$node_version_file" ]; then
          echo "::error::.node-version is not readable"
          exit 1
        fi
        node_version="$(tr -d '\r\n' < "$node_version_file")"
        if [ -z "$node_version" ]; then
          echo "::error::.node-version declares no Node version"
          exit 1
        fi
        echo "pnpm-version=$version" | tee -a "$GITHUB_OUTPUT"
        echo "node-version=$node_version" | tee -a "$GITHUB_OUTPUT"

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ steps.toolchain.outputs.pnpm-version }}
        package_json_file: ${{ github.action_path }}/../../package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.toolchain.outputs.node-version }}

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: pnpm install --filter @cupboard/action... --prod --frozen-lockfile

    - name: Resolve cupboard
      id: resolve
      shell: bash
      env:
        CUPBOARD_VERSION: ${{ inputs.cupboard-version }}
        WORKFLOW_REPOSITORY: ${{ inputs.workflow-repository }}
        WORKFLOW_REF: ${{ inputs.workflow-ref }}
        WORKFLOW_SHA: ${{ inputs.workflow-sha }}
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        GITHUB_API_URL_INPUT: ${{ inputs.github-api-url || github.api_url }}
        GITHUB_GRAPHQL_URL_INPUT:
          ${{ inputs.github-graphql-url || github.graphql_url }}
      run: |
        args=(resolve-cupboard
          --cupboard-version "$CUPBOARD_VERSION"
          --workflow-repository "$WORKFLOW_REPOSITORY"
          --workflow-ref "$WORKFLOW_REF"
          --workflow-sha "$WORKFLOW_SHA"
          --github-token "$GH_TOKEN"
          --github-api-url "$GITHUB_API_URL_INPUT"
          --github-graphql-url "$GITHUB_GRAPHQL_URL_INPUT")
        node --experimental-transform-types \
          --disable-warning=ExperimentalWarning \
          "$GITHUB_ACTION_PATH/../src/main.ts" "${args[@]}"
