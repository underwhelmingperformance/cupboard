name: Push to cupboard
description: Push Nix store paths to a cupboard cache from GitHub Actions.
inputs:
  url:
    description: cupboard Worker URL.
    required: true
  paths:
    description:
      Newline-delimited local Nix store paths, derivations, or installables to
      push.
    required: true
  cupboard-version:
    description:
      cupboard version to install. Use latest or an exact version such as 1.2.3
      or v1.2.3.
    required: false
    default: latest
  include-prereleases:
    description:
      When resolving latest, consider prereleases and install the newest release
      of any kind.
    required: false
    default: 'true'
  github-token:
    description: GitHub token used for release API calls.
    required: false
  release-repository:
    description: Repository that publishes cupboard release assets.
    required: false
  install-dir:
    description: Directory for the downloaded cupboard binary.
    required: false
  cache:
    description: Named cache to push to.
    required: false
  audience:
    description: GitHub OIDC audience. Defaults to url.
    required: false
  root:
    description: Retention root for pushed paths.
    required: false
  ttl:
    description: Retention TTL such as 7d or 12h.
    required: false
  wait:
    description: Wait for deferred blobs to become servable.
    required: false
    default: 'true'
  wait-timeout:
    description: Wait timeout for deferred blobs.
    required: false
    default: 10m
  attestations:
    description: Newline-delimited local Sigstore DSSE bundle paths to attach.
    required: false
outputs:
  cupboard-path:
    description: Path to the installed cupboard binary.
    value: ${{ steps.push.outputs.cupboard-path }}
  cupboard-version:
    description: Resolved cupboard release tag.
    value: ${{ steps.push.outputs.cupboard-version }}
  uploaded-paths:
    description: Number of store paths uploaded to the cache.
    value: ${{ steps.push.outputs.uploaded-paths }}
  reused-blobs:
    description: Number of paths already present in the cache and reused.
    value: ${{ steps.push.outputs.reused-blobs }}
  skipped-paths:
    description: Number of paths skipped because nothing needed uploading.
    value: ${{ steps.push.outputs.skipped-paths }}
  uploaded-bytes:
    description: Total number of bytes uploaded to the cache.
    value: ${{ steps.push.outputs.uploaded-bytes }}
runs:
  using: composite
  steps:
    - name: Resolve the pinned pnpm version
      id: pnpm
      shell: bash
      env:
        # renovate: datasource=npm depName=pnpm
        PNPM_VERSION: '11.13.1'
      run: echo "version=${PNPM_VERSION}" | tee -a "${GITHUB_OUTPUT}"

    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: ${{ steps.pnpm.outputs.version }}
        # pnpm/action-setup cross-checks a package.json and fails the run on a
        # version mismatch. Point it at this action's own manifest, not the
        # caller's checkout, whose pinned pnpm would otherwise break us.
        package_json_file: ${{ github.action_path }}/../../package.json

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24.18.0

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: pnpm install --filter @cupboard/action... --prod --frozen-lockfile

    - name: Push store paths
      id: push
      shell: bash
      env:
        URL: ${{ inputs.url }}
        PATHS: ${{ inputs.paths }}
        CUPBOARD_VERSION: ${{ inputs.cupboard-version }}
        INCLUDE_PRERELEASES: ${{ inputs.include-prereleases }}
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        RELEASE_REPOSITORY:
          ${{ inputs.release-repository || github.action_repository }}
        INSTALL_DIR: ${{ inputs.install-dir }}
        CACHE: ${{ inputs.cache }}
        AUDIENCE: ${{ inputs.audience }}
        ROOT: ${{ inputs.root }}
        TTL: ${{ inputs.ttl }}
        WAIT: ${{ inputs.wait }}
        WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
        ATTESTATIONS: ${{ inputs.attestations }}
      run: |
        args=(push
          --url "$URL"
          --paths "$PATHS"
          --cupboard-version "$CUPBOARD_VERSION"
          --include-prereleases "$INCLUDE_PRERELEASES"
          --github-token "$GH_TOKEN"
          --release-repository "$RELEASE_REPOSITORY"
          --install-dir "$INSTALL_DIR"
          --cache "$CACHE"
          --audience "$AUDIENCE"
          --root "$ROOT"
          --ttl "$TTL"
          --wait "$WAIT"
          --wait-timeout "$WAIT_TIMEOUT"
          --attestations "$ATTESTATIONS")
        node --experimental-transform-types \
          --disable-warning=ExperimentalWarning \
          "$GITHUB_ACTION_PATH/../src/main.ts" "${args[@]}"
