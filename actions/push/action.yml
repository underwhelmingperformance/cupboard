name: Push to cupboard
description:
  Publishes Nix store paths to a cupboard cache and sets a retention root for
  them.
inputs:
  url:
    description: Tenant URL or cache URL to publish to.
    required: true
  paths:
    description:
      Store paths to publish, one per line. A path that resolves to a store
      path, such as a `result` symlink, also works. Build flake outputs before
      you publish them. Required unless paths-file, root-groups or an explicit
      root is set. An explicit root with no paths replaces that root with an
      empty path list.
    required: false
  paths-file:
    description:
      File containing store paths to publish, one per line. Use this input for
      large path lists. The installed Cupboard CLI must support push
      --paths-file. An empty file with an explicit root replaces that root with
      an empty path list.
    required: false
  cupboard-path:
    description:
      Path to a cupboard executable that an earlier actions/setup step
      installed. When it is set, the action does not install a release.
    required: false
  read-session-target:
    description:
      Pass the read-session-target output from actions/setup for private OIDC
      reads.
    required: false
  read-session-caches:
    description:
      Pass the read-session-caches output from actions/setup, a JSON array of
      additional cache URLs.
    required: false
  read-session-view:
    description: Pass the read-session-view output from actions/setup.
    required: false
  cupboard-version:
    description:
      cupboard release to install, either latest or an exact release tag.
      Defaults to latest.
    required: false
  include-prereleases:
    description: Whether latest can resolve to a prerelease. Defaults to true.
    required: false
  github-token:
    description:
      GitHub token for release API requests. Defaults to the job's token.
    required: false
  release-repository:
    description:
      Repository to install cupboard releases from. Defaults to the repository
      that contains this action.
    required: false
  expected-source-commit:
    description:
      Full commit ID that the installed release must have been built from.
      Requires an exact cupboard-version.
    required: false
  install-dir:
    description:
      Directory to download the cupboard binary into. Defaults to cupboard-bin
      under RUNNER_TEMP.
    required: false
  cache:
    description: Named cache to publish to. Leave empty for the default cache.
    required: false
  store:
    description:
      ssh-ng:// URI of a remote store to read the paths from. Leave empty to
      read from the store that Nix uses on this runner.
    required: false
  closure:
    description:
      Publish the complete realised closure of the paths, including referenced
      dependencies, when true. This does not rebuild those dependencies.
    required: false
    default: 'false'
  build-receipt-file:
    description:
      Receipt from actions/build-paths. When set, the action writes a receipt
      for every path that the cache serves after this push, including closure
      references, and retains matching current-run build claims.
    required: false
  audience:
    description:
      Audience of the GitHub OIDC token. Defaults to the tenant URL without a
      trailing slash, also when url is a cache URL.
    required: false
  root:
    description:
      Retention root to set for the published paths. Defaults to
      github:<repository>/<ref name>.
    required: false
  ttl:
    description:
      How long the root lasts after it was last set, such as 7d or 12h.
    required: false
  permanent:
    description:
      Keep the root permanently. Cannot be combined with ttl or no-retain. Older
      cupboard releases do not have this option. With one of those releases, the
      root uses the cache's retention settings and the action prints a warning.
    required: false
    default: 'false'
  no-retain:
    description:
      Publish the paths without adding them to a retention root. The cache then
      keeps them only for its grace period, if it has one. Cannot be combined
      with root, ttl or permanent.
    required: false
    default: 'false'
  wait:
    description:
      Wait until the cache has verified the uploaded files and serves the paths.
      Keep this on if an attest step follows, because attest needs the paths to
      be published.
    required: false
    default: 'true'
  wait-timeout:
    description:
      How long to wait. The limit applies separately to waiting for the cache to
      accept the upload and to waiting for verification.
    required: false
    default: 10m
  attestations:
    description:
      Sigstore bundle files to attach to the published paths, one per line.
    required: false
  require-grace:
    description:
      Fail if any published path has no grace-period deadline. Requires wait to
      be true.
    required: false
    default: 'false'
  intermediate-paths-file:
    description:
      File that lists store paths to publish with the targets, one per line.
      These paths are not added to the root as targets. When root-groups has
      more than one group, only the first push includes these paths.
    required: false
  reference-paths-file:
    description:
      File that lists store paths to publish by reference from reference-source,
      one per line. The action does not read them from a local store or upload
      them, so the tenant must already store their NAR files. Set it together
      with reference-source.
    required: false
  reference-source:
    description:
      URL of the cache or reuse view that serves the paths in
      reference-paths-file. Set it together with reference-paths-file.
    required: false
  run-root:
    description:
      Run root to add every published path to. It is separate from root and
      root-groups.
    required: false
  run-root-ttl:
    description:
      How long the run root lasts after it was last set. Requires run-root.
    required: false
  run-root-permanent:
    description:
      Keep the run root permanently. Requires run-root, and cannot be combined
      with run-root-ttl. Older cupboard releases do not have this option. With
      one of those releases, the run root uses the cache's retention settings
      and the action prints a warning.
    required: false
    default: 'false'
  root-groups:
    description:
      JSON array of {root, paths} objects, used instead of the paths and root
      inputs. Setting a root replaces everything that it points to, so the
      action runs one push for each group.
    required: false
outputs:
  cupboard-path:
    description: Path to the cupboard executable that the action used.
    value: ${{ steps.push.outputs.cupboard-path }}
  cupboard-version:
    description: Version that the cupboard executable reported.
    value: ${{ steps.push.outputs.cupboard-version }}
  uploaded-paths:
    description: Number of paths whose NAR files were uploaded to the cache.
    value: ${{ steps.push.outputs.uploaded-paths }}
  reused-blobs:
    description:
      Number of paths published with NAR files that the cache already stored.
    value: ${{ steps.push.outputs.reused-blobs }}
  skipped-paths:
    description: Number of paths left out because the cache already had them.
    value: ${{ steps.push.outputs.skipped-paths }}
  uploaded-bytes:
    description: Total number of bytes uploaded to the cache.
    value: ${{ steps.push.outputs.uploaded-bytes }}
  receipt-file:
    description:
      Receipt for the paths served after this push. Empty when
      build-receipt-file is unset.
    value: ${{ steps.push.outputs.receipt-file }}
runs:
  using: composite
  steps:
    - name: Resolve the pinned toolchain
      id: toolchain
      shell: bash
      # The workspace manifest's packageManager field is the single pnpm pin;
      # the release integrity suffix, when present, is not part of the version.
      run: bash "$GITHUB_ACTION_PATH/../bootstrap.sh" toolchain

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ steps.toolchain.outputs.pnpm-version }}
        # Read packageManager from this action's manifest. Reading the caller's
        # checkout could select a different pnpm version and conflict with
        # `version`. scripts/action-tool-parity.test.ts keeps this pin aligned
        # with the workspace manifest.
        package_json_file: ${{ github.action_path }}/../../package.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.toolchain.outputs.node-version }}

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: bash "$GITHUB_ACTION_PATH/../bootstrap.sh" install

    - name: Push store paths
      id: push
      shell: bash
      env:
        URL: ${{ inputs.url }}
        PATHS: ${{ inputs.paths }}
        PATHS_FILE: ${{ inputs.paths-file }}
        CUPBOARD_PATH: ${{ inputs.cupboard-path }}
        READ_SESSION_TARGET: ${{ inputs.read-session-target }}
        READ_SESSION_AUDIENCE: ${{ inputs.audience }}
        READ_SESSION_CACHES: ${{ inputs.read-session-caches }}
        READ_SESSION_VIEW: ${{ inputs.read-session-view }}
        CUPBOARD_VERSION: ${{ inputs.cupboard-version }}
        INCLUDE_PRERELEASES: ${{ inputs.include-prereleases }}
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        RELEASE_REPOSITORY: ${{ inputs.release-repository }}
        EXPECTED_SOURCE_COMMIT: ${{ inputs.expected-source-commit }}
        INSTALL_DIR: ${{ inputs.install-dir }}
        CACHE: ${{ inputs.cache }}
        STORE: ${{ inputs.store }}
        CLOSURE: ${{ inputs.closure }}
        BUILD_RECEIPT_FILE: ${{ inputs.build-receipt-file }}
        AUDIENCE: ${{ inputs.audience }}
        ROOT: ${{ inputs.root }}
        TTL: ${{ inputs.ttl }}
        PERMANENT: ${{ inputs.permanent }}
        # The program's option is `--retain`; only the two valid literals
        # invert here, so any other value reaches the strict boolean parse
        # unchanged and is refused there.
        RETAIN:
          ${{ inputs.no-retain == 'true' && 'false' || inputs.no-retain ==
          'false' && 'true' || inputs.no-retain }}
        WAIT: ${{ inputs.wait }}
        WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
        ATTESTATIONS: ${{ inputs.attestations }}
        REQUIRE_GRACE: ${{ inputs.require-grace }}
        INTERMEDIATE_PATHS_FILE: ${{ inputs.intermediate-paths-file }}
        REFERENCE_PATHS_FILE: ${{ inputs.reference-paths-file }}
        REFERENCE_SOURCE: ${{ inputs.reference-source }}
        RUN_ROOT: ${{ inputs.run-root }}
        RUN_ROOT_TTL: ${{ inputs.run-root-ttl }}
        RUN_ROOT_PERMANENT: ${{ inputs.run-root-permanent }}
        ROOT_GROUPS: ${{ inputs.root-groups }}
      run: |
        args=(push
          --url "$URL"
          --paths "$PATHS"
          --paths-file "$PATHS_FILE"
          --cupboard-path "$CUPBOARD_PATH"
          --cupboard-version "$CUPBOARD_VERSION"
          --include-prereleases "$INCLUDE_PRERELEASES"
          --github-token "$GH_TOKEN"
          --release-repository "$RELEASE_REPOSITORY"
          --expected-source-commit "$EXPECTED_SOURCE_COMMIT"
          --install-dir "$INSTALL_DIR"
          --cache "$CACHE"
          --store "$STORE"
          --closure "$CLOSURE"
          --build-receipt-file "$BUILD_RECEIPT_FILE"
          --audience "$AUDIENCE"
          --root "$ROOT"
          --ttl "$TTL"
          --permanent "$PERMANENT"
          --retain "$RETAIN"
          --require-grace "$REQUIRE_GRACE"
          --wait "$WAIT"
          --wait-timeout "$WAIT_TIMEOUT"
          --attestations "$ATTESTATIONS"
          --intermediate-paths-file "$INTERMEDIATE_PATHS_FILE"
          --reference-paths-file "$REFERENCE_PATHS_FILE"
          --reference-source "$REFERENCE_SOURCE"
          --run-root "$RUN_ROOT"
          --run-root-ttl "$RUN_ROOT_TTL"
          --run-root-permanent "$RUN_ROOT_PERMANENT"
          --root-groups "$ROOT_GROUPS")
        source "$GITHUB_ACTION_PATH/../read-session.sh"
        run_with_read_session \
          "$CUPBOARD_PATH" "$READ_SESSION_TARGET" "$READ_SESSION_VIEW" -- \
          node --experimental-transform-types \
            --disable-warning=ExperimentalWarning \
            "$GITHUB_ACTION_PATH/../src/main.ts" "${args[@]}"
