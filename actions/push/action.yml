name: Push to cupboard
description: Push local Nix store paths to a cupboard cache.
inputs:
  url:
    description: URL of the cupboard Worker.
    required: true
  paths:
    description:
      Newline-delimited local Nix store paths, derivations, or installables to
      push. Required unless root-groups is given.
    required: false
  cupboard-path:
    description:
      Use this pre-acquired cupboard executable from actions/setup and skip
      release installation.
    required: false
  cupboard-version:
    description:
      cupboard version to install. Use latest or an exact published release tag.
    required: false
  include-prereleases:
    description: When true, prereleases are eligible when resolving latest.
    required: false
  github-token:
    description: GitHub token used for release API calls.
    required: false
  release-repository:
    description: Repository that publishes cupboard release assets.
    required: false
  expected-source-commit:
    description:
      Full commit id the installed release must have been built from. Requires
      an exact cupboard-version.
    required: false
  install-dir:
    description: Directory for the downloaded cupboard binary.
    required: false
  cache:
    description: Cache to receive the paths.
    required: false
  store:
    description: >-
      Remote ssh-ng store URI to use for reading path metadata and NAR bytes.
      Empty reads the store Nix itself would use on this runner.
    required: false
  audience:
    description: GitHub OIDC audience. Defaults to the canonical form of url.
    required: false
  root:
    description: Retention root to update with the pushed paths.
    required: false
  ttl:
    description: Retention TTL such as 7d or 12h.
    required: false
  no-retain:
    description:
      Push without adding the paths to a retention root or pin. The cache keeps
      them only while a matching grace policy applies. Conflicts with root and
      ttl.
    required: false
    default: 'false'
  wait:
    description: Wait until deferred paths become servable.
    required: false
    default: 'true'
  wait-timeout:
    description:
      Wait timeout, applied separately to commit capacity and to deferred blobs.
    required: false
    default: 10m
  attestations:
    description: Newline-delimited local Sigstore DSSE bundle paths to attach.
    required: false
  require-grace:
    description:
      Fail if any pushed path has no retention grace deadline. Requires wait to
      stay enabled.
    required: false
    default: 'false'
  intermediate-paths-file:
    description:
      Newline-delimited store paths to publish alongside the targets without
      retaining them as targets. When root-groups contains more than one root,
      only the first push includes these paths.
    required: false
  reference-paths-file:
    description:
      Newline-delimited store paths to publish from reference-source without
      reading a local store or uploading NARs. Their NAR blobs must already
      exist in the tenant. Required together with reference-source.
    required: false
  reference-source:
    description:
      Cache endpoint that serves the reference paths. Required together with
      reference-paths-file.
    required: false
  run-root:
    description:
      Add each committed path to this run root. This is independent of root and
      root-groups.
    required: false
  run-root-ttl:
    description: Expire the run root after this duration. Requires run-root.
    required: false
  root-groups:
    description: >-
      JSON array of {root, paths} objects. Replaces the flat paths and root
      inputs. The action makes one push per group because each root is replaced
      atomically.
    required: false
outputs:
  cupboard-path:
    description: Path to the cupboard executable that the action used.
    value: ${{ steps.push.outputs.cupboard-path }}
  cupboard-version:
    description: Version reported by the cupboard executable.
    value: ${{ steps.push.outputs.cupboard-version }}
  uploaded-paths:
    description: Number of paths whose NAR blobs were uploaded to the cache.
    value: ${{ steps.push.outputs.uploaded-paths }}
  reused-blobs:
    description: Number of paths committed using NAR blobs already in the cache.
    value: ${{ steps.push.outputs.reused-blobs }}
  skipped-paths:
    description: Number of paths omitted because the cache already had them.
    value: ${{ steps.push.outputs.skipped-paths }}
  uploaded-bytes:
    description: Total number of bytes uploaded to the cache.
    value: ${{ steps.push.outputs.uploaded-bytes }}
runs:
  using: composite
  steps:
    - name: Resolve the pinned toolchain
      id: toolchain
      shell: bash
      # The workspace manifest's packageManager field is the single pnpm pin;
      # the release integrity suffix, when present, is not part of the version.
      run: |
        manifest="$GITHUB_ACTION_PATH/../../package.json"
        node_version_file="$GITHUB_ACTION_PATH/../../.node-version"
        version="$(sed -n 's/.*"packageManager": *"pnpm@\([^+"]*\).*/\1/p' "$manifest")"
        if [ -z "$version" ]; then
          echo "::error::package.json declares no pnpm packageManager pin"
          exit 1
        fi
        if [ ! -r "$node_version_file" ]; then
          echo "::error::.node-version is not readable"
          exit 1
        fi
        node_version="$(tr -d '\r\n' < "$node_version_file")"
        if [ -z "$node_version" ]; then
          echo "::error::.node-version declares no Node version"
          exit 1
        fi
        echo "pnpm-version=$version" | tee -a "$GITHUB_OUTPUT"
        echo "node-version=$node_version" | tee -a "$GITHUB_OUTPUT"

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: ${{ steps.toolchain.outputs.pnpm-version }}
        # Read packageManager from this action's manifest. Reading the caller's
        # checkout could select a different pnpm version and conflict with
        # `version`. scripts/action-tool-parity.test.ts keeps this pin aligned
        # with the workspace manifest.
        package_json_file: ${{ github.action_path }}/../../package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.toolchain.outputs.node-version }}

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: pnpm install --filter @cupboard/action... --prod --frozen-lockfile

    - name: Push store paths
      id: push
      shell: bash
      env:
        URL: ${{ inputs.url }}
        PATHS: ${{ inputs.paths }}
        CUPBOARD_PATH: ${{ inputs.cupboard-path }}
        CUPBOARD_VERSION: ${{ inputs.cupboard-version }}
        INCLUDE_PRERELEASES: ${{ inputs.include-prereleases }}
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        RELEASE_REPOSITORY: ${{ inputs.release-repository }}
        EXPECTED_SOURCE_COMMIT: ${{ inputs.expected-source-commit }}
        INSTALL_DIR: ${{ inputs.install-dir }}
        CACHE: ${{ inputs.cache }}
        STORE: ${{ inputs.store }}
        AUDIENCE: ${{ inputs.audience }}
        ROOT: ${{ inputs.root }}
        TTL: ${{ inputs.ttl }}
        # The program's option is `--retain`; only the two valid literals
        # invert here, so any other value reaches the strict boolean parse
        # unchanged and is refused there.
        RETAIN:
          ${{ inputs.no-retain == 'true' && 'false' || inputs.no-retain ==
          'false' && 'true' || inputs.no-retain }}
        WAIT: ${{ inputs.wait }}
        WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
        ATTESTATIONS: ${{ inputs.attestations }}
        REQUIRE_GRACE: ${{ inputs.require-grace }}
        INTERMEDIATE_PATHS_FILE: ${{ inputs.intermediate-paths-file }}
        REFERENCE_PATHS_FILE: ${{ inputs.reference-paths-file }}
        REFERENCE_SOURCE: ${{ inputs.reference-source }}
        RUN_ROOT: ${{ inputs.run-root }}
        RUN_ROOT_TTL: ${{ inputs.run-root-ttl }}
        ROOT_GROUPS: ${{ inputs.root-groups }}
      run: |
        args=(push
          --url "$URL"
          --paths "$PATHS"
          --cupboard-path "$CUPBOARD_PATH"
          --cupboard-version "$CUPBOARD_VERSION"
          --include-prereleases "$INCLUDE_PRERELEASES"
          --github-token "$GH_TOKEN"
          --release-repository "$RELEASE_REPOSITORY"
          --expected-source-commit "$EXPECTED_SOURCE_COMMIT"
          --install-dir "$INSTALL_DIR"
          --cache "$CACHE"
          --store "$STORE"
          --audience "$AUDIENCE"
          --root "$ROOT"
          --ttl "$TTL"
          --retain "$RETAIN"
          --require-grace "$REQUIRE_GRACE"
          --wait "$WAIT"
          --wait-timeout "$WAIT_TIMEOUT"
          --attestations "$ATTESTATIONS"
          --intermediate-paths-file "$INTERMEDIATE_PATHS_FILE"
          --reference-paths-file "$REFERENCE_PATHS_FILE"
          --reference-source "$REFERENCE_SOURCE"
          --run-root "$RUN_ROOT"
          --run-root-ttl "$RUN_ROOT_TTL"
          --root-groups "$ROOT_GROUPS")
        node --experimental-transform-types \
          --disable-warning=ExperimentalWarning \
          "$GITHUB_ACTION_PATH/../src/main.ts" "${args[@]}"
