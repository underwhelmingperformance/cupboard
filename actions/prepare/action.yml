name: Prepare a cupboard publish runner
description:
  Ready a runner for flake publish jobs, covering private flake input SSH,
  optional disk-space reclamation, Nix installation and configuration, and
  optional remote builders.
inputs:
  ssh-key:
    description: SSH key for private flake inputs. Empty skips.
    required: false
  nix-config:
    description:
      Flake installable that evaluates to extra nix.conf text for builders.
      Empty skips.
    required: false
  maximise-space:
    description:
      When true, reclaim disk space before installing Nix (macOS Xcode removal,
      Linux nothing-but-nix).
    required: false
    default: 'false'
  remote:
    description: When true, configure the remote builders below for this job.
    required: false
    default: 'false'
  builders:
    description:
      nix.conf builders specification naming the remote builders. Empty skips.
    required: false
  builder-ssh-key:
    description: SSH private key authenticating to the remote builders.
    required: false
  builder-ssh-config:
    description:
      ssh_config text for the remote builder connections, appended to the user's
      SSH configuration. Scope directives under Host blocks; secrets such as
      connection-environment tokens may appear here.
    required: false
  builder-known-hosts:
    description:
      known_hosts lines for the remote builders. Hosts they name are pinned;
      other hosts are accepted on first connection.
    required: false
runs:
  using: composite
  steps:
    - name: Set up private flake inputs
      shell: bash
      env:
        INPUT_SSH_KEY: ${{ inputs.ssh-key }}
      # The github-env audit treats every environment-file write as a
      # potential code-execution channel; the value written here is built
      # solely from runner-owned paths (the key content goes into the key
      # file, never the environment), which is the false-positive shape the
      # audit documents (https://docs.zizmor.sh/audits/#github-env).
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        if [ -z "${INPUT_SSH_KEY}" ]; then
          echo 'No SSH key was provided; private flake inputs will not be reachable.'
          exit 0
        fi

        key="${RUNNER_TEMP}/cupboard_input_key"
        install -m 600 /dev/null "${key}"
        printf '%s\n' "${INPUT_SSH_KEY}" > "${key}"
        # Nix fetches private flake inputs through the git executable, which
        # honours GIT_SSH_COMMAND. The environment file is job-scoped, so on a
        # persistent self-hosted runner the configuration cannot outlive the
        # key it references.
        echo "GIT_SSH_COMMAND=ssh -i ${key} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=${RUNNER_TEMP}/known_hosts" >> "${GITHUB_ENV}"

    - name: Free disk space
      if: ${{ inputs.maximise-space == 'true' && runner.os == 'macOS' }}
      shell: bash
      run: |
        set -euo pipefail

        df -h /

        sudo xcode-select --switch /Library/Developer/CommandLineTools || true
        sudo rm -rf /Applications/Xcode_*.app
        sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
        sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/* || true
        xcrun simctl delete unavailable || true

        df -h /

    - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      if: ${{ inputs.maximise-space == 'true' && runner.os == 'Linux' }}
      with:
        hatchet-protocol: holster
        nix-permission-edict: true

    # Single-user Nix: evaluation and builds run as this user, so they read
    # the git SSH configuration above and the builder SSH configuration below;
    # a multi-user daemon would use neither.
    - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

    # Extra settings and the builders below accumulate in a job-scoped file
    # under RUNNER_TEMP, threaded to Nix through NIX_USER_CONF_FILES: the
    # runner's own configuration is listed after it and stays untouched, so a
    # persistent self-hosted runner carries nothing over into later jobs.
    # The environment write carries only runner-owned paths, which is the
    # false-positive shape the github-env audit documents
    # (https://docs.zizmor.sh/audits/#github-env).
    - name: Configure extra Nix settings
      if: ${{ inputs.nix-config != '' }}
      shell: bash
      env:
        NIX_CONFIG_INSTALLABLE: ${{ inputs.nix-config }}
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        # `--raw` prints the evaluated string verbatim, so the trailing newline
        # must be supplied here or a later append would glue onto the last line.
        {
          nix eval --raw "${NIX_CONFIG_INSTALLABLE}"
          printf '\n'
        } >> "${RUNNER_TEMP}/cupboard-prepare-nix.conf"
        echo "NIX_USER_CONF_FILES=${RUNNER_TEMP}/cupboard-prepare-nix.conf:${HOME}/.config/nix/nix.conf" >> "${GITHUB_ENV}"

    # A remote group builds with --max-jobs 0, so no builders means the job
    # cannot build anything; without this refusal it hangs or fails opaquely
    # mid-build.
    - name: Verify the remote builder configuration
      if: ${{ inputs.remote == 'true' && inputs.builders == '' }}
      shell: bash
      run: |
        set -euo pipefail
        echo '::error::remote is true but no builders were supplied; set the builders input (and its secrets) or build this group locally'
        exit 1

    # Nix reaches ssh:// builders through ssh options passed via NIX_SSHOPTS,
    # so the caller's Host blocks, the builder key and the host trust all
    # live in a job-scoped configuration under RUNNER_TEMP; a persistent
    # self-hosted runner carries neither credentials nor builder settings
    # into later jobs. ssh uses the first value it obtains for an option, and
    # a Host block extends to the next Host line, so the caller's
    # configuration goes first and the defaults sit in a fresh `Host *` block
    # that yields to it. The environment writes carry only runner-owned
    # paths, which is the false-positive shape the github-env audit documents
    # (https://docs.zizmor.sh/audits/#github-env).
    - name: Configure remote builders
      if: ${{ inputs.remote == 'true' && inputs.builders != '' }}
      shell: bash
      env:
        BUILDERS: ${{ inputs.builders }}
        BUILDER_SSH_KEY: ${{ inputs.builder-ssh-key }}
        BUILDER_SSH_CONFIG: ${{ inputs.builder-ssh-config }}
        BUILDER_KNOWN_HOSTS: ${{ inputs.builder-known-hosts }}
      run: | # zizmor: ignore[github-env]
        set -euo pipefail

        config="${RUNNER_TEMP}/cupboard_ssh_config"
        install -m 600 /dev/null "${config}"

        if [ -n "${BUILDER_SSH_CONFIG}" ]; then
          printf '%s\n' "${BUILDER_SSH_CONFIG}" >> "${config}"
        fi

        printf 'Host *\n' >> "${config}"

        if [ -n "${BUILDER_SSH_KEY}" ]; then
          key="${RUNNER_TEMP}/cupboard_builder_key"
          install -m 600 /dev/null "${key}"
          printf '%s\n' "${BUILDER_SSH_KEY}" > "${key}"
          printf '  IdentityFile %s\n' "${key}" >> "${config}"
        fi

        {
          printf '  ServerAliveInterval 60\n'
          printf '  IPQoS throughput\n'
          printf '  StrictHostKeyChecking accept-new\n'
          printf '  UserKnownHostsFile %s\n' "${RUNNER_TEMP}/cupboard_builder_known_hosts"
        } >> "${config}"

        touch "${RUNNER_TEMP}/cupboard_builder_known_hosts"
        chmod 600 "${RUNNER_TEMP}/cupboard_builder_known_hosts"
        if [ -n "${BUILDER_KNOWN_HOSTS}" ]; then
          printf '%s\n' "${BUILDER_KNOWN_HOSTS}" >> "${RUNNER_TEMP}/cupboard_builder_known_hosts"
        fi

        {
          printf 'builders = %s\n' "${BUILDERS}"
          printf 'builders-use-substitutes = true\n'
        } >> "${RUNNER_TEMP}/cupboard-prepare-nix.conf"
        {
          echo "NIX_SSHOPTS=-F ${config}"
          echo "NIX_USER_CONF_FILES=${RUNNER_TEMP}/cupboard-prepare-nix.conf:${HOME}/.config/nix/nix.conf"
        } >> "${GITHUB_ENV}"
