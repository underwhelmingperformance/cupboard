name: Prepare a cupboard publish runner
description:
  Ready a runner for flake publish jobs, covering private flake input SSH,
  optional disk-space reclamation, Nix installation and configuration, and
  optional remote builders.
inputs:
  ssh-key:
    description:
      SSH key for private flake inputs. Empty still installs an isolated Git SSH
      policy that disables ambient identities.
    required: false
  input-known-hosts:
    description:
      Required known_hosts lines pinning private flake input SSH hosts whenever
      ssh-key is supplied.
    required: false
  nix-config:
    description:
      Flake installable that evaluates to extra nix.conf text for builders.
      Empty skips.
    required: false
  maximise-space:
    description:
      When true, reclaim disk space before installing Nix (macOS Xcode removal,
      Linux nothing-but-nix).
    required: false
    default: 'false'
  remote:
    description: When true, configure the remote builders below for this job.
    required: false
    default: 'false'
  store:
    description:
      Direct ssh-ng store selected for this job. Mutually exclusive with remote
      builder mode; empty selects no direct store. Must not select a key through
      a non-empty ssh-key; pass a private key through store-ssh-key.
    required: false
  builders:
    description:
      One-line nix.conf builders specification naming the remote builders; use
      semicolons for multiple entries. Empty skips. The machine SSH-key column
      must be - and builder store URIs must not select a non-empty ssh-key; pass
      a private key through builder-ssh-key.
    required: false
  builder-ssh-key:
    description: SSH private key authenticating to the remote builders.
    required: false
  builder-ssh-config:
    description:
      ssh_config text for the remote builder connections, appended after the
      action's mandatory transport policy. A strict allowlist accepts Host
      blocks containing endpoint, transport tuning, algorithm, liveness and
      SetEnv directives. Commands, proxies, forwarding, identity sources,
      verbose logging, Include and Match are rejected.
    required: false
  builder-known-hosts:
    description:
      Required known_hosts lines pinning every enabled remote builder.
    required: false
  store-ssh-key:
    description: SSH private key authenticating to a direct ssh-ng store.
    required: false
  store-ssh-config:
    description:
      ssh_config text for the direct store connection, appended after the
      action's mandatory transport policy. A strict allowlist accepts Host
      blocks containing endpoint, transport tuning, algorithm, liveness and
      SetEnv directives. Commands, proxies, forwarding, identity sources,
      verbose logging, Include and Match are rejected.
    required: false
  store-known-hosts:
    description:
      known_hosts lines pinning the direct store. Required unless the store uses
      the default SSH port and its URI supplies base64-ssh-public-host-key.
    required: false
  store-ambient-identity:
    description:
      When true, authenticate the direct store with the runner's SSH agent or
      default identity files instead of a job-scoped store-ssh-key. Intended
      only for explicitly provisioned self-hosted runners and mutually exclusive
      with store-ssh-key.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Verify the SSH mode configuration
      shell: bash
      env:
        REMOTE: ${{ inputs.remote }}
        STORE: ${{ inputs.store }}
        BUILDERS: ${{ inputs.builders }}
        BUILDER_SSH_KEY: ${{ inputs.builder-ssh-key }}
        BUILDER_SSH_CONFIG: ${{ inputs.builder-ssh-config }}
        BUILDER_KNOWN_HOSTS: ${{ inputs.builder-known-hosts }}
        STORE_SSH_KEY: ${{ inputs.store-ssh-key }}
        STORE_SSH_CONFIG: ${{ inputs.store-ssh-config }}
        STORE_KNOWN_HOSTS: ${{ inputs.store-known-hosts }}
        STORE_AMBIENT_IDENTITY: ${{ inputs.store-ambient-identity }}
      run: |
        bash "${GITHUB_ACTION_PATH}/ssh-transport.sh" validate

    - name: Set up private flake inputs
      shell: bash
      env:
        INPUT_SSH_KEY: ${{ inputs.ssh-key }}
        INPUT_KNOWN_HOSTS: ${{ inputs.input-known-hosts }}
      # The github-env audit treats every environment-file write as a
      # potential code-execution channel; the value written here is built
      # solely from runner-owned paths (the key content goes into the key
      # file, never the environment), which is the false-positive shape the
      # audit documents (https://docs.zizmor.sh/audits/#github-env).
      run: | # zizmor: ignore[github-env]
        # Nix fetches private flake inputs through the git executable, which
        # honours GIT_SSH_COMMAND. Its isolated config accepts only the pinned
        # hosts below and the managed identity. The environment file is
        # job-scoped, so on a persistent self-hosted runner the configuration
        # cannot outlive the key it references.
        bash "${GITHUB_ACTION_PATH}/ssh-transport.sh" configure-input

    - name: Free disk space
      if: ${{ inputs.maximise-space == 'true' && runner.os == 'macOS' }}
      shell: bash
      run: |
        set -euo pipefail

        df -h /

        sudo xcode-select --switch /Library/Developer/CommandLineTools || true
        sudo rm -rf /Applications/Xcode_*.app
        sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
        sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/* || true
        xcrun simctl delete unavailable || true

        df -h /

    - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      if: ${{ inputs.maximise-space == 'true' && runner.os == 'Linux' }}
      with:
        hatchet-protocol: holster
        nix-permission-edict: true

    # Single-user Nix: evaluation and builds run as this user, so they read
    # the git SSH configuration above and the builder SSH configuration below;
    # a multi-user daemon would use neither.
    - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      with:
        nix_version: 2.34.7

    # Extra settings and the builders below accumulate in a job-scoped file
    # under RUNNER_TEMP, threaded to Nix through NIX_USER_CONF_FILES: the
    # runner's own configuration is listed after it and stays untouched, so a
    # persistent self-hosted runner carries nothing over into later jobs.
    # The environment write carries only runner-owned paths, which is the
    # false-positive shape the github-env audit documents
    # (https://docs.zizmor.sh/audits/#github-env).
    - name: Configure extra Nix settings
      if: ${{ inputs.nix-config != '' }}
      shell: bash
      env:
        NIX_CONFIG_INSTALLABLE: ${{ inputs.nix-config }}
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        # `--raw` prints the evaluated string verbatim, so the trailing newline
        # must be supplied here or a later append would glue onto the last line.
        {
          nix eval --raw "${NIX_CONFIG_INSTALLABLE}"
          printf '\n'
        } >> "${RUNNER_TEMP}/cupboard-prepare-nix.conf"
        echo "NIX_USER_CONF_FILES=${RUNNER_TEMP}/cupboard-prepare-nix.conf:${HOME}/.config/nix/nix.conf" >> "${GITHUB_ENV}"

    # Nix reaches both ssh:// builders and ssh-ng:// stores through options in
    # NIX_SSHOPTS. Exactly one mode's caller inputs enter this job-scoped
    # configuration under RUNNER_TEMP, so neither identity can be offered to
    # the other service and a persistent self-hosted runner carries no settings
    # into later jobs. ssh uses the first value it obtains for an option, so the
    # action's host-key policy and managed identity restrictions live in the
    # first `Host *` block. Caller Host blocks follow it and can add connection
    # settings without weakening that policy. The environment writes carry only
    # runner-owned paths, which is the false-positive shape the github-env audit
    # documents (https://docs.zizmor.sh/audits/#github-env).
    - name: Configure Nix SSH transport
      if: >-
        ${{ inputs.store != '' || (inputs.remote == 'true' && inputs.builders !=
        '') }}
      shell: bash
      env:
        REMOTE: ${{ inputs.remote }}
        STORE: ${{ inputs.store }}
        BUILDERS: ${{ inputs.builders }}
        BUILDER_SSH_KEY: ${{ inputs.builder-ssh-key }}
        BUILDER_SSH_CONFIG: ${{ inputs.builder-ssh-config }}
        BUILDER_KNOWN_HOSTS: ${{ inputs.builder-known-hosts }}
        STORE_SSH_KEY: ${{ inputs.store-ssh-key }}
        STORE_SSH_CONFIG: ${{ inputs.store-ssh-config }}
        STORE_KNOWN_HOSTS: ${{ inputs.store-known-hosts }}
        STORE_AMBIENT_IDENTITY: ${{ inputs.store-ambient-identity }}
      run: | # zizmor: ignore[github-env]
        bash "${GITHUB_ACTION_PATH}/ssh-transport.sh" configure
