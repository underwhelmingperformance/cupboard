name: Prepare a cupboard publish runner
description:
  Configure a runner for flake publication with private-input SSH, optional
  disk-space reclamation, Nix installation and configuration, and optional
  remote builders.
inputs:
  ssh-key:
    description:
      SSH key for private flake inputs. When empty, the isolated Git SSH policy
      still disables ambient identities.
    required: false
  input-known-hosts:
    description:
      known_hosts lines for private flake input hosts. Required when ssh-key is
      supplied.
    required: false
  nix-config:
    description:
      Flake installable that evaluates to nix.conf settings for this job. These
      settings override the defaults this action writes. Leave empty to skip
      this configuration.
    required: false
  maximise-space:
    description:
      When true, reclaim disk space before installing Nix by removing Xcode on
      macOS or running nothing-but-nix on Linux.
    required: false
    default: 'false'
  remote:
    description: When true, configure the remote builders below for this job.
    required: false
    default: 'false'
  store:
    description:
      Direct ssh-ng store for this job. It is mutually exclusive with remote
      builder mode. Leave it empty to use no direct store. Supply its private
      key through store-ssh-key, not through an ssh-key URI parameter.
    required: false
  builders:
    description:
      One-line nix.conf builders specification. Separate multiple entries with
      semicolons. Leave it empty to skip remote builders. Set the machine
      SSH-key column to -, and supply the private key through builder-ssh-key
      instead of an ssh-key URI parameter.
    required: false
  builder-ssh-key:
    description: SSH private key authenticating to the remote builders.
    required: false
  builder-ssh-config:
    description:
      ssh_config text appended after the action's mandatory policy for remote
      builders. A strict allowlist permits Host blocks with endpoint, transport
      tuning, algorithm, liveness and SetEnv directives. Commands, proxies,
      forwarding, identity sources, verbose logging, Include and Match are
      rejected.
    required: false
  builder-known-hosts:
    description: Required known_hosts lines for every enabled remote builder.
    required: false
  store-ssh-key:
    description: SSH private key authenticating to a direct ssh-ng store.
    required: false
  store-ssh-config:
    description:
      ssh_config text appended after the action's mandatory policy for the
      direct store. A strict allowlist permits Host blocks with endpoint,
      transport tuning, algorithm, liveness and SetEnv directives. Commands,
      proxies, forwarding, identity sources, verbose logging, Include and Match
      are rejected.
    required: false
  store-known-hosts:
    description:
      known_hosts lines for the direct store. Required unless the store uses the
      default SSH port and its URI supplies base64-ssh-public-host-key.
    required: false
  store-ambient-identity:
    description:
      When true, authenticate the direct store with the runner's SSH agent or
      default identity files instead of a job-scoped store-ssh-key. This mode is
      only for explicitly provisioned self-hosted runners and is mutually
      exclusive with store-ssh-key.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Verify the SSH mode configuration
      shell: bash
      env:
        REMOTE: ${{ inputs.remote }}
        STORE: ${{ inputs.store }}
        BUILDERS: ${{ inputs.builders }}
        BUILDER_SSH_KEY: ${{ inputs.builder-ssh-key }}
        BUILDER_SSH_CONFIG: ${{ inputs.builder-ssh-config }}
        BUILDER_KNOWN_HOSTS: ${{ inputs.builder-known-hosts }}
        STORE_SSH_KEY: ${{ inputs.store-ssh-key }}
        STORE_SSH_CONFIG: ${{ inputs.store-ssh-config }}
        STORE_KNOWN_HOSTS: ${{ inputs.store-known-hosts }}
        STORE_AMBIENT_IDENTITY: ${{ inputs.store-ambient-identity }}
      run: |
        bash "${GITHUB_ACTION_PATH}/ssh-transport.sh" validate

    - name: Set up private flake inputs
      shell: bash
      env:
        INPUT_SSH_KEY: ${{ inputs.ssh-key }}
        INPUT_KNOWN_HOSTS: ${{ inputs.input-known-hosts }}
      # Only runner-owned paths are written to GITHUB_ENV. The caller's key is
      # written to a separate file, so this is the safe case documented by the
      # github-env audit (https://docs.zizmor.sh/audits/#github-env).
      run: | # zizmor: ignore[github-env]
        # Nix fetches private flake inputs through Git, which honours
        # GIT_SSH_COMMAND. The isolated configuration accepts only pinned hosts
        # and the managed identity. GITHUB_ENV is job-scoped, so the
        # configuration cannot outlive the key on a persistent runner.
        bash "${GITHUB_ACTION_PATH}/ssh-transport.sh" configure-input

    - name: Free disk space
      if: ${{ inputs.maximise-space == 'true' && runner.os == 'macOS' }}
      shell: bash
      run: |
        set -euo pipefail

        df -h /

        sudo xcode-select --switch /Library/Developer/CommandLineTools || true
        sudo rm -rf /Applications/Xcode_*.app
        sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
        sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/* || true
        xcrun simctl delete unavailable || true

        df -h /

    - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      if: ${{ inputs.maximise-space == 'true' && runner.os == 'Linux' }}
      with:
        hatchet-protocol: holster
        nix-permission-edict: true

    # Evaluation and builds must run as this user so they read the Git and
    # builder SSH configurations from this job. A multi-user daemon would read
    # neither configuration.
    - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      with:
        nix_version: 2.34.7

    # A cupboard cache holds paths whose derivations set
    # `allowSubstitutes = false`, because this workflow published them. Without
    # this setting Nix rebuilds those derivations on every run instead of
    # fetching the paths the cache already holds.
    #
    # Keep this step before the caller's `nix-config`. Both write to the same
    # file, the last assignment in a nix.conf file wins, and a caller must be
    # able to turn this default off.
    - name: Configure Nix substitution
      shell: bash
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        printf 'always-allow-substitutes = true\n' \
          >> "${RUNNER_TEMP}/cupboard-prepare-nix.conf"
        echo "NIX_USER_CONF_FILES=${RUNNER_TEMP}/cupboard-prepare-nix.conf:${HOME}/.config/nix/nix.conf" >> "${GITHUB_ENV}"

    # Write the additional settings to a job-scoped file under RUNNER_TEMP and
    # put that file first in NIX_USER_CONF_FILES. The runner's configuration
    # remains unchanged, so a persistent runner cannot retain these settings for
    # later jobs. GITHUB_ENV receives only runner-owned paths, which is the safe
    # case documented by the github-env audit
    # (https://docs.zizmor.sh/audits/#github-env).
    - name: Configure extra Nix settings
      if: ${{ inputs.nix-config != '' }}
      shell: bash
      env:
        NIX_CONFIG_INSTALLABLE: ${{ inputs.nix-config }}
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        # `--raw` prints the evaluated string verbatim, so the trailing newline
        # must be supplied here or a later append would glue onto the last line.
        {
          nix eval --raw "${NIX_CONFIG_INSTALLABLE}"
          printf '\n'
        } >> "${RUNNER_TEMP}/cupboard-prepare-nix.conf"
        echo "NIX_USER_CONF_FILES=${RUNNER_TEMP}/cupboard-prepare-nix.conf:${HOME}/.config/nix/nix.conf" >> "${GITHUB_ENV}"

    # Nix uses NIX_SSHOPTS for both ssh:// builders and ssh-ng:// stores. Put
    # only the selected mode's inputs in the job-scoped configuration so neither
    # identity is offered to the other service. SSH uses the first value it
    # finds for an option, so the first `Host *` block enforces the host-key and
    # identity policy. Later caller Host blocks can add settings without
    # weakening that policy. GITHUB_ENV receives only runner-owned paths, which
    # is the safe case documented by the github-env audit
    # (https://docs.zizmor.sh/audits/#github-env).
    - name: Configure Nix SSH transport
      if: >-
        ${{ inputs.store != '' || (inputs.remote == 'true' && inputs.builders !=
        '') }}
      shell: bash
      env:
        REMOTE: ${{ inputs.remote }}
        STORE: ${{ inputs.store }}
        BUILDERS: ${{ inputs.builders }}
        BUILDER_SSH_KEY: ${{ inputs.builder-ssh-key }}
        BUILDER_SSH_CONFIG: ${{ inputs.builder-ssh-config }}
        BUILDER_KNOWN_HOSTS: ${{ inputs.builder-known-hosts }}
        STORE_SSH_KEY: ${{ inputs.store-ssh-key }}
        STORE_SSH_CONFIG: ${{ inputs.store-ssh-config }}
        STORE_KNOWN_HOSTS: ${{ inputs.store-known-hosts }}
        STORE_AMBIENT_IDENTITY: ${{ inputs.store-ambient-identity }}
      run: | # zizmor: ignore[github-env]
        bash "${GITHUB_ACTION_PATH}/ssh-transport.sh" configure
