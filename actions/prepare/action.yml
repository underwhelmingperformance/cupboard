name: Prepare a cupboard publish runner
description:
  Prepares a runner for the flake publish workflow. It sets up SSH for private
  flake inputs, can free disk space, installs and configures Nix, and can set up
  remote builders or a remote store.
inputs:
  ssh-key:
    description:
      SSH private key for fetching private flake inputs. Even when it is empty,
      Git's SSH configuration does not use the runner's own keys or SSH agent.
    required: false
  input-known-hosts:
    description:
      known_hosts lines for the hosts that serve private flake inputs. Required
      when ssh-key is set.
    required: false
  nix-config:
    description:
      Flake installable that evaluates to nix.conf text. The action writes this
      text after its own settings, so these values override them. Leave empty to
      add no settings.
    required: false
  maximise-space:
    description:
      When true, free disk space before installing Nix. On macOS the action
      removes Xcode, and on Linux it runs nothing-but-nix.
    required: false
    default: 'false'
  remote:
    description:
      When true, apply builders, builder-ssh-key, builder-ssh-config and
      builder-known-hosts to this job. The action refuses true without builders,
      so a job that expects remote builders fails instead of building locally.
      It also refuses builder credentials when this input is false.
    required: false
    default: 'false'
  store:
    description:
      ssh-ng:// URI of a remote store for this job. Cannot be combined with
      remote. Leave empty to use the runner's own store. Supply the private key
      as store-ssh-key, not as an ssh-key parameter in the URI.
    required: false
  builders:
    description:
      Nix builders specification on one line, as in nix.conf. Separate several
      builders with semicolons. Leave empty for no remote builders. Put - in the
      SSH key column, and supply the private key as builder-ssh-key instead of
      an ssh-key parameter in the URI.
    required: false
  builder-ssh-key:
    description: SSH private key for the remote builders.
    required: false
  builder-ssh-config:
    description:
      ssh_config text for the remote builders. The action adds it after its own
      required settings. Every setting must be inside a Host block. Only
      HostName, User, Port, connection tuning, algorithm, keep-alive and SetEnv
      settings are accepted. Settings that run commands, use proxies, forward
      connections, load other identities, share connections, change the log
      level, or use Include or Match are refused.
    required: false
  builder-known-hosts:
    description:
      known_hosts lines for every remote builder. Required when remote is true.
    required: false
  store-ssh-key:
    description: SSH private key for the remote store.
    required: false
  store-ssh-config:
    description:
      ssh_config text for the remote store. The action adds it after its own
      required settings. Every setting must be inside a Host block. Only
      HostName, User, Port, connection tuning, algorithm, keep-alive and SetEnv
      settings are accepted. Settings that run commands, use proxies, forward
      connections, load other identities, share connections, change the log
      level, or use Include or Match are refused.
    required: false
  store-known-hosts:
    description:
      known_hosts lines for the remote store. Required unless the store uses
      port 22 and its URI includes base64-ssh-public-host-key.
    required: false
  store-ambient-identity:
    description:
      When true, connect to the remote store with the runner's SSH agent or
      default key files instead of store-ssh-key. Only use this on a self-hosted
      runner that is set up for this job. Cannot be combined with store-ssh-key.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Verify the SSH mode configuration
      shell: bash
      env:
        REMOTE: ${{ inputs.remote }}
        STORE: ${{ inputs.store }}
        BUILDERS: ${{ inputs.builders }}
        BUILDER_SSH_KEY: ${{ inputs.builder-ssh-key }}
        BUILDER_SSH_CONFIG: ${{ inputs.builder-ssh-config }}
        BUILDER_KNOWN_HOSTS: ${{ inputs.builder-known-hosts }}
        STORE_SSH_KEY: ${{ inputs.store-ssh-key }}
        STORE_SSH_CONFIG: ${{ inputs.store-ssh-config }}
        STORE_KNOWN_HOSTS: ${{ inputs.store-known-hosts }}
        STORE_AMBIENT_IDENTITY: ${{ inputs.store-ambient-identity }}
      run: |
        bash "${GITHUB_ACTION_PATH}/ssh-transport.sh" validate

    - name: Set up private flake inputs
      shell: bash
      env:
        INPUT_SSH_KEY: ${{ inputs.ssh-key }}
        INPUT_KNOWN_HOSTS: ${{ inputs.input-known-hosts }}
      # Only runner-owned paths are written to GITHUB_ENV. The caller's key is
      # written to a separate file, so this is the safe case documented by the
      # github-env audit (https://docs.zizmor.sh/audits/#github-env).
      run: | # zizmor: ignore[github-env]
        # Nix fetches private flake inputs through Git, which honours
        # GIT_SSH_COMMAND. The isolated configuration accepts only pinned hosts
        # and the managed identity. GITHUB_ENV is job-scoped, so the
        # configuration cannot outlive the key on a persistent runner.
        bash "${GITHUB_ACTION_PATH}/ssh-transport.sh" configure-input

    - name: Free disk space
      if: ${{ inputs.maximise-space == 'true' && runner.os == 'macOS' }}
      shell: bash
      run: |
        set -euo pipefail

        df -h /

        sudo xcode-select --switch /Library/Developer/CommandLineTools || true
        sudo rm -rf /Applications/Xcode_*.app
        sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
        sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/* || true
        xcrun simctl delete unavailable || true

        df -h /

    - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      if: ${{ inputs.maximise-space == 'true' && runner.os == 'Linux' }}
      with:
        hatchet-protocol: holster
        nix-permission-edict: true

    # Evaluation and builds must run as this user so they read the Git and
    # builder SSH configurations from this job. A multi-user daemon would read
    # neither configuration.
    - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      with:
        nix_version: 2.34.7

    # Nix rebuilds a derivation that sets `allowSubstitutes = false` even when a
    # substituter already serves its output path. This workflow publishes such
    # paths to the cupboard cache itself, so `always-allow-substitutes` lets a
    # run fetch them instead of building them again.
    #
    # Keep this step before the caller's `nix-config`. Both write to the same
    # file, the last assignment in a nix.conf file wins, and a caller must be
    # able to turn this default off.
    - name: Configure Nix substitution
      shell: bash
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        printf 'always-allow-substitutes = true\n' \
          >> "${RUNNER_TEMP}/cupboard-prepare-nix.conf"
        echo "NIX_USER_CONF_FILES=${RUNNER_TEMP}/cupboard-prepare-nix.conf:${HOME}/.config/nix/nix.conf" >> "${GITHUB_ENV}"

    # Write the additional settings to a job-scoped file under RUNNER_TEMP and
    # put that file first in NIX_USER_CONF_FILES. The runner's configuration
    # remains unchanged, so a persistent runner cannot retain these settings for
    # later jobs. GITHUB_ENV receives only runner-owned paths, which is the safe
    # case documented by the github-env audit
    # (https://docs.zizmor.sh/audits/#github-env).
    - name: Configure extra Nix settings
      if: ${{ inputs.nix-config != '' }}
      shell: bash
      env:
        NIX_CONFIG_INSTALLABLE: ${{ inputs.nix-config }}
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        # `--raw` prints the evaluated string verbatim, so the trailing newline
        # must be supplied here or a later append would glue onto the last line.
        {
          nix eval --raw "${NIX_CONFIG_INSTALLABLE}"
          printf '\n'
        } >> "${RUNNER_TEMP}/cupboard-prepare-nix.conf"
        echo "NIX_USER_CONF_FILES=${RUNNER_TEMP}/cupboard-prepare-nix.conf:${HOME}/.config/nix/nix.conf" >> "${GITHUB_ENV}"

    # Nix uses NIX_SSHOPTS for both ssh:// builders and ssh-ng:// stores. Put
    # only the selected mode's inputs in the job-scoped configuration so neither
    # identity is offered to the other service. SSH uses the first value it
    # finds for an option, so the first `Host *` block enforces the host-key and
    # identity policy. Later caller Host blocks can add settings without
    # weakening that policy. GITHUB_ENV receives only runner-owned paths, which
    # is the safe case documented by the github-env audit
    # (https://docs.zizmor.sh/audits/#github-env).
    - name: Configure Nix SSH transport
      if: >-
        ${{ inputs.store != '' || (inputs.remote == 'true' && inputs.builders !=
        '') }}
      shell: bash
      env:
        REMOTE: ${{ inputs.remote }}
        STORE: ${{ inputs.store }}
        BUILDERS: ${{ inputs.builders }}
        BUILDER_SSH_KEY: ${{ inputs.builder-ssh-key }}
        BUILDER_SSH_CONFIG: ${{ inputs.builder-ssh-config }}
        BUILDER_KNOWN_HOSTS: ${{ inputs.builder-known-hosts }}
        STORE_SSH_KEY: ${{ inputs.store-ssh-key }}
        STORE_SSH_CONFIG: ${{ inputs.store-ssh-config }}
        STORE_KNOWN_HOSTS: ${{ inputs.store-known-hosts }}
        STORE_AMBIENT_IDENTITY: ${{ inputs.store-ambient-identity }}
      run: | # zizmor: ignore[github-env]
        bash "${GITHUB_ACTION_PATH}/ssh-transport.sh" configure
