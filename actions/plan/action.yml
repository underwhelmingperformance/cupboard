name: Plan cupboard flake publication
description:
  Evaluate a typed flake target manifest, retain targets already held by the
  cache, and emit the cohort matrix the build jobs consume.
inputs:
  targets:
    description:
      JSON target manifest with each optimised target's root derivation path.
    required: true
  url:
    description: cupboard Worker URL.
    required: true
  cupboard-path:
    description: Path to the cupboard binary installed by actions/setup.
    required: true
  root-prefix:
    description: Retention-root prefix prepended to every target rootSuffix.
    required: true
  cache:
    description: Named cache to inspect and publish to.
    required: false
  ttl:
    description: TTL applied when retaining an already cached target.
    required: false
  read-user:
    description: Username for private cache reads.
    required: false
  read-password:
    description: Password for private cache reads.
    required: false
  audience:
    description: GitHub OIDC audience. Defaults to url.
    required: false
  plan-file:
    description: Destination for the detailed JSON plan.
    required: false
  optimise:
    description:
      Inspect the cache and derivation graph. False emits every target directly.
    required: false
    default: 'true'
  enable-packing:
    description: >-
      Opt in to measured cohort packing: price candidate cohort groupings from
      measured store sizes under pack-capacity, rather than building one cohort
      job per manifest cohort. Off by default; never repartitions a manifest
      without a measurement to price the result against.
    required: false
    default: 'false'
  pack-capacity:
    description: >-
      Disk budget, in bytes, that measured cohort packing prices candidate
      groupings against. Required when enable-packing is true.
    required: false
  store:
    description: >-
      URI of the remote ssh-ng store used by cohort builds. The packing
      measurement queries that store for its missing bytes, so each candidate
      grouping uses the costs of the store where its results will be written.
      When this input is empty, the measurement uses the runner's store. Every
      selected output path must be known during planning; floating
      content-addressed outputs require a local build.
    required: false
  require-provenance:
    description: >-
      Keep cached targets on the build set so this invocation executes their
      final derivations and can attest every published target.
    required: false
    default: 'false'
outputs:
  plan-file:
    description: Detailed plan consumed by the cohort jobs.
    value: ${{ steps.plan.outputs.plan-file }}
  plan-artifact-name:
    description: Unique name for transferring this invocation's plan.
    value: ${{ steps.plan.outputs.plan-artifact-name }}
  target-matrix:
    description: Dynamic matrix for independent targets.
    value: ${{ steps.plan.outputs.target-matrix }}
  cohort-matrix:
    description:
      Dynamic matrix for surviving cohorts, pruned by the advisory destination
      pre-filter.
    value: ${{ steps.plan.outputs.cohort-matrix }}
  retained-count:
    description: Number of targets retained without a build.
    value: ${{ steps.plan.outputs.retained-count }}
  target-count:
    description: Number of target builds that remain.
    value: ${{ steps.plan.outputs.target-count }}
  cohort-count:
    description: Number of cohort jobs that remain after pruning.
    value: ${{ steps.plan.outputs.cohort-count }}
runs:
  using: composite
  steps:
    - name: Resolve the pinned toolchain
      id: toolchain
      shell: bash
      # The workspace manifest's packageManager field is the single pnpm pin;
      # the release integrity suffix, when present, is not part of the version.
      run: |
        manifest="$GITHUB_ACTION_PATH/../../package.json"
        node_version_file="$GITHUB_ACTION_PATH/../../.node-version"
        version="$(sed -n 's/.*"packageManager": *"pnpm@\([^+"]*\).*/\1/p' "$manifest")"
        if [ -z "$version" ]; then
          echo "::error::package.json declares no pnpm packageManager pin"
          exit 1
        fi
        if [ ! -r "$node_version_file" ]; then
          echo "::error::.node-version is not readable"
          exit 1
        fi
        node_version="$(tr -d '\r\n' < "$node_version_file")"
        if [ -z "$node_version" ]; then
          echo "::error::.node-version declares no Node version"
          exit 1
        fi
        echo "pnpm-version=$version" | tee -a "$GITHUB_OUTPUT"
        echo "node-version=$node_version" | tee -a "$GITHUB_OUTPUT"

    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: ${{ steps.toolchain.outputs.pnpm-version }}
        # Point pnpm/action-setup's manifest lookup at this action's own
        # manifest, not the caller's checkout, whose pinned pnpm would
        # otherwise conflict with `version`. Parity between this pin and the
        # workspace manifest is enforced by scripts/action-tool-parity.test.ts.
        package_json_file: ${{ github.action_path }}/../../package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.toolchain.outputs.node-version }}

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: pnpm install --filter @cupboard/action... --prod --frozen-lockfile

    - name: Plan publication
      id: plan
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
        URL: ${{ inputs.url }}
        CUPBOARD_PATH: ${{ inputs.cupboard-path }}
        ROOT_PREFIX: ${{ inputs.root-prefix }}
        CACHE: ${{ inputs.cache }}
        TTL: ${{ inputs.ttl }}
        READ_USER: ${{ inputs.read-user }}
        READ_PASSWORD: ${{ inputs.read-password }}
        AUDIENCE: ${{ inputs.audience }}
        PLAN_FILE: ${{ inputs.plan-file }}
        OPTIMISE: ${{ inputs.optimise }}
        ENABLE_PACKING: ${{ inputs.enable-packing }}
        PACK_CAPACITY: ${{ inputs.pack-capacity }}
        STORE: ${{ inputs.store }}
        REQUIRE_PROVENANCE: ${{ inputs.require-provenance }}
      run: |
        args=(plan
          --targets "$TARGETS"
          --url "$URL"
          --cupboard-path "$CUPBOARD_PATH"
          --root-prefix "$ROOT_PREFIX"
          --cache "$CACHE"
          --ttl "$TTL"
          --read-user "$READ_USER"
          --read-password "$READ_PASSWORD"
          --audience "$AUDIENCE"
          --plan-file "$PLAN_FILE"
          --optimise "$OPTIMISE"
          --enable-packing "$ENABLE_PACKING"
          --store "$STORE")
        args+=(--require-provenance "$REQUIRE_PROVENANCE")
        if [ -n "$PACK_CAPACITY" ]; then
          args+=(--pack-capacity "$PACK_CAPACITY")
        fi
        node --experimental-transform-types \
          --disable-warning=ExperimentalWarning \
          "$GITHUB_ACTION_PATH/../src/main.ts" "${args[@]}"
