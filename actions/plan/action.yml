name: Plan cupboard flake publication
description:
  Evaluates the target manifest, groups the targets into cohorts, and writes the
  matrix for the cohort jobs. Unless require-provenance is true, it also sets
  the roots of targets that the cache already has, and leaves those targets out
  of the matrix.
inputs:
  targets:
    description: Target manifest to plan, as JSON.
    required: true
  url:
    description: Tenant URL or cache URL to publish to.
    required: true
  cupboard-path:
    description: Path to the cupboard executable that actions/setup installed.
    required: true
  root-prefix:
    description:
      Start of each target's retention root name. The target's rootSuffix
      follows it.
    required: true
  cache:
    description:
      Named cache to check and publish to. Leave empty for the default cache.
    required: false
  ttl:
    description: TTL for the root of a target that the cache already has.
    required: false
  permanent:
    description:
      Keep the root of a target that the cache already has permanently.
    required: false
    default: 'false'
  read-user:
    description: User name of a read credential for a private destination cache.
    required: false
  read-password:
    description: Password of a read credential for a private destination cache.
    required: false
  audience:
    description: Audience of the GitHub OIDC token. Defaults to url.
    required: false
  plan-file:
    description: Where to write the full plan as JSON.
    required: false
  optimise:
    description:
      When true, check the cache and the derivation graph to decide which
      targets need a job. When false, give every cohort a job without these
      checks.
    required: false
    default: 'true'
  enable-packing:
    description:
      Pack cohorts into as few jobs as fit within pack-capacity, using the
      measured NAR sizes of their closures. Off by default. A cohort without a
      measurement is not packed.
    required: false
    default: 'false'
  pack-capacity:
    description:
      Disk space in bytes that each packed job can use. Required when
      enable-packing is true.
    required: false
  store:
    description:
      ssh-ng:// URI of the remote store that the cohort jobs build in. Packing
      measures sizes in this store, or in the runner's store when this input is
      empty. With a remote store, every output path must be known during
      planning, so floating content-addressed outputs must be built on the
      runner instead.
    required: false
  require-provenance:
    description:
      Keep targets that the cache already has in the matrix, so the cohort jobs
      can build and attest every published target.
    required: false
    default: 'false'
outputs:
  plan-file:
    description: Path to the plan, which the cohort jobs read.
    value: ${{ steps.plan.outputs.plan-file }}
  plan-artifact-name:
    description: Unique artifact name for passing this plan to the cohort jobs.
    value: ${{ steps.plan.outputs.plan-artifact-name }}
  target-matrix:
    description: JSON matrix with one entry for each target.
    value: ${{ steps.plan.outputs.target-matrix }}
  cohort-matrix:
    description:
      JSON matrix with one entry for each cohort job, after the plan has removed
      cohorts with nothing to build.
    value: ${{ steps.plan.outputs.cohort-matrix }}
  retained-count:
    description: Number of targets whose roots the plan set without a build.
    value: ${{ steps.plan.outputs.retained-count }}
  target-count:
    description: Number of targets that still need a build.
    value: ${{ steps.plan.outputs.target-count }}
  cohort-count:
    description: Number of cohort jobs in cohort-matrix.
    value: ${{ steps.plan.outputs.cohort-count }}
runs:
  using: composite
  steps:
    - name: Resolve the pinned toolchain
      id: toolchain
      shell: bash
      # The workspace manifest's packageManager field is the single pnpm pin;
      # the release integrity suffix, when present, is not part of the version.
      run: |
        manifest="$GITHUB_ACTION_PATH/../../package.json"
        node_version_file="$GITHUB_ACTION_PATH/../../.node-version"
        version="$(sed -n 's/.*"packageManager": *"pnpm@\([^+"]*\).*/\1/p' "$manifest")"
        if [ -z "$version" ]; then
          echo "::error::package.json declares no pnpm packageManager pin"
          exit 1
        fi
        if [ ! -r "$node_version_file" ]; then
          echo "::error::.node-version is not readable"
          exit 1
        fi
        node_version="$(tr -d '\r\n' < "$node_version_file")"
        if [ -z "$node_version" ]; then
          echo "::error::.node-version declares no Node version"
          exit 1
        fi
        echo "pnpm-version=$version" | tee -a "$GITHUB_OUTPUT"
        echo "node-version=$node_version" | tee -a "$GITHUB_OUTPUT"

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ steps.toolchain.outputs.pnpm-version }}
        # Point pnpm/action-setup's manifest lookup at this action's own
        # manifest, not the caller's checkout, whose pinned pnpm would
        # otherwise conflict with `version`. Parity between this pin and the
        # workspace manifest is enforced by scripts/action-tool-parity.test.ts.
        package_json_file: ${{ github.action_path }}/../../package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.toolchain.outputs.node-version }}

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: pnpm install --filter @cupboard/action... --prod --frozen-lockfile

    - name: Plan publication
      id: plan
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
        URL: ${{ inputs.url }}
        CUPBOARD_PATH: ${{ inputs.cupboard-path }}
        ROOT_PREFIX: ${{ inputs.root-prefix }}
        CACHE: ${{ inputs.cache }}
        TTL: ${{ inputs.ttl }}
        PERMANENT: ${{ inputs.permanent }}
        READ_USER: ${{ inputs.read-user }}
        READ_PASSWORD: ${{ inputs.read-password }}
        AUDIENCE: ${{ inputs.audience }}
        PLAN_FILE: ${{ inputs.plan-file }}
        OPTIMISE: ${{ inputs.optimise }}
        ENABLE_PACKING: ${{ inputs.enable-packing }}
        PACK_CAPACITY: ${{ inputs.pack-capacity }}
        STORE: ${{ inputs.store }}
        REQUIRE_PROVENANCE: ${{ inputs.require-provenance }}
      run: |
        args=(plan
          --targets "$TARGETS"
          --url "$URL"
          --cupboard-path "$CUPBOARD_PATH"
          --root-prefix "$ROOT_PREFIX"
          --cache "$CACHE"
          --ttl "$TTL"
          --permanent "$PERMANENT"
          --read-user "$READ_USER"
          --read-password "$READ_PASSWORD"
          --audience "$AUDIENCE"
          --plan-file "$PLAN_FILE"
          --optimise "$OPTIMISE"
          --enable-packing "$ENABLE_PACKING"
          --store "$STORE")
        args+=(--require-provenance "$REQUIRE_PROVENANCE")
        if [ -n "$PACK_CAPACITY" ]; then
          args+=(--pack-capacity "$PACK_CAPACITY")
        fi
        node --experimental-transform-types \
          --disable-warning=ExperimentalWarning \
          "$GITHUB_ACTION_PATH/../src/main.ts" "${args[@]}"
