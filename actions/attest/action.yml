name: Attest cupboard store paths
description:
  Produce a Sigstore build-provenance bundle whose in-toto subjects are the NAR
  hashes of the given Nix store paths, ready to attach with the push action.
inputs:
  paths:
    description:
      Newline-delimited local Nix store paths, derivations, or installables to
      attest.
    required: true
  checksums-file:
    description:
      Where to write the generated subject checksums file. Defaults to a
      runner-local path under RUNNER_TEMP.
    required: false
  github-token:
    description: GitHub token used by the attestation step.
    required: false
outputs:
  bundle-path:
    description: Path to the generated Sigstore attestation bundle.
    value: ${{ steps.attest.outputs.bundle-path }}
  checksums-file:
    description: Path to the generated subject checksums file.
    value: ${{ steps.subjects.outputs.checksums-file }}
  subject-count:
    description: Number of store paths recorded as attestation subjects.
    value: ${{ steps.subjects.outputs.subject-count }}
runs:
  using: composite
  steps:
    - name: Resolve the pinned pnpm version
      id: pnpm
      shell: bash
      env:
        # renovate: datasource=npm depName=pnpm
        PNPM_VERSION: '11.10.0'
      run: echo "version=${PNPM_VERSION}" | tee -a "${GITHUB_OUTPUT}"

    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: ${{ steps.pnpm.outputs.version }}
        # pnpm/action-setup cross-checks a package.json and fails the run on a
        # version mismatch. Point it at this action's own manifest, not the
        # caller's checkout, whose pinned pnpm would otherwise break us.
        package_json_file: ${{ github.action_path }}/../../package.json

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24.18.0

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: pnpm install --filter @cupboard/action... --prod --frozen-lockfile

    - name: Resolve attestation subjects
      id: subjects
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_CHECKSUMS_FILE: ${{ inputs.checksums-file }}
      run: >
        node --experimental-transform-types
        --disable-warning=ExperimentalWarning
        "$GITHUB_ACTION_PATH/../src/main.ts" attest

    - name: Attest subjects
      id: attest
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
      with:
        subject-checksums: ${{ steps.subjects.outputs.checksums-file }}
        github-token: ${{ inputs.github-token || github.token }}
