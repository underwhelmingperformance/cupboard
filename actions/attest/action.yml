name: Attest cupboard store paths
description:
  Signs SLSA provenance for paths built on the runner in this run. Before
  signing, the action checks each path and NAR hash against the destination
  narinfo. Build provenance comes from the current job's receipt.
inputs:
  inline-bundles:
    description:
      Control how bundle lists are returned. `true` writes inline bundle outputs
      as well as files. `false` returns files without inline bundle outputs. Use
      `false` for large bundle lists.
    required: false
    default: 'true'
  receipt-file:
    description:
      Receipt written earlier in the job by actions/build-paths or by a cohort
      build in the flake publish workflow.
    required: true
  checksums-file:
    description:
      Where to write the checksums of every accepted receipt path. Defaults to a
      file in a unique directory under RUNNER_TEMP.
    required: false
  built-checksums-file:
    description:
      Where to write the checksums of the paths that the job built. The
      build-provenance attestations cover these paths. Defaults to a file next
      to the checksums file.
    required: false
  predicate-file:
    description:
      Where to write the SCAI reproduction report. Empty when no local
      verification rebuild succeeded. Defaults to a file next to the checksums
      file.
    required: false
  url:
    description:
      Tenant URL of the destination. Before signing, the action checks every
      path against the narinfo in this tenant's cache.
    required: true
  cache:
    description: Named destination cache. Leave empty to use the default cache.
    required: false
  cupboard-path:
    description: Path to the cupboard executable when OIDC read access is used.
    required: false
  read-session-target:
    description:
      Pass the read-session-target output from actions/setup for private OIDC
      reads.
    required: false
  audience:
    description: Audience of the GitHub OIDC token. Defaults to the tenant URL.
    required: false
  read-session-caches:
    description:
      Pass the read-session-caches output from actions/setup, a JSON array of
      additional cache URLs.
    required: false
  read-session-view:
    description: Pass the read-session-view output from actions/setup.
    required: false
  read-user:
    description: User name of a read credential for a private destination cache.
    required: false
  read-password:
    description: Password of a read credential for a private destination cache.
    required: false
  github-token:
    description:
      GitHub token that the action uses to upload bundles to the repository's
      attestation store when upload-to-github is true.
    required: false
  signing-profile:
    description:
      How to sign each bundle. sigstore-default uses the Sigstore instance that
      GitHub chooses for the repository. tsa-only signs with the public-good
      Sigstore instance and adds an RFC 3161 timestamp, without a Rekor entry.
      rekor-and-tsa signs with the public-good instance and adds both a
      timestamp and a Rekor entry. Defaults to tsa-only for a private
      destination cache, and to sigstore-default for a public one.
    required: false
  upload-to-github:
    description:
      When true, also store each bundle in the repository's attestation store on
      GitHub, where anyone who can read the repository can read it. A bundle's
      subjects are NAR hashes, and the attestation store is append-only.
      Uploading a bundle therefore permanently reveals that each of its paths
      exists, and anyone with a copy of a path can recognise it. Defaults to
      false for a private destination cache, and to true for a public one.
    required: false
  subject-grouping:
    description:
      Select how many subjects each statement covers. run signs one statement
      for each batch of up to 1024 subjects, so each bundle contains up to 1024
      subjects. individual signs a separate statement for each subject, so each
      bundle contains one subject. Individual statements do not attest to the
      complete run. Defaults to individual when the destination cache requires
      authentication, and to run otherwise.
    required: false
outputs:
  bundle-path:
    description:
      Paths of the build-provenance bundles, one per line. Empty when the job
      built none of the paths in the receipt. Available when inline-bundles is
      true; bundles-file always lists all generated bundles.
    value: ${{ steps.attest.outputs.bundle-path }}
  origin-bundle-path:
    description:
      Paths of the SCAI attribute-report bundles, one per line. Empty when the
      report has no assertions. The action signs no build-origin statement.
    value: ${{ steps.attest.outputs.origin-bundle-path }}
  bundles:
    description:
      Paths to the generated bundles, one per line. Available when
      inline-bundles is true. Empty when the action signed no statements. Use
      bundles-file for publication workflows.
    value: ${{ steps.attest.outputs.bundles }}
  bundles-file:
    description:
      File containing the generated bundle paths, one per line. Pass this file
      to actions/attest-attach.
    value: ${{ steps.attest.outputs.bundles-file }}
  checksums-file:
    description:
      Path to the checksums of the receipt paths selected for signing. Pass this
      file to actions/attest-attach with the generated bundles.
    value: ${{ steps.attest.outputs.checksums-file }}
  subject-count:
    description: Number of accepted receipt paths.
    value: ${{ steps.subjects.outputs.subject-count }}
  built-checksums-file:
    description:
      Path to the checksums of the accepted paths that the job built. The
      build-provenance attestations cover these paths.
    value: ${{ steps.subjects.outputs.built-checksums-file }}
  built-subject-count:
    description: Number of accepted paths that the job built.
    value: ${{ steps.subjects.outputs.built-subject-count }}
runs:
  using: composite
  steps:
    - name: Resolve the pinned toolchain
      id: toolchain
      shell: bash
      # The workspace manifest's packageManager field is the single pnpm pin;
      # the release integrity suffix, when present, is not part of the version.
      run: bash "$GITHUB_ACTION_PATH/../bootstrap.sh" toolchain

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ steps.toolchain.outputs.pnpm-version }}
        # Point pnpm/action-setup's manifest lookup at this action's own
        # manifest, not the caller's checkout, whose pinned pnpm would
        # otherwise conflict with `version`. Parity between this pin and the
        # workspace manifest is enforced by scripts/action-tool-parity.test.ts.
        package_json_file: ${{ github.action_path }}/../../package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.toolchain.outputs.node-version }}

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: bash "$GITHUB_ACTION_PATH/../bootstrap.sh" install

    - name: Resolve attestation subjects
      id: subjects
      shell: bash
      env:
        RECEIPT_FILE: ${{ inputs.receipt-file }}
        CHECKSUMS_FILE: ${{ inputs.checksums-file }}
        BUILT_CHECKSUMS_FILE: ${{ inputs.built-checksums-file }}
        PREDICATE_FILE: ${{ inputs.predicate-file }}
        URL: ${{ inputs.url }}
        CACHE: ${{ inputs.cache }}
        CUPBOARD_PATH: ${{ inputs.cupboard-path }}
        READ_SESSION_TARGET: ${{ inputs.read-session-target }}
        READ_SESSION_AUDIENCE: ${{ inputs.audience }}
        READ_SESSION_CACHES: ${{ inputs.read-session-caches }}
        READ_SESSION_VIEW: ${{ inputs.read-session-view }}
        READ_USER: ${{ inputs.read-user }}
        READ_PASSWORD: ${{ inputs.read-password }}
      run: |
        source "$GITHUB_ACTION_PATH/../read-session.sh"
        run_with_read_session \
          "$CUPBOARD_PATH" "$READ_SESSION_TARGET" "$READ_SESSION_VIEW" -- \
          node --experimental-transform-types \
            --disable-warning=ExperimentalWarning \
            "$GITHUB_ACTION_PATH/../src/main.ts" attest \
            --receipt-file "$RECEIPT_FILE" \
            --checksums-file "$CHECKSUMS_FILE" \
            --built-checksums-file "$BUILT_CHECKSUMS_FILE" \
            --predicate-file "$PREDICATE_FILE" \
            --url "$URL" \
            --cache "$CACHE" \
            --read-user "$READ_USER" \
            --read-password "$READ_PASSWORD"

    - name: Sign the attestation statements
      id: attest
      if: ${{ steps.subjects.outputs.subject-count != '0' }}
      shell: bash
      env:
        RECEIPT_FILE: ${{ inputs.receipt-file }}
        CHECKSUMS_FILE: ${{ steps.subjects.outputs.checksums-file }}
        BUILT_CHECKSUMS_FILE: ${{ steps.subjects.outputs.built-checksums-file }}
        DESTINATION_ACCESS: ${{ steps.subjects.outputs.destination-access }}
        SIGNING_PROFILE: ${{ inputs.signing-profile }}
        UPLOAD_TO_GITHUB: ${{ inputs.upload-to-github }}
        SUBJECT_GROUPING: ${{ inputs.subject-grouping }}
        INLINE_BUNDLES: ${{ inputs.inline-bundles }}
        GH_TOKEN: ${{ inputs.github-token || github.token }}
      run: |
        output_directory="$(mktemp -d "$RUNNER_TEMP/cupboard-attest.XXXXXX")"
        node --experimental-transform-types \
          --disable-warning=ExperimentalWarning \
          "$GITHUB_ACTION_PATH/../src/main.ts" attest-sign \
          --checksums-file "$CHECKSUMS_FILE" \
          --built-checksums-file "$BUILT_CHECKSUMS_FILE" \
          --receipt-file "$RECEIPT_FILE" \
          --destination-access "$DESTINATION_ACCESS" \
          --signing-profile "$SIGNING_PROFILE" \
          --upload-to-github "$UPLOAD_TO_GITHUB" \
          --subject-grouping "$SUBJECT_GROUPING" \
          --inline-bundles "$INLINE_BUNDLES" \
          --output-directory "$output_directory" \
          --bundles-file "$output_directory/bundles.txt" \
          --github-token "$GH_TOKEN"
