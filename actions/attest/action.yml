name: Attest cupboard store paths
description:
  Produce a Sigstore build-provenance bundle whose in-toto subjects are the NAR
  hashes of the given Nix store paths, ready to attach with the push action.
  Only paths this machine built become subjects; a substituted path is skipped
  with a warning, since the run cannot truthfully claim its provenance.
inputs:
  paths:
    description:
      Newline-delimited local Nix store paths, derivations, or installables to
      attest. Paths the local store did not build are skipped.
    required: true
  checksums-file:
    description:
      Where to write the generated subject checksums file. Defaults to a
      runner-local path under RUNNER_TEMP.
    required: false
  github-token:
    description: GitHub token used by the attestation step.
    required: false
outputs:
  bundle-path:
    description:
      Path to the generated Sigstore attestation bundle. Empty when no given
      path was built by this machine, in which case nothing is signed.
    value: ${{ steps.attest.outputs.bundle-path }}
  checksums-file:
    description: Path to the generated subject checksums file.
    value: ${{ steps.subjects.outputs.checksums-file }}
  subject-count:
    description:
      Number of store paths recorded as attestation subjects. Counts only the
      paths this machine built.
    value: ${{ steps.subjects.outputs.subject-count }}
runs:
  using: composite
  steps:
    - name: Resolve the pinned pnpm version
      id: pnpm
      shell: bash
      env:
        # renovate: datasource=npm depName=pnpm
        PNPM_VERSION: '11.13.1'
      run: echo "version=${PNPM_VERSION}" | tee -a "${GITHUB_OUTPUT}"

    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: ${{ steps.pnpm.outputs.version }}
        # pnpm/action-setup cross-checks a package.json and fails the run on a
        # version mismatch. Point it at this action's own manifest, not the
        # caller's checkout, whose pinned pnpm would otherwise break us.
        package_json_file: ${{ github.action_path }}/../../package.json

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24.18.0

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: pnpm install --filter @cupboard/action... --prod --frozen-lockfile

    - name: Resolve attestation subjects
      id: subjects
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        CHECKSUMS_FILE: ${{ inputs.checksums-file }}
      run: |
        node --experimental-transform-types \
          --disable-warning=ExperimentalWarning \
          "$GITHUB_ACTION_PATH/../src/main.ts" attest \
          --paths "$PATHS" \
          --checksums-file "$CHECKSUMS_FILE"

    # A run with no locally built path has nothing it can truthfully attest,
    # and the provenance action rejects an empty subject list.
    - name: Attest subjects
      id: attest
      if: ${{ steps.subjects.outputs.subject-count != '0' }}
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
      with:
        subject-checksums: ${{ steps.subjects.outputs.checksums-file }}
        github-token: ${{ inputs.github-token || github.token }}
