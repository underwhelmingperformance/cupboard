name: Attest cupboard store paths
description:
  Produce a Sigstore build-provenance bundle whose in-toto subjects are the NAR
  hashes of the given Nix store paths, ready to attach with the push action.
inputs:
  paths:
    description:
      Newline-delimited local Nix store paths, derivations, or installables to
      attest.
    required: true
  checksums-file:
    description:
      Where to write the generated subject checksums file. Defaults to a
      runner-local path under RUNNER_TEMP.
    required: false
  github-token:
    description: GitHub token used by the attestation step.
    required: false
outputs:
  bundle-path:
    description: Path to the generated Sigstore attestation bundle.
    value: ${{ steps.attest.outputs.bundle-path }}
  checksums-file:
    description: Path to the generated subject checksums file.
    value: ${{ steps.subjects.outputs.checksums-file }}
  subject-count:
    description: Number of store paths recorded as attestation subjects.
    value: ${{ steps.subjects.outputs.subject-count }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24.17.0

    - name: Resolve attestation subjects
      id: subjects
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_CHECKSUMS_FILE: ${{ inputs.checksums-file }}
      run: >
        node --experimental-strip-types --disable-warning=ExperimentalWarning
        "$GITHUB_ACTION_PATH/../lib/cupboard-action.ts" attest

    - name: Attest subjects
      id: attest
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
      with:
        subject-checksums: ${{ steps.subjects.outputs.checksums-file }}
        github-token: ${{ inputs.github-token || github.token }}
