name: Attest cupboard store paths
description:
  Produce a Sigstore build-provenance bundle whose in-toto subjects are the NAR
  hashes established by a current-run build receipt, ready to attach with the
  push action. Every subject is checked against the destination cache's live,
  committed narinfo before signing; the build store need no longer exist.
inputs:
  receipt-file:
    description: Current-run receipt produced by a cupboard build action.
    required: true
  checksums-file:
    description:
      Where to write the generated subject checksums file. Defaults to a
      runner-local path under RUNNER_TEMP.
    required: false
  url:
    description:
      Destination cupboard tenant URL whose committed narinfos verify every
      subject before signing.
    required: true
  cache:
    description: Named destination cache. Empty selects the default cache.
    required: false
  read-user:
    description: Basic-auth username for a private destination cache.
    required: false
  read-password:
    description: Basic-auth password for a private destination cache.
    required: false
  github-token:
    description: GitHub token used by the attestation step.
    required: false
outputs:
  bundle-path:
    description:
      Path to the generated Sigstore attestation bundle. Empty when the receipt
      establishes no provenance subjects, in which case nothing is signed.
    value: ${{ steps.attest.outputs.bundle-path }}
  checksums-file:
    description: Path to the generated subject checksums file.
    value: ${{ steps.subjects.outputs.checksums-file }}
  subject-count:
    description:
      Number of store paths whose provenance the receipt establishes and the
      action accepts as attestation subjects.
    value: ${{ steps.subjects.outputs.subject-count }}
runs:
  using: composite
  steps:
    - name: Resolve the pinned toolchain
      id: toolchain
      shell: bash
      # The workspace manifest's packageManager field is the single pnpm pin;
      # the release integrity suffix, when present, is not part of the version.
      run: |
        manifest="$GITHUB_ACTION_PATH/../../package.json"
        node_version_file="$GITHUB_ACTION_PATH/../../.node-version"
        version="$(sed -n 's/.*"packageManager": *"pnpm@\([^+"]*\).*/\1/p' "$manifest")"
        if [ -z "$version" ]; then
          echo "::error::package.json declares no pnpm packageManager pin"
          exit 1
        fi
        if [ ! -r "$node_version_file" ]; then
          echo "::error::.node-version is not readable"
          exit 1
        fi
        node_version="$(tr -d '\r\n' < "$node_version_file")"
        if [ -z "$node_version" ]; then
          echo "::error::.node-version declares no Node version"
          exit 1
        fi
        echo "pnpm-version=$version" | tee -a "$GITHUB_OUTPUT"
        echo "node-version=$node_version" | tee -a "$GITHUB_OUTPUT"

    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: ${{ steps.toolchain.outputs.pnpm-version }}
        # Point pnpm/action-setup's manifest lookup at this action's own
        # manifest, not the caller's checkout, whose pinned pnpm would
        # otherwise conflict with `version`. Parity between this pin and the
        # workspace manifest is enforced by scripts/action-tool-parity.test.ts.
        package_json_file: ${{ github.action_path }}/../../package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.toolchain.outputs.node-version }}

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: pnpm install --filter @cupboard/action... --prod --frozen-lockfile

    - name: Resolve attestation subjects
      id: subjects
      shell: bash
      env:
        RECEIPT_FILE: ${{ inputs.receipt-file }}
        CHECKSUMS_FILE: ${{ inputs.checksums-file }}
        URL: ${{ inputs.url }}
        CACHE: ${{ inputs.cache }}
        READ_USER: ${{ inputs.read-user }}
        READ_PASSWORD: ${{ inputs.read-password }}
      run: |
        node --experimental-transform-types \
          --disable-warning=ExperimentalWarning \
          "$GITHUB_ACTION_PATH/../src/main.ts" attest \
          --receipt-file "$RECEIPT_FILE" \
          --checksums-file "$CHECKSUMS_FILE" \
          --url "$URL" \
          --cache "$CACHE" \
          --read-user "$READ_USER" \
          --read-password "$READ_PASSWORD"

    # A receipt with no established provenance subject has nothing this run can
    # truthfully attest, and the provenance action rejects an empty subject list.
    - name: Attest subjects
      id: attest
      if: ${{ steps.subjects.outputs.subject-count != '0' }}
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
      with:
        subject-checksums: ${{ steps.subjects.outputs.checksums-file }}
        github-token: ${{ inputs.github-token || github.token }}
