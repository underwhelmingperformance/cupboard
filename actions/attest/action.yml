name: Attest cupboard store paths
description:
  Produce two Sigstore bundles over the NAR hashes a current-run build receipt
  records, ready to attach with the push action. GitHub's SLSA build provenance
  covers the paths the run built. A cupboard build-origin statement covers every
  path the run published and records where each one came from. Every subject is
  checked against the destination cache's live, committed narinfo before
  signing; the build store need no longer exist.
inputs:
  receipt-file:
    description: Current-run receipt produced by a cupboard build action.
    required: true
  checksums-file:
    description:
      Where to write the checksums of every path the receipt describes. Defaults
      to a runner-local path under RUNNER_TEMP.
    required: false
  built-checksums-file:
    description:
      Where to write the checksums of the paths the run built. They are the
      subjects of the build-provenance bundle. Defaults to a file beside the
      checksums file.
    required: false
  predicate-file:
    description:
      Where to write the build-origin predicate signed into the second bundle.
      Defaults to a file beside the checksums file.
    required: false
  url:
    description:
      Destination cupboard tenant URL whose committed narinfos verify every
      subject before signing.
    required: true
  cache:
    description: Named destination cache. Empty selects the default cache.
    required: false
  read-user:
    description: Basic-auth username for a private destination cache.
    required: false
  read-password:
    description: Basic-auth password for a private destination cache.
    required: false
  github-token:
    description: GitHub token used to record the attestations on the repository.
    required: false
outputs:
  bundle-path:
    description:
      Path to the generated SLSA build-provenance bundle. Empty when the receipt
      records no path this run built, in which case the action signs no
      provenance.
    value: ${{ steps.attest.outputs.bundle-path }}
  origin-bundle-path:
    description:
      Path to the generated build-origin bundle. Empty when the receipt records
      no origin for the subjects this run signs, which is the case for a version
      2 receipt and for a run with no eligible subject.
    value: ${{ steps.attest.outputs.origin-bundle-path }}
  checksums-file:
    description:
      Path to the checksums of every path the receipt describes. They are the
      subjects of the build-origin bundle.
    value: ${{ steps.subjects.outputs.checksums-file }}
  subject-count:
    description:
      Number of store paths the receipt describes and the action accepts as
      attestation subjects.
    value: ${{ steps.subjects.outputs.subject-count }}
  built-checksums-file:
    description:
      Path to the checksums of the paths the run built. They are the subjects of
      the build-provenance bundle.
    value: ${{ steps.subjects.outputs.built-checksums-file }}
  built-subject-count:
    description:
      Number of the accepted subjects whose receipt entry records that this run
      built the path.
    value: ${{ steps.subjects.outputs.built-subject-count }}
runs:
  using: composite
  steps:
    - name: Resolve the pinned toolchain
      id: toolchain
      shell: bash
      # The workspace manifest's packageManager field is the single pnpm pin;
      # the release integrity suffix, when present, is not part of the version.
      run: |
        manifest="$GITHUB_ACTION_PATH/../../package.json"
        node_version_file="$GITHUB_ACTION_PATH/../../.node-version"
        version="$(sed -n 's/.*"packageManager": *"pnpm@\([^+"]*\).*/\1/p' "$manifest")"
        if [ -z "$version" ]; then
          echo "::error::package.json declares no pnpm packageManager pin"
          exit 1
        fi
        if [ ! -r "$node_version_file" ]; then
          echo "::error::.node-version is not readable"
          exit 1
        fi
        node_version="$(tr -d '\r\n' < "$node_version_file")"
        if [ -z "$node_version" ]; then
          echo "::error::.node-version declares no Node version"
          exit 1
        fi
        echo "pnpm-version=$version" | tee -a "$GITHUB_OUTPUT"
        echo "node-version=$node_version" | tee -a "$GITHUB_OUTPUT"

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: ${{ steps.toolchain.outputs.pnpm-version }}
        # Point pnpm/action-setup's manifest lookup at this action's own
        # manifest, not the caller's checkout, whose pinned pnpm would
        # otherwise conflict with `version`. Parity between this pin and the
        # workspace manifest is enforced by scripts/action-tool-parity.test.ts.
        package_json_file: ${{ github.action_path }}/../../package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.toolchain.outputs.node-version }}

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: pnpm install --filter @cupboard/action... --prod --frozen-lockfile

    - name: Resolve attestation subjects
      id: subjects
      shell: bash
      env:
        RECEIPT_FILE: ${{ inputs.receipt-file }}
        CHECKSUMS_FILE: ${{ inputs.checksums-file }}
        BUILT_CHECKSUMS_FILE: ${{ inputs.built-checksums-file }}
        PREDICATE_FILE: ${{ inputs.predicate-file }}
        URL: ${{ inputs.url }}
        CACHE: ${{ inputs.cache }}
        READ_USER: ${{ inputs.read-user }}
        READ_PASSWORD: ${{ inputs.read-password }}
      run: |
        node --experimental-transform-types \
          --disable-warning=ExperimentalWarning \
          "$GITHUB_ACTION_PATH/../src/main.ts" attest \
          --receipt-file "$RECEIPT_FILE" \
          --checksums-file "$CHECKSUMS_FILE" \
          --built-checksums-file "$BUILT_CHECKSUMS_FILE" \
          --predicate-file "$PREDICATE_FILE" \
          --url "$URL" \
          --cache "$CACHE" \
          --read-user "$READ_USER" \
          --read-password "$READ_PASSWORD"

    # The two statements cover different subjects. GitHub's SLSA build
    # provenance claims that this workflow produced its subjects, so it covers
    # the paths the run built. Cupboard's build-origin statement records where
    # each published path came from, which only the receipt knows.
    #
    # This step signs them itself so that a failed signing attempt can be made
    # again. A workflow cannot retry a `uses:` step, and neither
    # actions/attest-build-provenance nor actions/attest takes a retry input, so
    # a Sigstore witness that stops answering once the signature is made would
    # fail the whole publication.
    - name: Sign the attestation statements
      id: attest
      if: ${{ steps.subjects.outputs.subject-count != '0' }}
      shell: bash
      env:
        CHECKSUMS_FILE: ${{ steps.subjects.outputs.checksums-file }}
        BUILT_CHECKSUMS_FILE: ${{ steps.subjects.outputs.built-checksums-file }}
        PREDICATE_FILE: ${{ steps.subjects.outputs.predicate-file }}
        PREDICATE_TYPE: ${{ steps.subjects.outputs.predicate-type }}
        GH_TOKEN: ${{ inputs.github-token || github.token }}
      run: |
        node --experimental-transform-types \
          --disable-warning=ExperimentalWarning \
          "$GITHUB_ACTION_PATH/../src/main.ts" attest-sign \
          --checksums-file "$CHECKSUMS_FILE" \
          --built-checksums-file "$BUILT_CHECKSUMS_FILE" \
          --predicate-file "$PREDICATE_FILE" \
          --predicate-type "$PREDICATE_TYPE" \
          --github-token "$GH_TOKEN"
