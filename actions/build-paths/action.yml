name: Build cupboard store paths
description:
  Realises Nix installables and records how their outputs were obtained.
inputs:
  inline-paths:
    description:
      Control how path lists are returned. `true` writes inline path outputs as
      well as files. `false` returns files and counts without inline path
      outputs. Use `false` for large path lists.
    required: false
    default: 'true'
  publication-url:
    description: >-
      Destination tenant or cache URL. Required with `substituter: leave` so
      paths from the destination and its tenant reuse views remain selected for
      publication.
    required: false
  cupboard-path:
    description: Path to the cupboard executable when OIDC read access is used.
    required: false
  read-session-target:
    description:
      Pass the read-session-target output from actions/setup for private OIDC
      reads.
    required: false
  audience:
    description: Audience of the GitHub OIDC token. Defaults to the tenant URL.
    required: false
  read-session-caches:
    description:
      Pass the read-session-caches output from actions/setup, a JSON array of
      additional cache URLs.
    required: false
  read-session-view:
    description: Pass the read-session-view output from actions/setup.
    required: false
  installables:
    description: Nix installables to build, one per line.
    required: false
  installables-file:
    description:
      File that lists the Nix installables to build, one per line. Use it for a
      long generated list, because action inputs have a size limit.
    required: false
  keep-going:
    description: Keep building the other installables after one of them fails.
    required: false
    default: 'false'
  max-jobs:
    description:
      Maximum number of local build jobs. Leave empty to use the value from the
      Nix configuration.
    required: false
  allow-failure:
    description: Let the step succeed even if all five build attempts fail.
    required: false
    default: 'false'
  build:
    description:
      Control when to build the requested outputs. Defaults to `missing` when
      `require-provenance` is not enabled. `missing` uses an output from the
      store or a substituter when one is available, and builds it otherwise.
      `rebuild` builds each output again in the selected Nix store, even if it
      is already available. Nix may still fetch dependencies from substituters.
    required: false
  require-provenance:
    description: >-
      Deprecated. `true` selects `build: rebuild`; `false` uses the build mode.
      `true` conflicts with an explicit `build: missing`. Remove this input and
      set `build: rebuild` to preserve the execution guarantee.
    required: false
  publish:
    description: >-
      Publication scope: none, outputs, built, or closure. This action cannot
      observe every build intermediate and refuses built before starting work.
      Use the flake publishing workflow for built publication.
    required: false
    default: outputs
  substituter:
    description: >-
      Control whether to publish outputs available from external substituters.
      `copy` selects them for publication. `leave` keeps them upstream if
      consumers can obtain matching NARs for the output and all its runtime
      references under the configured signature policy. Both modes select
      outputs built in this run.
    required: false
    default: copy
outputs:
  paths:
    description:
      Output paths of the installables, one per line. Available when
      inline-paths is true; paths-file always contains the full list.
    value: ${{ steps.build.outputs.paths }}
  built-paths:
    description:
      Output paths with observed runner-local build evidence, one per line.
      Available when inline-paths is true; built-receipt-file always records
      these paths.
    value: ${{ steps.build.outputs.built-paths }}
  publish-paths:
    description:
      Selected output paths to publish under the substituter policy. Available
      when inline-paths is true; publish-paths-file always contains the full
      list.
    value: ${{ steps.build.outputs.publish-paths }}
  paths-count:
    description: Number of realised output paths, including paths left upstream.
    value: ${{ steps.build.outputs.paths-count }}
  publish-paths-count:
    description: Number of selected output paths to publish.
    value: ${{ steps.build.outputs.publish-paths-count }}
  built-paths-count:
    description:
      Number of output paths with observed runner-local build evidence.
    value: ${{ steps.build.outputs.built-paths-count }}
  paths-file:
    description: File that lists the output paths of the installables.
    value: ${{ steps.build.outputs.paths-file }}
  publish-paths-file:
    description: File that lists the selected output paths to publish.
    value: ${{ steps.build.outputs.publish-paths-file }}
  receipt-file:
    description: Path to the receipt for all realised outputs.
    value: ${{ steps.build.outputs.receipt-file }}
  built-receipt-file:
    description:
      Receipt restricted to paths with observed runner-local build evidence.
    value: ${{ steps.build.outputs.built-receipt-file }}
runs:
  using: composite
  steps:
    - name: Resolve the pinned toolchain
      id: toolchain
      shell: bash
      run: |
        manifest="$GITHUB_ACTION_PATH/../../package.json"
        version="$(sed -n 's/.*"packageManager": *"pnpm@\([^+"]*\).*/\1/p' "$manifest")"
        node_version="$(tr -d '\r\n' < "$GITHUB_ACTION_PATH/../../.node-version")"
        test -n "$version" && test -n "$node_version"
        echo "pnpm-version=$version" >> "$GITHUB_OUTPUT"
        echo "node-version=$node_version" >> "$GITHUB_OUTPUT"

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ steps.toolchain.outputs.pnpm-version }}
        package_json_file: ${{ github.action_path }}/../../package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.toolchain.outputs.node-version }}

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: pnpm install --filter @cupboard/action... --prod --frozen-lockfile

    - name: Build installables
      id: build
      shell: bash
      env:
        INSTALLABLES: ${{ inputs.installables }}
        INLINE_PATHS: ${{ inputs.inline-paths }}
        CUPBOARD_PATH: ${{ inputs.cupboard-path }}
        READ_SESSION_TARGET: ${{ inputs.read-session-target }}
        READ_SESSION_AUDIENCE: ${{ inputs.audience }}
        READ_SESSION_CACHES: ${{ inputs.read-session-caches }}
        READ_SESSION_VIEW: ${{ inputs.read-session-view }}
        INSTALLABLES_FILE: ${{ inputs.installables-file }}
        KEEP_GOING: ${{ inputs.keep-going }}
        MAX_JOBS: ${{ inputs.max-jobs }}
        ALLOW_FAILURE: ${{ inputs.allow-failure }}
        BUILD: ${{ inputs.build }}
        REQUIRE_PROVENANCE: ${{ inputs.require-provenance }}
        PUBLISH: ${{ inputs.publish }}
        SUBSTITUTER: ${{ inputs.substituter }}
        PUBLICATION_URL: ${{ inputs.publication-url }}
      run: |
        source "$GITHUB_ACTION_PATH/../read-session.sh"
        run_with_read_session \
          "$CUPBOARD_PATH" "$READ_SESSION_TARGET" "$READ_SESSION_VIEW" -- \
          node --experimental-transform-types \
            --disable-warning=ExperimentalWarning \
            "$GITHUB_ACTION_PATH/../src/main.ts" build \
            --installables "$INSTALLABLES" \
            --inline-paths "$INLINE_PATHS" \
            --installables-file "$INSTALLABLES_FILE" \
            --keep-going "$KEEP_GOING" \
            --max-jobs "$MAX_JOBS" \
            --allow-failure "$ALLOW_FAILURE" \
            --build "$BUILD" \
            --require-provenance "$REQUIRE_PROVENANCE" \
            --publish "$PUBLISH" \
            --substituter "$SUBSTITUTER" \
            --publication-url "$PUBLICATION_URL"
