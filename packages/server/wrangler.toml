# The public control-plane Worker: the bare-host control surface and the tenant
# read/dispatch front. It holds the control signing-key wrapping secret and reaches
# every tenant's `CupboardServer` through an external Durable Object binding into
# the `cupboard-tenant` script (wrangler.tenant.toml), where the class is defined.
# That separation is the isolation: the Durable Object runs in its own script and
# never binds `CONTROL_KEY_WRAP_SECRET`, so it cannot recover the control key.
name = "cupboard"
main = "src/worker.ts"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "CUPBOARD_DO"
class_name = "CupboardServer"
script_name = "cupboard-tenant"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "cupboard-blobs"

# The admission manifest the read/dispatch front consults to resolve `/t/<slug>/`
# without a D1 read or a Durable Object round-trip. Bound only on the control
# Worker; the tenant Durable Object never reads it.
[[kv_namespaces]]
binding = "TENANT_CACHE"
id = "00000000000000000000000000000000"

# Operational bookkeeping for the Worker cron: small, infrequently-written scalars
# like the reaper's demote-scan resume position. Not shared-blob data, so it lives in
# KV rather than the relational schema.
[[kv_namespaces]]
binding = "CRON_STATE"
id = "00000000000000000000000000000001"

[[queues.producers]]
binding = "MAINTENANCE_QUEUE"
queue = "cupboard-maintenance"

[[queues.consumers]]
queue = "cupboard-maintenance"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
max_concurrency = 4
dead_letter_queue = "cupboard-maintenance-dlq"

[[d1_databases]]
binding = "CUPBOARD_DB"
database_name = "cupboard"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle-d1"

[vars]
CUPBOARD_AUTH_ISSUER = "cupboard"
CUPBOARD_AUTH_AUDIENCE = "cupboard"
# The control-plane OAuth audience (the control client id). The base64 AES-256
# key wrapping the control signing key is sensitive: set
# `CONTROL_KEY_WRAP_SECRET` in production with `wrangler secret put`. Tests
# supply their own via the pool/Miniflare bindings.
CUPBOARD_CONTROL_AUDIENCE = ""
# The OIDC issuer and audience (the control client id) trusted for the first-signup
# claim, and the non-secret gates that decide who may claim global admin. The
# single-use claim secret is sensitive: set `CUPBOARD_SIGNUP_SECRET` in
# production with `wrangler secret put`. With neither gate configured the claim
# is refused unless CUPBOARD_LOCAL_DEV relaxes it for local development.
CUPBOARD_SIGNUP_ISSUER = ""
CUPBOARD_SIGNUP_AUDIENCE = ""
CUPBOARD_SIGNUP_SUBJECT = ""
CUPBOARD_LOCAL_DEV = ""
CUPBOARD_OWNER_ISSUER = ""
CUPBOARD_OWNER_SUBJECT = ""
CUPBOARD_OWNER_AUDIENCE = ""
CUPBOARD_COLD_PATH_TTL_SECONDS = ""

[limits]
cpu_ms = 300000

[observability]
enabled = true

[triggers]
crons = ["0 * * * *"]
