minimum_pre_commit_version: '3.2.0'
default_install_hook_types:
  - pre-commit
  - commit-msg
default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: trailing-whitespace

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.25.2
    hooks:
      - id: zizmor
        args:
          - --offline
          - .github/workflows
          - actions

  - repo: local
    hooks:
      - id: pnpm-check-deps
        name: pnpm check:deps
        entry: pnpm check:deps
        language: system
        pass_filenames: false
        files: >-
          (?x)^(
            \.syncpackrc\.ts|
            package\.json|
            packages/[^/]+/package\.json|
            pnpm-lock\.yaml|
            pnpm-workspace\.yaml
          )$

      - id: pnpm-check-format
        name: pnpm check:format
        entry: pnpm check:format
        language: system
        pass_filenames: false
        files: >-
          (?x)^(
            \.editorconfig|
            \.markdownlint\.json|
            \.pre-commit-config\.yaml|
            \.prettierignore|
            \.prettierrc|
            \.syncpackrc\.ts|
            \.github/workflows/.+\.ya?ml|
            AGENTS\.md|
            actions/.+\.(json|ts|tsx|ya?ml)|
            CLAUDE\.md|
            PLAN\.md|
            eslint\.config\.ts|
            knip\.json|
            package\.json|
            packages/.+\.(json|sql|toml|ts|tsx)|
            pnpm-lock\.yaml|
            pnpm-workspace\.yaml|
            scripts/.+\.ts|
            tests/.+\.(json|ts|tsx)|
            tsconfig(\.base)?\.json
          )$

      - id: pnpm-check-lint
        name: pnpm check:lint
        entry: pnpm check:lint
        language: system
        pass_filenames: false
        files: &typescript_files >-
          (?x)^(
            \.syncpackrc\.ts|
            actions/.+\.(json|ts|tsx)|
            eslint\.config\.ts|
            package\.json|
            packages/.+\.(json|ts|tsx)|
            pnpm-lock\.yaml|
            pnpm-workspace\.yaml|
            scripts/.+\.ts|
            tests/.+\.(json|ts|tsx)|
            tsconfig(\.base)?\.json
          )$

      - id: pnpm-check-knip
        name: pnpm check:knip
        entry: pnpm check:knip
        language: system
        pass_filenames: false
        files: *typescript_files

      - id: pnpm-check-types
        name: pnpm check:types
        entry: pnpm check:types
        language: system
        pass_filenames: false
        files: >-
          (?x)^(
            actions/.+\.(json|ts|tsx)|
            packages/.+\.(json|toml|ts|tsx)|
            pnpm-lock\.yaml|
            scripts/.+\.ts|
            tests/.+\.(json|ts|tsx)|
            tsconfig(\.base)?\.json
          )$

      - id: pnpm-lint-commit-message
        name: pnpm lint:commit-messages
        entry: >-
          pnpm --config.verify-deps-before-run=false lint:commit-messages
          --no-colour --edit
        language: system
        stages:
          - commit-msg
